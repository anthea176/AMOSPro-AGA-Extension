name: R34 Gate A CPU 68000 and strict native source (candidate in memory)

on:
  push:
    branches: [main]
    paths:
      - "tools/m13_aga_fade_black_r34_emit.py"
      - "tools/build_m13_aga_fade_black_r34.py"
      - "tools/test_m13_aga_fade_black_r34.py"
      - ".github/workflows/r34-candidate-gate-a.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r34_gate_a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU emulation and disassembly dependencies
        run: python -m pip install capstone==5.0.9 unicorn==2.1.4
      - name: R34 actual native 68000 CPU Gate A
        run: python -B tools/test_m13_aga_fade_black_r34.py
      - name: R34 strict 68000 source export without modifying repository
        run: |
          python -B -c "import sys; sys.path.insert(0,'tools'); from build_m13_aga_fade_black_r34 import build; from pathlib import Path; Path('/tmp/AMOSPro_AGA_R34_GateA.Lib').write_bytes(build()[0])"
          python -B tools/generate_aga_native_source.py --lib /tmp/AMOSPro_AGA_R34_GateA.Lib --out /tmp/amos-aga-r34-native --baseline none --strict
      - name: Export identical R34 bytes for Gate A candidate publication
        run: python -B tools/build_m13_aga_fade_black_r34.py --emit-base64
