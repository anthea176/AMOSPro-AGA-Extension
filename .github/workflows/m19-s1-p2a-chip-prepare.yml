name: M19 S1-P2i integrated Sprite Gate A (source only)
on:
  push:
    branches: [main]
    paths:
      - 'src/native/m19_s1/M19_S1P2A_CHIP_PREPARE_MC68020.s'
      - 'src/native/m19_s1/M19_S1P1C_AGSP_VALIDATE_MC68020.s'
      - 'tools/test_m19_s1p2a_chip_prepare_cpu.py'
      - 'src/native/m19_s1/M19_S1P2E_RETIRE_MC68020.s'
      - 'tools/test_m19_s1p2e_retire_cpu.py'
      - 'src/native/m19_s1/M19_S1P2F_CLOSE_GUARD_MC68020.s'
      - 'tools/build_m19_s1p2f_close_guard_in_memory.py'
      - 'tools/test_m19_s1p2f_close_guard_cpu.py'
      - 'src/native/m19_s1/M19_S1P2G_RECLAIM_MC68020.s'
      - 'tools/test_m19_s1p2g_reclaim_cpu.py'
      - 'src/native/m19_s1/M19_S1P2H_PERSIST_ROOT_MC68020.s'
      - 'tools/test_m19_s1p2h_persist_root_cpu.py'
      - 'src/native/m19_s1/M19_S1P2I_CLOSE_ROOT_MC68020.s'
      - 'src/native/m19_s1/M19_S1P2I_PUBLIC_MC68020.s'
      - 'tools/build_m19_s1p2i_in_memory.py'
      - 'tools/test_m19_s1p2i_gate_a.py'
      - 'tools/m19_s1_agsp_bank.py'
      - 'docs/evidence/M19_S1P1I_AGSP_*'
      - '.github/workflows/m19-s1-p2a-chip-prepare.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore pinned VASM
        id: vasm-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vasm/vasmm68k_mot
          key: vasm-m68k-mot-${{ runner.os }}-${{ runner.arch }}-ubuntu2404-8b85ef6eb7d257bf29a56ddc63cf2be20a317256
      - name: Build pinned VASM on cache miss
        if: steps.vasm-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/vasm"
          git -C "$RUNNER_TEMP/vasm" init
          git -C "$RUNNER_TEMP/vasm" remote add origin https://github.com/rhargreaves/vasm.git
          git -C "$RUNNER_TEMP/vasm" fetch --depth 1 origin 8b85ef6eb7d257bf29a56ddc63cf2be20a317256
          git -C "$RUNNER_TEMP/vasm" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/vasm" rev-parse HEAD)" = 8b85ef6eb7d257bf29a56ddc63cf2be20a317256
          make -C "$RUNNER_TEMP/vasm" CPU=m68k SYNTAX=mot -j2
      - name: Install pinned MC68020 test tools
        run: python -m pip install --disable-pip-version-check unicorn==2.1.4 capstone==5.0.9
      - name: Assemble and execute detached Chip preparation
        run: |
          "$RUNNER_TEMP/vasm/vasmm68k_mot" -I src/native/m19_s1 -Fbin -m68020 -no-opt -quiet -o "$RUNNER_TEMP/p2a.bin" "src/native/m19_s1/M19_S1P2A_CHIP_PREPARE_MC68020.s"
          PYTHONPATH=tools python -B "tools/test_m19_s1p2a_chip_prepare_cpu.py" "$RUNNER_TEMP/p2a.bin"
      - name: Assemble and execute logical retirement (mocked OS)
        run: |
          "$RUNNER_TEMP/vasm/vasmm68k_mot" -Fbin -m68020 -no-opt -quiet -o "$RUNNER_TEMP/p2e.bin" "src/native/m19_s1/M19_S1P2E_RETIRE_MC68020.s"
          python -B "tools/test_m19_s1p2e_retire_cpu.py" "$RUNNER_TEMP/p2e.bin"
          python -B tools/native_cpu_policy.py --self-test
      - name: Assemble and execute persistent root (mocked Exec)
        run: |
          "$RUNNER_TEMP/vasm/vasmm68k_mot" -Fbin -m68020 -no-opt -quiet -o "$RUNNER_TEMP/p2h.bin" "src/native/m19_s1/M19_S1P2H_PERSIST_ROOT_MC68020.s"
          python -B "tools/test_m19_s1p2h_persist_root_cpu.py" "$RUNNER_TEMP/p2h.bin"
      - name: Rebuild exact P1i in memory and exercise both Close End routes
        run: |
          PYTHONPATH=tools python -B "tools/test_m19_s1p2f_close_guard_cpu.py" --vasm "$RUNNER_TEMP/vasm/vasmm68k_mot"
      - name: Rebuild P2g and exercise actual CloseScreen result and guarded FreeVec
        run: |
          PYTHONPATH=tools python -B "tools/test_m19_s1p2g_reclaim_cpu.py" --vasm "$RUNNER_TEMP/vasm/vasmm68k_mot"
      - name: Build integrated public Sprite and run full CPU Gate A
        run: |
          "$RUNNER_TEMP/vasm/vasmm68k_mot" -I src/native/m19_s1 -Fbin -m68020 -no-opt -quiet -o "$RUNNER_TEMP/p1i.bin" src/native/m19_s1/M19_S1P1I_BANK_PUBLIC_MC68020.s
          PYTHONPATH=tools python -B "tools/test_m19_s1p2i_gate_a.py" --vasm "$RUNNER_TEMP/vasm/vasmm68k_mot" --historical "$RUNNER_TEMP/p1i.bin" --full
      - name: Preserve exact installed P1i and protected L2b
        run: |
          printf '%s  %s\n' '2f3cb4adf56121f62aeccf9916d680ba3e2857c9bdbe0fda777d1d7eaed7ffc3' 'dist/AMOSPro_AGA.Lib' | sha256sum -c -
          printf '%s  %s\n' 'a7ed96e92b460e842772aed77ac35a303d8f663aaa456821c323109446dd19dc' 'dist/AMOSPro_AGA_LAST_GOOD.Lib' | sha256sum -c -
          git diff --exit-code
