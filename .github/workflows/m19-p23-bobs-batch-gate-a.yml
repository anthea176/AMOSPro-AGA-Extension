name: M19 P2.3 R86 native BOBS batch - Gate A

# Historical R86 Gate A is preserved for audit only.
# Never let this obsolete workflow overwrite a later dist candidate.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m19-p23-bobs-batch-main
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native MC68020 test dependencies
        run: python -m pip install --disable-pip-version-check unicorn==2.1.4 capstone==5.0.9
      - name: Single active ASC and RAM logging static preflight
        run: python -B tools/test_current_ram_log.py
      - name: Build R86 in memory
        run: python -B tools/build_m19_p23_bob_batch.py
      - name: Real 68020 BOBS Gate A - images, ABI, errors and front-buffer integrity
        run: python -B tools/test_m19_p23_bob_batch.py
      - name: Historical R86 source tested in memory only
        run: |
          echo "R86 was validated under run 43700178749."
          echo "No historical binary writes or promotions are permitted."
