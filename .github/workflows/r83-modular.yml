name: R83 three-module native Gate A

on:
  push:
    branches: [main]
    paths:
      - "tools/build_aga_r83_modular.py"
      - "dist/AMOSPro_AGA.Lib"
      - "dist/AMOSPro_AGA_LAST_GOOD.Lib"
      - ".github/workflows/r83-modular.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r83-gate-a:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install MC68020 emulator dependencies
        run: python -m pip install --disable-pip-version-check unicorn==2.1.4 capstone==5.0.9
      - name: Rebuild R83 from frozen R82 and prove all three native dispatchers
        run: python -B tools/build_aga_r83_modular.py --check-dist
