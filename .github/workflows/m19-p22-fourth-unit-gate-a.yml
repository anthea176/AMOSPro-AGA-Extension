name: M19 P2.2 fourth AP20 BOBS native unit probe - Gate A

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m19-p22-fourth-unit-gate-a-main
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MC68020 emulator
        run: python -m pip install --disable-pip-version-check unicorn==2.1.4 capstone==5.0.9
      - name: Build a fourth AP20 unit in memory (no release)
        run: python -B tools/build_m19_p22_fourth_unit_probe.py
      - name: Four native units Gate A, ABI safety, REAL 68020 dispatch and body
        run: python -B tools/test_m19_p22_fourth_unit_probe.py
      - name: Verify historical R85 builder did not alter R88 candidate
        run: |
          python -B tools/verify_fast.py
          git diff --exit-code -- dist/ tests/current/ tests/passed/
