name: M19 B8 private Clear Update transaction MC68020 Gate A

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m19-b8-clear-update-tx-gate-a.yml'
      - 'tools/m19_b8_clear_update_tx_emit.py'
      - 'tools/build_m19_b8_clear_update_tx_in_memory.py'
      - 'tools/test_m19_b8_clear_update_tx_gate_a.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b8-clear-update-private-stages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: m19-b8-tx-py312-machine68k040-unicorn214-v1
      - name: Install exact MC68020 CPU and HUNK dependencies
        run: python -m pip install --disable-pip-version-check capstone==5.0.9 unicorn==2.1.4 machine68k==0.4.0
      - name: Native CPU and source syntax policies
        run: |
          python -B -m py_compile tools/m19_b8_clear_update_tx_emit.py tools/build_m19_b8_clear_update_tx_in_memory.py tools/test_m19_b8_clear_update_tx_gate_a.py
          python -B tools/native_cpu_policy.py --self-test
          python -B tools/check_aga_delivery_paths.py --self-test
      - name: Verify AP20 private fifth group candidate in RAM
        run: python -B tools/build_m19_b8_clear_update_tx_in_memory.py
      - name: Verify original B7 full 64-image native preflight against real AGBO test fixture
        run: python -B tools/test_m19_p0j_frame_image_preflight_gate_a.py
      - name: Execute real MC68020 private stages and all failure paths
        run: python -B tools/test_m19_b8_clear_update_tx_gate_a.py
      - name: Protect installed B7-m2 and the single validated campaign ASC
        run: |
          python -B - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          expected={
            'dist/AMOSPro_AGA.Lib':'f4db949114517f8d3b4d39b70c60b4f63d8d51a6433fecdadbbbfce96bf6689d',
            'dist/AMOSPro_AGA_LAST_GOOD.Lib':'f4db949114517f8d3b4d39b70c60b4f63d8d51a6433fecdadbbbfce96bf6689d',
            'tests/current/M19_B8_BOB_CLEAR_UPDATE_BC_01.asc':'923f80ccf985e60a3952474fb63a3c8d19541f91f2adf9aecf6b8a14ad1c6fc8'
          }
          for path,hash_ in expected.items():
            assert sha256(Path(path).read_bytes()).hexdigest()==hash_,path
          print('PASS: B7-m2 / LAST_GOOD / sole ASC untouched')
          PY
