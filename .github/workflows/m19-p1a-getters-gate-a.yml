name: M19 P1a - Bob X Y I numeric getters MC68020 Gate A (source only)
on:
  push:
    branches: [main]
    paths:
      - 'tools/test_current_ram_log.py'
      - '.github/workflows/m19-p1a-getters-gate-a.yml'
      - 'tools/m19_p1a_bob_getters_emit.py'
      - 'tools/build_m19_p1a_getters_in_memory.py'
      - 'tools/test_m19_p1a_getters_gate_a.py'
      - 'tools/m19_b8_s1_bank_free_emit.py'
      - 'tools/build_m19_b8_s1_bank_free_in_memory.py'
      - 'tools/build_agapic_v2_r82_full_preview.py'
      - 'tools/build_agapic_v2_r82_api_preview.py'
      - 'tools/build_aga_r84_agapic.py'
      - 'tools/active_library.py'
      - 'dist/AMOSPro_AGA.Lib'
      - 'tools/test_m19_b8_clear_update_asc_static.py'
      - 'tests/current/M19_B8_BOB_CLEAR_UPDATE_BC_01.asc'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p1a-mc68020-only:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          # Exact S2r verification reads the SHA-pinned S2b predecessor.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MC68020 emulator and disassembler
        run: python -m pip install --disable-pip-version-check unicorn==2.1.4 capstone==5.0.9
      - name: Syntax, native CPU and delivery self-tests
        run: |
          python -B -m py_compile tools/m19_p1a_bob_getters_emit.py tools/build_m19_p1a_getters_in_memory.py tools/test_m19_p1a_getters_gate_a.py
          python -B tools/native_cpu_policy.py --self-test
          python -B tools/check_aga_delivery_paths.py --self-test
      - name: Deterministic source only AP20 candidate
        run: python -B tools/build_m19_p1a_getters_in_memory.py
      - name: Three numeric getters, native ABI and two AP20 relocations
        run: python -B tools/test_m19_p1a_getters_gate_a.py
      - name: Validate sole P1a ASC and RAM log contract (static only)
        run: |
          if test -f tests/current/M19_B8_BOB_CLEAR_UPDATE_BC_01.asc; then
            python -B tools/test_m19_b8_clear_update_asc_static.py
          else
            echo "SKIP historical B8 ASC check: campaign is not active"
          fi
          python -B tools/amos_preflight.py --strict-target tests/current/*.asc
          python -B tools/test_current_ram_log.py
      - name: Generators must not mutate the P1a canonical Lib or historic tests
        run: git diff --exit-code -- dist/ tests/current/ tests/passed/
