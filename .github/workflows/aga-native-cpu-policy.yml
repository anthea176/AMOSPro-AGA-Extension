name: AGA native CPU target policy

on:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'src/**'
      - '.github/workflows/aga-native-cpu-policy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/**'
      - 'src/**'
      - '.github/workflows/aga-native-cpu-policy.yml'

jobs:
  native-cpu-policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout full history for a reliable changed-files gate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run native CPU policy regression tests
        run: python3 -B tools/native_cpu_policy.py --self-test
      - name: Reject unreviewed CPU000 targets and misclassified ASM exports
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 -B tools/native_cpu_policy.py --base "$BASE_SHA" --head "$HEAD_SHA"
