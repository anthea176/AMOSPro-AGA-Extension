name: AGA native CPU and delivery path policies

on:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'src/**'
      - 'dist/**'
      - 'tests/current/**'
      - 'tests/proto/**'
      - 'tests/design/sprites_aga/**'
      - 'tests/passed/**'
      - 'tests/historical/**'
      - 'tests/fixtures/**'
      - 'examples/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'tools/**'
      - 'src/**'
      - 'dist/**'
      - 'tests/current/**'
      - 'tests/proto/**'
      - 'tests/design/sprites_aga/**'
      - 'tests/passed/**'
      - 'tests/historical/**'
      - 'tests/fixtures/**'
      - 'examples/**'
      - '.github/workflows/**'

jobs:
  native-cpu-and-delivery-policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout full history for changed-file gates
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run CPU and delivery policy regression tests
        run: |
          python3 -B tools/native_cpu_policy.py --self-test
          python3 -B tools/check_aga_delivery_paths.py --self-test
      - name: Block invalid CPU targets and noncanonical delivery paths
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python3 -B tools/native_cpu_policy.py --base "$BASE_SHA" --head "$HEAD_SHA"
          python3 -B tools/check_aga_delivery_paths.py --base "$BASE_SHA" --head "$HEAD_SHA"
