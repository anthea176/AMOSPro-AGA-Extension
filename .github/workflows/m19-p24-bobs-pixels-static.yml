name: M19 P2.4 archived UNVALIDATED design model - static only

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m19-p24-bobs-pixels-static.yml"
      - "tools/test_m19_p24_bobs_pixels_bench_static.py"
      - "tools/build_m19_p25_no_probe.py"
      - "tools/active_library.py"
      - "tests/current/*.asc"
      - "tests/design/M19_P24_BOBS_PIXELS_BENCH_01_UNVALIDATED.asc"
      - "tests/passed/M19_P23_BOBS_BATCH_01.asc"
      - "tests/current/README.md"
      - "tools/test_current_ram_log.py"
      - "dist/AMOSPro_AGA.Lib"
      - "dist/AMOSPro_AGA_LAST_GOOD.Lib"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Exact S2r verification reads the SHA-pinned S2b predecessor.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate installed candidate identity and protected R84
        run: python -B tools/verify_fast.py
      - name: Validate unique active AMOS source and RAM log
        run: python -B tools/test_current_ram_log.py
      - name: Archived design model only - not an AMOS executable qualification
        run: python -B tools/test_m19_p24_bobs_pixels_bench_static.py
      - name: Reject modified binary artifacts
        run: git diff --exit-code -- dist/AMOSPro_AGA.Lib dist/AMOSPro_AGA_LAST_GOOD.Lib
