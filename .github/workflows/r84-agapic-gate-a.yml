name: R84 AGAPIC v1-v2 in-memory native Gate A

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/r84-agapic-gate-a.yml"
      - "tools/build_aga_r84_agapic.py"
      - "tools/m16_agapic_info_emit.py"
      - "tools/m16_agapic_capture_v2_emit.py"
      - "tools/m16_capture_emit.py"
      - "tools/m16_capture_r47_core_emit.py"
      - "tools/m68k_emit.py"
      - "dist/AMOSPro_AGA_LAST_GOOD.Lib"
      - "docs/AGAPIC_R84_V1_V2_CONTRACT_2026-11-14.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r84-agapic-gate-a-main
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install 68020 emulator
        run: python -m pip install --disable-pip-version-check unicorn==2.1.4 capstone==5.0.9
      - name: R84 in-memory native structural and dispatcher tests
        run: python -B tools/build_aga_r84_agapic.py --gate-a
      - name: Historical v1/v2 host format regressions
        run: |
          python -B tools/test_m16_agapic_v2.py
          python -B tools/test_m16_agapic_capture_model.py
      - name: No official binary, active ASC or archive mutation
        run: git diff --exit-code -- dist/ tests/current/ tests/passed/ archive/
