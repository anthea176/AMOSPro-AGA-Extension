name: M13 R29 candidate Gate A

on:
  push:
    branches: [main]
    paths:
      - "tools/build_m13_palette_save_r29.py"
      - "tools/m13_palette_save_r29_emit.py"
      - "tools/test_m13_palette_save_r29.py"
      - ".github/workflows/m13-r29-gate-a.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r29-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native 68000 test dependencies
        run: python -m pip install capstone==5.0.9 unicorn==2.1.4
      - name: R29 CPU ABI IFF exact output and failure cleanup
        run: python -B tools/test_m13_palette_save_r29.py
      - name: Rebuild R29 in memory and provide exact candidate for archival
        run: |
          python -B tools/build_m13_palette_save_r29.py --emit-base64
          git diff --exit-code -- dist/AMOSPro_AGA.Lib dist/AMOSPro_AGA_LAST_GOOD.Lib
