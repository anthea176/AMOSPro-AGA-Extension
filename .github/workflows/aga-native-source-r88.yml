name: AGA historical R88 native source export - byte-exact Gate A

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aga-native-source-r88.yml"
      - "tools/generate_aga_multiunit_source.py"
      - "tools/generate_aga_native_source.py"
      - "tools/test_generate_aga_multiunit_source.py"
      - "tools/build_m19_p28_r88_in_memory.py"
      - "dist/AMOSPro_AGA.Lib"
      - "dist/AMOSPro_AGA_LAST_GOOD.Lib"
      - "EXPORT_REAL_SOURCE.bat"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-reconstruction:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify historical R88 from deterministic source with promoted P2d protected
        run: python -B tools/test_generate_aga_multiunit_source.py
      - name: Build vasm Motorola MC68020 assembler in temporary directory
        run: |
          mkdir -p "$RUNNER_TEMP/vasm"
          git -C "$RUNNER_TEMP/vasm" init
          git -C "$RUNNER_TEMP/vasm" remote add origin https://github.com/rhargreaves/vasm.git
          git -C "$RUNNER_TEMP/vasm" fetch --depth 1 origin 8b85ef6eb7d257bf29a56ddc63cf2be20a317256
          git -C "$RUNNER_TEMP/vasm" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/vasm" rev-parse HEAD)" = "8b85ef6eb7d257bf29a56ddc63cf2be20a317256"
          make -C "$RUNNER_TEMP/vasm" CPU=m68k SYNTAX=mot -j2
          test -x "$RUNNER_TEMP/vasm/vasmm68k_mot"
      - name: Assemble historical R88 four-unit AP20 from pinned builder (not active AP20 islands)
        env:
          VASM: ${{ runner.temp }}/vasm/vasmm68k_mot
          R88_OUT: ${{ runner.temp }}/aga-source-verify
        run: |
          python -B - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import json
          import os
          import sys
          root = Path.cwd()
          sys.path.insert(0, str(root / 'tools'))
          from active_library import P2D_SHA, S1P1E_SHA, P2DL2_SHA, R88_SHA, verify_active
          from build_m19_p28_r88_in_memory import build as build_r88
          from generate_aga_multiunit_source import export
          active = (root/'dist/AMOSPro_AGA.Lib').read_bytes()
          frozen = (root/'dist/AMOSPro_AGA_LAST_GOOD.Lib').read_bytes()
          assert len(frozen) == 136020 and sha256(frozen).hexdigest() == P2D_SHA
          assert sha256(active).hexdigest() in (P2D_SHA, S1P1E_SHA, P2DL2_SHA)
          checked, good, _ = verify_active(root)
          assert (checked, good) == (active, frozen)
          r88, meta = build_r88()
          assert len(r88) == 75040 and sha256(r88).hexdigest() == R88_SHA
          assert meta['sha256'] == R88_SHA and meta['entries'] == 88
          output = Path(os.environ['R88_OUT'])
          sources = export(r88, root=root, target=output, strict=True,
                           assembler=os.environ['VASM'])
          manifest = json.loads((output/'AMOSPro_AGA_R88_NATIVE.json').read_text())
          assert len(sources) == 7 and manifest['input_sha256'] == R88_SHA
          assert manifest['deterministic_builder_verified']
          assert manifest['exact_ap20_binary_roundtrip_verified']
          assert manifest['native_assembler_verified']
          assert (root/'dist/AMOSPro_AGA.Lib').read_bytes() == active
          assert (root/'dist/AMOSPro_AGA_LAST_GOOD.Lib').read_bytes() == frozen
          print('R88 HISTORICAL BYTE-EXACT VASM GATE A PASS; promoted P2d untouched')
          PY
      - name: Archive only R88 audit ASM and JSON manifest
        uses: actions/upload-artifact@v4
        with:
          name: AGA_R88_MC68020_BYTE_EXACT_ASM
          path: |
            ${{ runner.temp }}/aga-source-verify/*.s
            ${{ runner.temp }}/aga-source-verify/*.json
          retention-days: 30
          if-no-files-found: error
      - name: Ensure protected binaries and AMOS tests are not modified
        run: |
          git diff --exit-code -- dist/ tests/current/ tests/passed/
