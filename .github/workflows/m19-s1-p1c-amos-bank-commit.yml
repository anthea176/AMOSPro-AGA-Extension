name: M19 S1-P1c-d AGSP native capture pipeline and Sprite Bank AP20 candidate MC68020
on:
  push:
    branches: [main]
    paths:
      - 'src/native/m19_s1/M19_S1P1C_AGSP_BANK_COMMIT_MC68020.s'
      - 'tools/test_m19_s1p1c_amos_bank_commit.py'
      - 'tools/test_m19_s1p1c_pipeline.py'
      - 'tools/build_m19_s1p1c_private_ap20.py'
      - 'tools/test_m19_s1p1c_private_ap20.py'
      - 'tools/test_m19_s1p1d_public_bank.py'
      - 'tools/build_m19_s1p1d_sprite_bank_ap20.py'
      - 'tools/test_m19_s1p1d_public_ap20.py'
      - 'src/native/m19_s1/M19_S1P1E_GET_PUBLIC_MC68020.s'
      - 'tools/build_m19_s1p1e_get_sprite_ap20.py'
      - 'tools/test_m19_s1p1e_get_sprite_cpu.py'
      - 'tools/test_m19_s1p1e_get_sprite_ap20.py'
      - 'tools/m19_s1p1e_make_fixture.py'
      - 'tests/proto/agsp_capture/**'
      - 'docs/M19_S1_P1E_GET_AGA_SPRITE_2026-11-23.md'
      - 'src/native/m19_s1/M19_S1P1D_BANK_PUBLIC_MC68020.s'
      - 'tools/test_m19_s1p1c_agsp_validate.py'
      - 'docs/M19_S1_P1C_AGSP_AMOS_BANK_COMMIT_2026-11-23.md'
      - '.github/workflows/m19-s1-p1c-amos-bank-commit.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/native/m19_s1/M19_S1P1C_AGSP_BANK_COMMIT_MC68020.s'
      - 'tools/test_m19_s1p1c_amos_bank_commit.py'
      - '.github/workflows/m19-s1-p1c-amos-bank-commit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  agsp-amos-data-publisher:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout read-only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce native CPU policy
        run: |
          python -B tools/native_cpu_policy.py --self-test
          python -B -m py_compile tools/test_m19_s1p1c_amos_bank_commit.py tools/test_m19_s1p1c_agsp_validate.py tools/test_m19_s1p1c_pipeline.py tools/build_m19_s1p1c_private_ap20.py tools/test_m19_s1p1c_private_ap20.py tools/test_m19_s1p1d_public_bank.py tools/build_m19_s1p1d_sprite_bank_ap20.py tools/test_m19_s1p1d_public_ap20.py tools/build_m19_s1p1e_get_sprite_ap20.py tools/test_m19_s1p1e_get_sprite_cpu.py tools/test_m19_s1p1e_get_sprite_ap20.py tools/m19_s1p1e_make_fixture.py
          python -B tools/amos_preflight.py --strict-target tests/proto/agsp_capture/GET_AGA_SPRITE.asc
          python -B tools/m19_s1p1e_make_fixture.py --output "$RUNNER_TEMP/AGSP_CAPTURE_320X256.iff"
          python -B tools/m19_s1p1e_make_fixture.py --check --output "$RUNNER_TEMP/AGSP_CAPTURE_320X256.iff"
      - name: Restore pinned VASM
        id: vasm-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vasm/vasmm68k_mot
          key: vasm-m68k-mot-${{ runner.os }}-${{ runner.arch }}-ubuntu2404-8b85ef6eb7d257bf29a56ddc63cf2be20a317256
      - name: Build pinned VASM on cache miss
        if: steps.vasm-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/vasm"
          git -C "$RUNNER_TEMP/vasm" init
          git -C "$RUNNER_TEMP/vasm" remote add origin https://github.com/rhargreaves/vasm.git
          git -C "$RUNNER_TEMP/vasm" fetch --depth 1 origin 8b85ef6eb7d257bf29a56ddc63cf2be20a317256
          git -C "$RUNNER_TEMP/vasm" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/vasm" rev-parse HEAD)" = 8b85ef6eb7d257bf29a56ddc63cf2be20a317256
          make -C "$RUNNER_TEMP/vasm" CPU=m68k SYNTAX=mot -j2
      - name: Assemble publisher MC68020
        run: |
          "$RUNNER_TEMP/vasm/vasmm68k_mot" -Fbin -m68020 -no-opt -quiet -o "$RUNNER_TEMP/agsp_publish_mc68020.bin" src/native/m19_s1/M19_S1P1C_AGSP_BANK_COMMIT_MC68020.s
          "$RUNNER_TEMP/vasm/vasmm68k_mot" -Fbin -m68020 -no-opt -quiet -o "$RUNNER_TEMP/agsp_validate_mc68020.bin" src/native/m19_s1/M19_S1P1C_AGSP_VALIDATE_MC68020.s
          "$RUNNER_TEMP/vasm/vasmm68k_mot" -I src/native/m19_s1 -Fbin -m68020 -no-opt -quiet -o "$RUNNER_TEMP/agsp_pipeline_mc68020.bin" src/native/m19_s1/M19_S1P1C_CAPTURE_PIPELINE_MC68020.s
          "$RUNNER_TEMP/vasm/vasmm68k_mot" -I src/native/m19_s1 -Fbin -m68020 -no-opt -quiet -o "$RUNNER_TEMP/agsp_select_mc68020.bin" src/native/m19_s1/M19_S1P1D_BANK_PUBLIC_MC68020.s
          test -s "$RUNNER_TEMP/agsp_select_mc68020.bin"
          test -s "$RUNNER_TEMP/agsp_pipeline_mc68020.bin"
          test -s "$RUNNER_TEMP/agsp_validate_mc68020.bin"
          test -s "$RUNNER_TEMP/agsp_publish_mc68020.bin"
      - name: Install Unicorn MC68020 emulator
        run: python -m pip install --disable-pip-version-check 'unicorn>=2.1,<2.2'
      - name: Execute real publisher with mocked AMOS Main services
        env:
          AGSP_PUBLISH_BIN: ${{ runner.temp }}/agsp_publish_mc68020.bin
          AGSP_VALIDATE_BIN: ${{ runner.temp }}/agsp_validate_mc68020.bin
          AGSP_PIPELINE_BIN: ${{ runner.temp }}/agsp_pipeline_mc68020.bin
          AGSP_SELECT_BIN: ${{ runner.temp }}/agsp_select_mc68020.bin
          AGSP_GET_BIN: ${{ runner.temp }}/agsp_select_mc68020.bin
        run: |
          PYTHONPATH=tools python -B -m unittest discover -s tools -p 'test_m19_s1p1c_amos_bank_commit.py' -v
          PYTHONPATH=tools python -B -m unittest discover -s tools -p 'test_m19_s1p1c_agsp_validate.py' -v
          PYTHONPATH=tools python -B -m unittest discover -s tools -p 'test_m19_s1p1c_pipeline.py' -v
          PYTHONPATH=tools python -B -m unittest discover -s tools -p 'test_m19_s1p1c_private_ap20.py' -v
          PYTHONPATH=tools python -B -m unittest discover -s tools -p 'test_m19_s1p1d_public_bank.py' -v
          PYTHONPATH=tools python -B -m unittest discover -s tools -p 'test_m19_s1p1d_public_ap20.py' -v
          PYTHONPATH=tools python -B -m unittest discover -s tools -p 'test_m19_s1p1e_get_sprite_cpu.py' -v
          PYTHONPATH=tools python -B -m unittest discover -s tools -p 'test_m19_s1p1e_get_sprite_ap20.py' -v
      - name: Verify active identity and reconstruct frozen S1-P1e in memory
        run: |
          PYTHONPATH=tools python -B - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import os
          from active_library import verify_active, P2D_SHA, P2DL2_SHA, S1P1E_SHA
          from build_m19_s1p1e_get_sprite_ap20 import build_get_aga_sprite_candidate
          active, protected, label = verify_active(Path('.'))
          assert sha256(protected).hexdigest() == P2D_SHA
          assert sha256(active).hexdigest() in (P2D_SHA, P2DL2_SHA, S1P1E_SHA)
          image, meta = build_get_aga_sprite_candidate(
              (Path(os.environ['RUNNER_TEMP']) / 'agsp_select_mc68020.bin').read_bytes())
          assert len(image) == 142000 and sha256(image).hexdigest() == S1P1E_SHA
          if sha256(active).hexdigest() == S1P1E_SHA:
              assert image == active
          print('Frozen S1-P1e source identity PASS; current:', label, meta)
          PY
          git diff --exit-code -- dist/ tests/current/ tests/passed/
