name: M19 B8 S1 bounded SafePort Clear native Gate A

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m19-b8-safe-retry-gate-a.yml'
      - 'tools/m19_b8_safe_retry_emit.py'
      - 'tools/build_m19_b8_safe_retry_in_memory.py'
      - 'tools/test_m19_b8_safe_retry_gate_a.py'
      - 'tools/active_library.py'
      - 'dist/AMOSPro_AGA.Lib'
      - 'tests/current/*.asc'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-wait-clear:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact Unicorn MC68020 and disassembler
        run: python -m pip install --disable-pip-version-check capstone==5.0.9 unicorn==2.1.4 machine68k==0.4.0
      - name: Source syntax and project delivery policies
        run: |
          python -B -m py_compile tools/m19_b8_safe_retry_emit.py tools/build_m19_b8_safe_retry_in_memory.py tools/test_m19_b8_safe_retry_gate_a.py
          python -B tools/native_cpu_policy.py --self-test
          python -B tools/check_aga_delivery_paths.py --self-test
      - name: Build B8 S1 exact AP20 source in memory
        run: python -B tools/build_m19_b8_safe_retry_in_memory.py
      - name: Run real native bounded WaitTOF Clear, 2 placements and negatives
        run: python -B tools/test_m19_b8_safe_retry_gate_a.py
      - name: Historical B8 first Update, B7 native and Safe regressions
        run: |
          python -B tools/test_m19_b8_safe_lifecycle_gate_a.py
          python -B tools/test_m19_b8_clear_update_tx_gate_a.py
          python -B tools/test_m19_b8_first_update_gate_a.py
      - name: Protect historical B8 and current exact L2b LAST_GOOD
        run: |
          python -B - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          from sys import path
          path.insert(0,'tools')
          from active_library import verify_active, frozen_p2d, P2D_SHA, P2DL2B_SHA, SPRITE_L2B_HISTORICAL_SHAS
          active,good,label=verify_active(Path('.'))
          assert sha256(active).hexdigest() in (P2DL2B_SHA,*SPRITE_L2B_HISTORICAL_SHAS)
          assert len(good)==136708 and sha256(good).hexdigest()==P2DL2B_SHA
          assert sha256(frozen_p2d(good)).hexdigest()==P2D_SHA
          print('PASS historical B8 native tests; exact current and protected L2b:', label)
          PY
      - name: Emit audited bytes for the authorized S1 installation
        if: "${{ contains(github.event.head_commit.message, '[b8safe-emit]') }}"
        run: python -B tools/build_m19_b8_safe_retry_in_memory.py --emit-base64
