name: M19 S1-P2l-b diagnostic campaign ASC preflight
on:
  push:
    branches: [main]
    paths:
      - 'tools/prepare_m19_s1p2l_b_campaign.py'
      - '.github/workflows/m19-s1-p2l-b-campaign-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check and prepare without activating
        run: |
          python -B tools/native_cpu_policy.py --self-test
          python -B tools/check_aga_delivery_paths.py --self-test
          git show dc73ab6a055e6e02d991568b134ee5975b1c0a11:tests/current/SPRITE_PUBLIC.asc > "$RUNNER_TEMP/P2K_SOURCE.asc"
          python -B tools/prepare_m19_s1p2l_b_campaign.py "$RUNNER_TEMP/P2K_SOURCE.asc" "$RUNNER_TEMP/SPRITE_PUBLIC.asc"
          python -B tools/amos_preflight.py --strict-target --fail-on-warnings "$RUNNER_TEMP/SPRITE_PUBLIC.asc"
          python -B tools/verify_m19_s1p2l_b_delivery.py
          printf '%s  %s\n' 'a7ed96e92b460e842772aed77ac35a303d8f663aaa456821c323109446dd19dc' 'dist/AMOSPro_AGA_LAST_GOOD.Lib' | sha256sum -c -
          # Exact active ASC checked together with the Lib by the pair verifier.
          git diff --exit-code
