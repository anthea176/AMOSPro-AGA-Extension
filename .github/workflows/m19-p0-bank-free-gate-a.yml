name: M19 P0 Bank Select + Bank Free native Gate A

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m19-p0-bank-free-gate-a.yml'
      - 'tools/m19_b8_s1_bank_free_emit.py'
      - 'tools/build_m19_b8_s1_bank_free_in_memory.py'
      - 'tools/test_m19_b8_s1_bank_free_gate_a.py'
      - 'tools/m19_b8_s1_bank_prestage_emit.py'
      - 'tools/build_m19_b8_s1_bank_prestage_in_memory.py'
      - 'tools/test_m19_b8_s1_bank_prestage_gate_a.py'
      - 'dist/AMOSPro_AGA.Lib'
      - 'tests/current/*.asc'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bank-free-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU simulator dependencies
        run: python -m pip install --disable-pip-version-check capstone==5.0.9 unicorn==2.1.4 machine68k==0.4.0
      - name: Source syntax and CPU minimum
        run: |
          python -B -m py_compile tools/m19_b8_s1_bank_free_emit.py tools/build_m19_b8_s1_bank_free_in_memory.py tools/test_m19_b8_s1_bank_free_gate_a.py
          python -B tools/native_cpu_policy.py --self-test
          python -B tools/check_aga_delivery_paths.py --self-test
      - name: Rebuild exact Bank Free AP20 entirely in memory
        run: python -B tools/build_m19_b8_s1_bank_free_in_memory.py
      - name: Run earlier Bank Select native 104-check baseline
        run: python -B tools/test_m19_b8_s1_bank_prestage_gate_a.py
      - name: Run new Bank Free native 68020 tests
        run: python -B tools/test_m19_b8_s1_bank_free_gate_a.py
      - name: Protect installed S1 or exact Bank Free, R84 and one active ASC
        run: |
          python -B - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          current=sha256(Path('dist/AMOSPro_AGA.Lib').read_bytes()).hexdigest()
          assert current in ('3d00b745591533a66d76c8c6e28fc8eca86da795e2e5e0cee06a6e22f548292a','f4db949114517f8d3b4d39b70c60b4f63d8d51a6433fecdadbbbfce96bf6689d')
          assert sha256(Path('dist/AMOSPro_AGA_LAST_GOOD.Lib').read_bytes()).hexdigest()=='f4db949114517f8d3b4d39b70c60b4f63d8d51a6433fecdadbbbfce96bf6689d'
          assert len(list(Path('tests/current').glob('*.asc')))==1
          print('PASS: protected B8 S1/P0 Bank Free, R84 LAST_GOOD and one ASC')
          PY
      - name: Emit audited Bank Free Lib base64 for authorized one-time installation
        if: "${{ contains(github.event.head_commit.message, '[p0-free-emit]') }}"
        run: python -B tools/build_m19_b8_s1_bank_free_in_memory.py --emit-base64
