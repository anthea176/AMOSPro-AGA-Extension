name: Artifact integrity

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/workflows/artifact-integrity.yml"
      - "README.md"
      - "README.fr.md"
      - "INSTALL.md"
      - "INSTALL.fr.md"
      - "examples/**"
      - "EXTENSION_SOURCE_RULES.md"
      - "docs/GENERIC_CPU_TESTS.json"
      - "docs/GENERIC_R2_CPU_TESTS.json"
      - "docs/GENERIC_R2_VALIDATION.json"
      - "docs/ILBM_INVENTORY.json"
      - "docs/ILBM_INVENTORY.md"
      - "archive/**/*.Lib"
      - "dist/**/*.Lib"
      - "tools/build_*.py"
      - "tools/test_*.py"
      - "tools/agapal_r30_layout.py"
      - "tests/design/*.asc"
      - "tests/current/*.asc"
      - "tests/passed/*.asc"
      - "tools/audit_ap20.py"
      - "tools/check_no_blocking_waits.py"
      - "tools/verify_artifacts.py"
      - "tools/m8_idcmp_r23_emit.py"
      - "tools/m9_hotspot_r24_emit.py"
      - "tools/m10_rect_overlap_r25_emit.py"
      - "tools/m11_text_r26_emit.py"
      - "tools/m12_blit_safe_r27_emit.py"
      - "tools/m13_palette_r28_emit.py"
      - "tools/m13_palette_save_r29_emit.py"
      - "tools/m13_agapal_r30_emit.py"
      - "tools/m68k_emit.py"
      - "tools/validate_ilbm.py"
      - "tools/decoder68k.py"
      - "tools/generate_aga_native_source.py"
      - "tests/test_native_source.py"

permissions:
  contents: read

concurrency:
  group: artifact-integrity-main
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify current HUNK files and exact committed artifacts
        run: python -B tools/verify_artifacts.py
      - name: R30 AGAPAL in-memory layout and reference ABK envelope (format only)
        run: python -B tools/test_agapal_r30_layout.py
      - name: Verify every AP20 instruction/function is documented in README
        run: python -B tools/test_readme_api_coverage.py
      - name: Verify seven distribution examples (static syntax, ILBM and packaging)
        run: python -B tools/test_examples.py
      - name: Validate M7 Copper API staging contract (static only)
        run: python -B tools/test_m7_copper_contract.py
      - name: Check AMOS Copper/Mouse/Hotspot/Rect function syntax
        run: python -B tools/test_amos_copper_syntax.py
      - name: Check AMOS block syntax in the unique active test
        run: python -B tools/test_current_amos_blocks.py
      - name: Verify safe native 68000 source export (R23 strict)
        run: |
          python -B -m unittest discover -s tests -p 'test_native_source.py' -v
          python -B tools/generate_aga_native_source.py --lib dist/AMOSPro_AGA.Lib --out /tmp/amos-aga-native --baseline none --strict
          git diff --exit-code -- dist/AMOSPro_AGA.Lib dist/AMOSPro_AGA_LAST_GOOD.Lib
      - name: Install 68000 verification dependencies
        run: python -m pip install capstone==5.0.9 unicorn==2.1.4
      - name: M13 R29 current IFF palette save — native 68000 Gate A
        run: |
          python -B tools/test_m13_palette_save_r29.py
          python -B -c "from sys import path; path.insert(0,'tools'); from build_m13_palette_save_r29 import build,ARCHIVE,DEST,LAST_GOOD; b,meta=build(); assert b==ARCHIVE.read_bytes()==DEST.read_bytes()==LAST_GOOD.read_bytes(); print('R29 current/archive/LAST_GOOD match:',meta['sha256'],meta['size'])"
          sha256sum dist/AMOSPro_AGA.Lib dist/AMOSPro_AGA_LAST_GOOD.Lib dist/experimental/AMOSPro_AGA_M13_v0.10.1_PALETTE_SAVE_R29.Lib
          git diff --exit-code -- dist/AMOSPro_AGA.Lib dist/AMOSPro_AGA_LAST_GOOD.Lib dist/experimental/AMOSPro_AGA_M13_v0.10.1_PALETTE_SAVE_R29.Lib
      - name: M13 R30 AGAPAL Bank Init — native 68000 Gate A (in-memory builder only)
        run: |
          python -B tools/test_m13_agapal_r30.py
          python -B tools/build_m13_agapal_r30.py --emit-base64
          git diff --exit-code -- dist/AMOSPro_AGA.Lib dist/AMOSPro_AGA_LAST_GOOD.Lib
      - name: M13 R28 frozen IFF palette — native 68000 regression
        run: |
          python -B tools/test_m13_palette_r28.py
          python -B -c "from sys import path; path.insert(0,'tools'); from build_m13_palette_r28 import build,ARCHIVE; b,meta=build(); assert b==ARCHIVE.read_bytes(); print('R28 frozen archive:',meta['sha256'],meta['size'])"
          sha256sum dist/AMOSPro_AGA_LAST_GOOD.Lib dist/experimental/AMOSPro_AGA_M13_v0.10.0_PALETTE_BASE_R28.Lib
          git diff --exit-code -- dist/AMOSPro_AGA.Lib dist/AMOSPro_AGA_LAST_GOOD.Lib dist/experimental/AMOSPro_AGA_M13_v0.10.0_PALETTE_BASE_R28.Lib

      - name: M12 R27 frozen archive — native 68000 CPU regression and integrity
        run: |
          python -B tools/test_m12_blit_safe_r27.py
          python -B -c "from sys import path; path.insert(0,'tools'); from build_m12_blit_safe_r27 import build,ARCHIVE,DEST; raw,info=build(); assert raw==ARCHIVE.read_bytes(); from pathlib import Path; assert raw==ARCHIVE.read_bytes(); print('R27 frozen archive matches',info)"
          sha256sum dist/AMOSPro_AGA_LAST_GOOD.Lib dist/experimental/AMOSPro_AGA_M13_v0.10.0_PALETTE_BASE_R28.Lib dist/experimental/AMOSPro_AGA_M12_v0.9.3_SAFE_BLITTER_R27.Lib
          git diff --exit-code -- dist/AMOSPro_AGA.Lib dist/AMOSPro_AGA_LAST_GOOD.Lib dist/experimental/AMOSPro_AGA_M12_v0.9.3_SAFE_BLITTER_R27.Lib dist/experimental/AMOSPro_AGA_M11_v0.9.2_TEXT_R26.Lib

      - name: M11 R26 AGA Text frozen archive — 68000 CPU regression
        run: |
          python -B tools/test_m11_text_r26.py
          python -B -c "from sys import path; path.insert(0,'tools'); from build_m11_text_r26 import build,ARCHIVE; raw,info=build(); assert raw==ARCHIVE.read_bytes(); print('R26 archive matches',info)"
          sha256sum dist/experimental/AMOSPro_AGA_M11_v0.9.2_TEXT_R26.Lib
          git diff --exit-code -- dist/AMOSPro_AGA.Lib dist/AMOSPro_AGA_LAST_GOOD.Lib dist/experimental/AMOSPro_AGA_M11_v0.9.2_TEXT_R26.Lib dist/experimental/AMOSPro_AGA_M10_v0.9.1_RECT_OVERLAP_R25.Lib

      - name: M10 R25 AABB rectangle overlap — frozen 68000 CPU archive regression
        run: |
          python -B tools/test_m10_rect_overlap_r25.py
          python -B tools/build_m10_rect_overlap_r25.py
          python -B -c "from sys import path; path.insert(0,'tools'); from build_m10_rect_overlap_r25 import build,ARCHIVE; raw,info=build(); assert raw==ARCHIVE.read_bytes(); print('R25 frozen archive matches',info)"
          sha256sum dist/experimental/AMOSPro_AGA_M10_v0.9.1_RECT_OVERLAP_R25.Lib
          git diff --exit-code -- dist/AMOSPro_AGA.Lib dist/AMOSPro_AGA_LAST_GOOD.Lib dist/experimental/AMOSPro_AGA_M10_v0.9.1_RECT_OVERLAP_R25.Lib

      - name: M9 R24 Hotspot Hit — frozen 68000 archive regression
        run: |
          python -B tools/test_m9_hotspot_hit_r24.py
          python -B tools/build_m9_hotspot_hit_r24.py
          python -B -c "from sys import path; path.insert(0,'tools'); from build_m9_hotspot_hit_r24 import build,ARCHIVE; binary, info=build(); assert binary==ARCHIVE.read_bytes(); print('Frozen R24 archive matches',info)"
          sha256sum dist/experimental/AMOSPro_AGA_M9_v0.9.0_HOTSPOT_HIT_R24.Lib
          git diff --exit-code -- dist/AMOSPro_AGA.Lib dist/AMOSPro_AGA_LAST_GOOD.Lib dist/experimental/AMOSPro_AGA_M9_v0.9.0_HOTSPOT_HIT_R24.Lib

      - name: R23 IDCMP mouse + RAWKEY FIFO — frozen archive regression
        run: |
          python -B tools/test_m8_idcmp_r23_preflight.py
          python -B tools/build_m8_idcmp_r23.py
          python -B -c "from sys import path; path.insert(0,'tools'); from build_m8_idcmp_r23 import build,ARCHIVE; binary,info=build(); assert binary==ARCHIVE.read_bytes(); print('Frozen R23 archive matches',info)"
          sha256sum dist/experimental/AMOSPro_AGA_M8_v0.8.7_IDCMP_MOUSE_R23.Lib
          git diff --exit-code -- dist/AMOSPro_AGA.Lib dist/AMOSPro_AGA_LAST_GOOD.Lib dist/experimental/AMOSPro_AGA_M8_v0.8.7_IDCMP_MOUSE_R23.Lib

      - name: Validate every repository ILBM and execute current CPU tests
        run: |
          python -B tools/validate_ilbm.py
          python -B tools/test_m5_generic.py
          python -B tools/test_m5_generic_r2.py
          python -B tools/test_ntsc_pal_r10.py
          python -B tools/test_newscreen_a0_r12.py
          python -B tools/check_no_blocking_waits.py
          git diff --exit-code -- docs/ILBM_INVENTORY.json docs/ILBM_INVENTORY.md docs/GENERIC_CPU_TESTS.json
          git diff --exit-code -- docs/GENERIC_R2_CPU_TESTS.json docs/GENERIC_R2_VALIDATION.json
          git diff --exit-code -- dist/AMOSPro_AGA.Lib dist/AMOSPro_AGA_LAST_GOOD.Lib
          git diff --exit-code -- dist/experimental/AMOSPro_AGA_M5_v0.6.3_NEWSCREEN_A0_R12.Lib

      - name: Validate R15 Clear, R14 Fill and R13 Copy regressions on 68000
        run: |
          python -B tools/test_m6_blit_copy_r13.py
          python -B tools/test_m6_blit_fill_r14.py
          python -B tools/test_m6_blit_clear_r15.py

      - name: Regression R16 Copper Clear native 68000 ABI and ownership
        run: |
          python -B tools/test_m7_copper_clear_r16.py
          python -B tools/build_m7_copper_clear_r16.py
          git diff --exit-code -- dist/experimental/AMOSPro_AGA_M7_v0.8.0_COPPER_CLEAR_R16.Lib

      - name: Validate frozen R17 Copper On/Off CPU regression
        run: |
          python -B tools/test_m7_copper_on_off_r17.py
          python -B tools/build_m7_copper_on_off_r17.py
          git diff --exit-code -- dist/experimental/AMOSPro_AGA_M7_v0.8.1_COPPER_ON_OFF_R17.Lib

      - name: Regression R18 native Copper Wait/Move/End (archived)
        run: |
          python -B tools/test_m7_copper_raster_r18.py
          python -B tools/build_m7_copper_raster_r18.py
          git diff --exit-code -- dist/experimental/AMOSPro_AGA_M7_v0.8.2_COPPER_RASTER_R18.Lib

      - name: Validate frozen R19 native mouse position regression
        run: |
          python -B tools/test_m8_mouse_position_r19.py
          python -B -c "from sys import path; path.insert(0,'tools'); from build_m8_mouse_position_r19 import build,ARCHIVE; assert build()[0] == ARCHIVE.read_bytes()"
          git diff --exit-code -- dist/experimental/AMOSPro_AGA_M8_v0.8.3_MOUSE_POSITION_R19.Lib

      - name: Regression R20 native mouse buttons, frozen archive
        run: |
          python -B tools/test_m8_mouse_buttons_r20.py
          python -B tools/build_m8_mouse_buttons_r20.py
          python -B -c "from sys import path; path.insert(0,'tools'); from build_m8_mouse_buttons_r20 import build,ARCHIVE; assert build()[0] == ARCHIVE.read_bytes()"
          git diff --exit-code -- dist/experimental/AMOSPro_AGA_M8_v0.8.4_MOUSE_BUTTONS_R20.Lib

      - name: Regression R21 RMBTRAP frozen 68000 code
        run: |
          python -B tools/test_m8_rmbtrap_r21.py
          python -B tools/build_m8_rmbtrap_r21.py
          python -B -c "from sys import path; path.insert(0,'tools'); from build_m8_rmbtrap_r21 import build,ARCHIVE; assert build()[0] == ARCHIVE.read_bytes()"
          git diff --exit-code -- dist/experimental/AMOSPro_AGA_M8_v0.8.5_RMBTRAP_R21.Lib

      - name: Regression R22 frozen mouse edge CPU ABI (archive only)
        run: |
          python -B tools/test_m8_mouse_edges_r22.py
          python -B -c "from sys import path; path.insert(0,'tools'); from build_m8_mouse_edges_r22 import build,ARCHIVE; assert build()[0]==ARCHIVE.read_bytes()"
          sha256sum dist/experimental/AMOSPro_AGA_M8_v0.8.6_MOUSE_EDGES_R22.Lib
          git diff --exit-code -- dist/experimental/AMOSPro_AGA_M8_v0.8.6_MOUSE_EDGES_R22.Lib dist/experimental/AMOSPro_AGA_M8_v0.8.5_RMBTRAP_R21.Lib
          git diff --exit-code -- dist/AMOSPro_AGA_LAST_GOOD.Lib dist/AMOSPro_AGA.Lib
