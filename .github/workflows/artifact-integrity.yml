name: Artifact integrity

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/workflows/artifact-integrity.yml"
      - "README.md"
      - "README.fr.md"
      - "INSTALL.md"
      - "INSTALL.fr.md"
      - "examples/**"
      - "EXTENSION_SOURCE_RULES.md"
      - "docs/GENERIC_CPU_TESTS.json"
      - "docs/GENERIC_R2_CPU_TESTS.json"
      - "docs/GENERIC_R2_VALIDATION.json"
      - "docs/ILBM_INVENTORY.json"
      - "docs/ILBM_INVENTORY.md"
      - "archive/**/*.Lib"
      - "dist/**/*.Lib"
      - "tools/build_*.py"
      - "tools/test_*.py"
      - "tools/agapal_r30_layout.py"
      - "tests/design/*.asc"
      - "tests/current/*.asc"
      - "tests/passed/*.asc"
      - "tools/audit_ap20.py"
      - "tools/check_no_blocking_waits.py"
      - "tools/verify_artifacts.py"
      - "tools/m8_idcmp_r23_emit.py"
      - "tools/m9_hotspot_r24_emit.py"
      - "tools/m10_rect_overlap_r25_emit.py"
      - "tools/m11_text_r26_emit.py"
      - "tools/m12_blit_safe_r27_emit.py"
      - "tools/m13_palette_r28_emit.py"
      - "tools/m13_palette_save_r29_emit.py"
      - "tools/m13_agapal_r30_emit.py"
      - "tools/m13_agapal_capture_r31_emit.py"
      - "tools/m13_agapal_apply_r32_emit.py"
      - "tools/m13_agapal_fade_r33_emit.py"
      - "tools/m13_aga_fade_black_r34_emit.py"
      - "tools/m13_aga_fade_white_r35_emit.py"
      - "tools/m13_palette_cycle_r36_emit.py"
      - "tools/m68k_emit.py"
      - "tools/validate_ilbm.py"
      - "tools/decoder68k.py"
      - "tools/generate_aga_native_source.py"
      - "tests/test_native_source.py"

permissions:
  contents: read

concurrency:
  group: artifact-integrity-main
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify current HUNK files and exact committed artifacts
        run: python -B tools/verify_artifacts.py
      - name: R30 AGAPAL in-memory layout and reference ABK envelope (format only)
        run: python -B tools/test_agapal_r30_layout.py
      - name: Verify every AP20 instruction/function is documented in README
        run: python -B tools/test_readme_api_coverage.py
      - name: Verify eight distribution examples (static syntax, ILBM and packaging)
        run: python -B tools/test_examples.py
      - name: Validate M7 Copper API staging contract (static only)
        run: python -B tools/test_m7_copper_contract.py
      - name: Check AMOS Copper/Mouse/Hotspot/Rect function syntax
        run: python -B tools/test_amos_copper_syntax.py
      - name: Check AMOS block syntax in the unique active test
        run: python -B tools/test_current_amos_blocks.py
      - name: Verify safe native 68000 source export (R23 strict)
        run: |
          python -B -m unittest discover -s tests -p 'test_native_source.py' -v
          python -B tools/generate_aga_native_source.py --lib dist/AMOSPro_AGA.Lib --out /tmp/amos-aga-native --baseline none --strict
          git diff --exit-code -- dist/AMOSPro_AGA.Lib dist/AMOSPro_AGA_LAST_GOOD.Lib
      - name: Install 68000 verification dependencies
        run: python -m pip install capstone==5.0.9 unicorn==2.1.4
      - name: M13 R29 frozen IFF palette save — native 68000 regression
        run: |
          python -B tools/test_m13_palette_save_r29.py
          python -B -c "from sys import path; path.insert(0,'tools'); from build_m13_palette_save_r29 import build,ARCHIVE; b,meta=build(); assert b==ARCHIVE.read_bytes(); print('R29 frozen archive:',meta['sha256'],meta['size'])"
          sha256sum dist/experimental/AMOSPro_AGA_M13_v0.10.1_PALETTE_SAVE_R29.Lib
          git diff --exit-code -- dist/AMOSPro_AGA.Lib dist/AMOSPro_AGA_LAST_GOOD.Lib dist/experimental/AMOSPro_AGA_M13_v0.10.1_PALETTE_SAVE_R29.Lib
      - name: M13 R30 frozen AGAPAL Bank Init — native 68000 regression
        run: |
          python -B tools/test_m13_agapal_r30.py
          python -B -c "from sys import path; path.insert(0,'tools'); from build_m13_agapal_r30 import build; from pathlib import Path; Path('/tmp/AMOSPro_AGA_R30_GateA.Lib').write_bytes(build()[0])"
          python -B tools/generate_aga_native_source.py --lib /tmp/AMOSPro_AGA_R30_GateA.Lib --out /tmp/amos-aga-r30-native --baseline none --strict
          python -B -c "from sys import path; path.insert(0,'tools'); from build_m13_agapal_r30 import build,ARCHIVE; b,meta=build(); assert b==ARCHIVE.read_bytes(), 'R30 frozen archive mismatch'; print('R30 frozen archive match:',meta['sha256'],meta['size'])"
          sha256sum dist/experimental/AMOSPro_AGA_M13_v0.10.2_AGAPAL_BANK_INIT_R30.Lib
          git diff --exit-code -- dist/AMOSPro_AGA.Lib dist/AMOSPro_AGA_LAST_GOOD.Lib dist/experimental/AMOSPro_AGA_M13_v0.10.2_AGAPAL_BANK_INIT_R30.Lib
      - name: M13 R31 frozen AGAPAL Capture — native 68000 regression
        run: |
          python -B tools/test_m13_agapal_capture_r31.py
          python -B -c "from sys import path; path.insert(0,'tools'); from build_m13_agapal_capture_r31 import build; from pathlib import Path; Path('/tmp/AMOSPro_AGA_R31_GateA.Lib').write_bytes(build()[0])"
          python -B tools/generate_aga_native_source.py --lib /tmp/AMOSPro_AGA_R31_GateA.Lib --out /tmp/amos-aga-r31-native --baseline none --strict
          python -B -c "from sys import path; path.insert(0,'tools'); from build_m13_agapal_capture_r31 import build,ARCHIVE; b,meta=build(); assert b==ARCHIVE.read_bytes(), 'R31 frozen archive mismatch'; print('R31 frozen archive match:',meta['sha256'],meta['size'])"
          sha256sum dist/AMOSPro_AGA_LAST_GOOD.Lib dist/experimental/AMOSPro_AGA_M13_v0.10.3_AGAPAL_BANK_CAPTURE_R31.Lib
          git diff --exit-code -- dist/AMOSPro_AGA.Lib dist/AMOSPro_AGA_LAST_GOOD.Lib dist/experimental/AMOSPro_AGA_M13_v0.10.3_AGAPAL_BANK_CAPTURE_R31.Lib
      - name: M13 R32 frozen AGAPAL Apply — native 68000 Gate A archive
        run: |
          python -B tools/test_m13_agapal_apply_r32.py
          python -B -c "from sys import path; path.insert(0,'tools'); from build_m13_agapal_apply_r32 import build; from pathlib import Path; Path('/tmp/AMOSPro_AGA_R32_GateA.Lib').write_bytes(build()[0])"
          python -B tools/generate_aga_native_source.py --lib /tmp/AMOSPro_AGA_R32_GateA.Lib --out /tmp/amos-aga-r32-native --baseline none --strict
          python -B -c "from sys import path; path.insert(0,'tools'); from build_m13_agapal_apply_r32 import build,ARCHIVE; b,meta=build(); assert b==ARCHIVE.read_bytes(), 'R32 frozen archive mismatch'; print('R32 frozen archive match:',meta['sha256'],meta['size'])"
          sha256sum dist/AMOSPro_AGA.Lib dist/experimental/AMOSPro_AGA_M13_v0.10.4_AGAPAL_BANK_APPLY_R32.Lib
          git diff --exit-code -- dist/AMOSPro_AGA.Lib dist/AMOSPro_AGA_LAST_GOOD.Lib dist/experimental/AMOSPro_AGA_M13_v0.10.4_AGAPAL_BANK_APPLY_R32.Lib
      - name: M13 R33 frozen Fade To Bank — native CPU 68000 Gate A archive
        run: |
          python -B tools/test_m13_agapal_fade_r33.py
          python -B -c "from sys import path; path.insert(0,'tools'); from build_m13_agapal_fade_r33 import build; from pathlib import Path; Path('/tmp/AMOSPro_AGA_R33_GateA.Lib').write_bytes(build()[0])"
          python -B tools/generate_aga_native_source.py --lib /tmp/AMOSPro_AGA_R33_GateA.Lib --out /tmp/amos-aga-r33-native --baseline none --strict
          python -B -c "from sys import path; path.insert(0,'tools'); from build_m13_agapal_fade_r33 import build,ARCHIVE; b,meta=build(); assert b==ARCHIVE.read_bytes(), 'R33 frozen archive mismatch'; print('R33 frozen archive:',meta['sha256'],meta['size'])"
          sha256sum dist/AMOSPro_AGA.Lib dist/experimental/AMOSPro_AGA_M13_v0.10.5_AGAPAL_FADE_TO_BANK_R33.Lib dist/AMOSPro_AGA_LAST_GOOD.Lib
          git diff --exit-code -- dist/AMOSPro_AGA.Lib dist/AMOSPro_AGA_LAST_GOOD.Lib dist/experimental/AMOSPro_AGA_M13_v0.10.5_AGAPAL_FADE_TO_BANK_R33.Lib

      - name: M13 R34 frozen Fade To Black — Gate A CPU 68000 archive
        run: |
          python -B tools/test_m13_aga_fade_black_r34.py
          python -B -c "import sys; sys.path.insert(0,'tools'); from build_m13_aga_fade_black_r34 import build; from pathlib import Path; Path('/tmp/AMOSPro_AGA_R34_GateA.Lib').write_bytes(build()[0])"
          python -B tools/generate_aga_native_source.py --lib /tmp/AMOSPro_AGA_R34_GateA.Lib --out /tmp/amos-aga-r34-native --baseline none --strict
          python -B -c "import sys; sys.path.insert(0,'tools'); from build_m13_aga_fade_black_r34 import build,ARCHIVE; b,meta=build(); assert b==ARCHIVE.read_bytes(), 'R34 archive mismatch'; print('R34 frozen archive:',meta['sha256'],meta['size'])"
          sha256sum dist/AMOSPro_AGA.Lib dist/experimental/AMOSPro_AGA_M13_v0.10.6_AGA_FADE_TO_BLACK_R34.Lib dist/AMOSPro_AGA_LAST_GOOD.Lib
          git diff --exit-code -- dist/AMOSPro_AGA.Lib dist/AMOSPro_AGA_LAST_GOOD.Lib dist/experimental/AMOSPro_AGA_M13_v0.10.6_AGA_FADE_TO_BLACK_R34.Lib

      - name: M13 R35 frozen Fade To White — Gate A CPU 68000 archive
        run: |
          python -B tools/test_m13_aga_fade_white_r35.py
          python -B -c "import sys; sys.path.insert(0,'tools'); from build_m13_aga_fade_white_r35 import build; from pathlib import Path; Path('/tmp/AMOSPro_AGA_R35_GateA.Lib').write_bytes(build()[0])"
          python -B tools/generate_aga_native_source.py --lib /tmp/AMOSPro_AGA_R35_GateA.Lib --out /tmp/amos-aga-r35-native --baseline none --strict
          python -B -c "import sys; sys.path.insert(0,'tools'); from build_m13_aga_fade_white_r35 import build,ARCHIVE; b,meta=build(); assert b==ARCHIVE.read_bytes(), 'R35 frozen archive mismatch'; print('R35 frozen archive:',meta['sha256'],meta['size'])"
          sha256sum dist/AMOSPro_AGA.Lib dist/experimental/AMOSPro_AGA_M13_v0.10.7_AGA_FADE_TO_WHITE_R35.Lib dist/AMOSPro_AGA_LAST_GOOD.Lib
          git diff --exit-code -- dist/AMOSPro_AGA.Lib dist/AMOSPro_AGA_LAST_GOOD.Lib dist/experimental/AMOSPro_AGA_M13_v0.10.7_AGA_FADE_TO_WHITE_R35.Lib

      - name: M13 R36 frozen Palette Cycle — Gate A CPU 68000 + immutable archive
        run: |
          python -B tools/test_m13_palette_cycle_r36.py
          python -B -c "import sys; sys.path.insert(0,'tools'); from build_m13_palette_cycle_r36 import build; from pathlib import Path; Path('/tmp/AMOSPro_AGA_R36_GateA.Lib').write_bytes(build()[0])"
          python -B tools/generate_aga_native_source.py --lib /tmp/AMOSPro_AGA_R36_GateA.Lib --out /tmp/amos-aga-r36-native --baseline none --strict
          python -B -c "import sys; sys.path.insert(0,'tools'); from build_m13_palette_cycle_r36 import build,ARCHIVE,DEST,LAST_GOOD; b,meta=build(); assert b==ARCHIVE.read_bytes(), 'R36 immutable archive mismatch'; print('R36 frozen archive:',meta['sha256'],meta['size'])"
          sha256sum dist/AMOSPro_AGA.Lib dist/experimental/AMOSPro_AGA_M13_v0.10.8_PALETTE_CYCLE_R36.Lib dist/AMOSPro_AGA_LAST_GOOD.Lib
          git diff --exit-code -- dist/AMOSPro_AGA.Lib dist/AMOSPro_AGA_LAST_GOOD.Lib dist/experimental/AMOSPro_AGA_M13_v0.10.8_PALETTE_CYCLE_R36.Lib

      - name: M14 R37 frozen Font Select — Gate A/B CPU, source, archive integrity
        run: |
          python -B tools/test_m14_font_select_r37.py
          python -B -c "import sys; sys.path.insert(0,'tools'); from build_m14_font_select_r37 import build,ARCHIVE,LAST_GOOD; raw,meta=build(); assert raw==ARCHIVE.read_bytes()==LAST_GOOD.read_bytes(); print('R37 archived/LAST_GOOD:',meta['sha256'],meta['size'])"
          python -B tools/generate_aga_native_source.py --lib dist/AMOSPro_AGA.Lib --out /tmp/amos-aga-r37-integrity --baseline none --strict
          sha256sum dist/AMOSPro_AGA.Lib dist/experimental/AMOSPro_AGA_M14_v0.10.9_FONT_SELECT_R37.Lib dist/AMOSPro_AGA_LAST_GOOD.Lib
          git diff --exit-code -- dist/AMOSPro_AGA.Lib dist/AMOSPro_AGA_LAST_GOOD.Lib dist/experimental/AMOSPro_AGA_M14_v0.10.9_FONT_SELECT_R37.Lib

      - name: M14 R38 Gate A BankFont — CPU 68000, R37 LAST_GOOD and candidate integrity
        run: |
          python -B tools/test_m14_font_bank_r38.py
          python -B -c "import sys; sys.path.insert(0,'tools'); from build_m14_font_bank_r38 import build,ARCHIVE,DEST,LAST_GOOD,BASE_SHA256; from ap20_utils import digest; raw,meta=build(); assert raw==ARCHIVE.read_bytes()==DEST.read_bytes() and digest(LAST_GOOD.read_bytes())==BASE_SHA256; print('R38 candidate:',meta['sha256'],meta['size'])"
          python -B tools/generate_aga_native_source.py --lib dist/AMOSPro_AGA.Lib --out /tmp/amos-aga-r38-integrity --baseline none --strict
          sha256sum dist/AMOSPro_AGA.Lib dist/experimental/AMOSPro_AGA_M14_v0.11.0_AMCAF_BANK_R38.Lib dist/AMOSPro_AGA_LAST_GOOD.Lib
          git diff --exit-code -- dist/AMOSPro_AGA.Lib dist/experimental/AMOSPro_AGA_M14_v0.11.0_AMCAF_BANK_R38.Lib dist/AMOSPro_AGA_LAST_GOOD.Lib

      - name: M13 R28 frozen IFF palette — native 68000 regression
        run: |
          python -B tools/test_m13_palette_r28.py
          python -B -c "from sys import path; path.insert(0,'tools'); from build_m13_palette_r28 import build,ARCHIVE; b,meta=build(); assert b==ARCHIVE.read_bytes(); print('R28 frozen archive:',meta['sha256'],meta['size'])"
          sha256sum dist/AMOSPro_AGA_LAST_GOOD.Lib dist/experimental/AMOSPro_AGA_M13_v0.10.0_PALETTE_BASE_R28.Lib
          git diff --exit-code -- dist/AMOSPro_AGA.Lib dist/AMOSPro_AGA_LAST_GOOD.Lib dist/experimental/AMOSPro_AGA_M13_v0.10.0_PALETTE_BASE_R28.Lib

      - name: M12 R27 frozen archive — native 68000 CPU regression and integrity
        run: |
          python -B tools/test_m12_blit_safe_r27.py
          python -B -c "from sys import path; path.insert(0,'tools'); from build_m12_blit_safe_r27 import build,ARCHIVE,DEST; raw,info=build(); assert raw==ARCHIVE.read_bytes(); from pathlib import Path; assert raw==ARCHIVE.read_bytes(); print('R27 frozen archive matches',info)"
          sha256sum dist/AMOSPro_AGA_LAST_GOOD.Lib dist/experimental/AMOSPro_AGA_M13_v0.10.0_PALETTE_BASE_R28.Lib dist/experimental/AMOSPro_AGA_M12_v0.9.3_SAFE_BLITTER_R27.Lib
          git diff --exit-code -- dist/AMOSPro_AGA.Lib dist/AMOSPro_AGA_LAST_GOOD.Lib dist/experimental/AMOSPro_AGA_M12_v0.9.3_SAFE_BLITTER_R27.Lib dist/experimental/AMOSPro_AGA_M11_v0.9.2_TEXT_R26.Lib

      - name: M11 R26 AGA Text frozen archive — 68000 CPU regression
        run: |
          python -B tools/test_m11_text_r26.py
          python -B -c "from sys import path; path.insert(0,'tools'); from build_m11_text_r26 import build,ARCHIVE; raw,info=build(); assert raw==ARCHIVE.read_bytes(); print('R26 archive matches',info)"
          sha256sum dist/experimental/AMOSPro_AGA_M11_v0.9.2_TEXT_R26.Lib
          git diff --exit-code -- dist/AMOSPro_AGA.Lib dist/AMOSPro_AGA_LAST_GOOD.Lib dist/experimental/AMOSPro_AGA_M11_v0.9.2_TEXT_R26.Lib dist/experimental/AMOSPro_AGA_M10_v0.9.1_RECT_OVERLAP_R25.Lib

      - name: M10 R25 AABB rectangle overlap — frozen 68000 CPU archive regression
        run: |
          python -B tools/test_m10_rect_overlap_r25.py
          python -B tools/build_m10_rect_overlap_r25.py
          python -B -c "from sys import path; path.insert(0,'tools'); from build_m10_rect_overlap_r25 import build,ARCHIVE; raw,info=build(); assert raw==ARCHIVE.read_bytes(); print('R25 frozen archive matches',info)"
          sha256sum dist/experimental/AMOSPro_AGA_M10_v0.9.1_RECT_OVERLAP_R25.Lib
          git diff --exit-code -- dist/AMOSPro_AGA.Lib dist/AMOSPro_AGA_LAST_GOOD.Lib dist/experimental/AMOSPro_AGA_M10_v0.9.1_RECT_OVERLAP_R25.Lib

      - name: M9 R24 Hotspot Hit — frozen 68000 archive regression
        run: |
          python -B tools/test_m9_hotspot_hit_r24.py
          python -B tools/build_m9_hotspot_hit_r24.py
          python -B -c "from sys import path; path.insert(0,'tools'); from build_m9_hotspot_hit_r24 import build,ARCHIVE; binary, info=build(); assert binary==ARCHIVE.read_bytes(); print('Frozen R24 archive matches',info)"
          sha256sum dist/experimental/AMOSPro_AGA_M9_v0.9.0_HOTSPOT_HIT_R24.Lib
          git diff --exit-code -- dist/AMOSPro_AGA.Lib dist/AMOSPro_AGA_LAST_GOOD.Lib dist/experimental/AMOSPro_AGA_M9_v0.9.0_HOTSPOT_HIT_R24.Lib

      - name: R23 IDCMP mouse + RAWKEY FIFO — frozen archive regression
        run: |
          python -B tools/test_m8_idcmp_r23_preflight.py
          python -B tools/build_m8_idcmp_r23.py
          python -B -c "from sys import path; path.insert(0,'tools'); from build_m8_idcmp_r23 import build,ARCHIVE; binary,info=build(); assert binary==ARCHIVE.read_bytes(); print('Frozen R23 archive matches',info)"
          sha256sum dist/experimental/AMOSPro_AGA_M8_v0.8.7_IDCMP_MOUSE_R23.Lib
          git diff --exit-code -- dist/AMOSPro_AGA.Lib dist/AMOSPro_AGA_LAST_GOOD.Lib dist/experimental/AMOSPro_AGA_M8_v0.8.7_IDCMP_MOUSE_R23.Lib

      - name: Validate every repository ILBM and execute current CPU tests
        run: |
          python -B tools/validate_ilbm.py
          python -B tools/test_m5_generic.py
          python -B tools/test_m5_generic_r2.py
          python -B tools/test_ntsc_pal_r10.py
          python -B tools/test_newscreen_a0_r12.py
          python -B tools/check_no_blocking_waits.py
          git diff --exit-code -- docs/ILBM_INVENTORY.json docs/ILBM_INVENTORY.md docs/GENERIC_CPU_TESTS.json
          git diff --exit-code -- docs/GENERIC_R2_CPU_TESTS.json docs/GENERIC_R2_VALIDATION.json
          git diff --exit-code -- dist/AMOSPro_AGA.Lib dist/AMOSPro_AGA_LAST_GOOD.Lib
          git diff --exit-code -- dist/experimental/AMOSPro_AGA_M5_v0.6.3_NEWSCREEN_A0_R12.Lib

      - name: Validate R15 Clear, R14 Fill and R13 Copy regressions on 68000
        run: |
          python -B tools/test_m6_blit_copy_r13.py
          python -B tools/test_m6_blit_fill_r14.py
          python -B tools/test_m6_blit_clear_r15.py

      - name: Regression R16 Copper Clear native 68000 ABI and ownership
        run: |
          python -B tools/test_m7_copper_clear_r16.py
          python -B tools/build_m7_copper_clear_r16.py
          git diff --exit-code -- dist/experimental/AMOSPro_AGA_M7_v0.8.0_COPPER_CLEAR_R16.Lib

      - name: Validate frozen R17 Copper On/Off CPU regression
        run: |
          python -B tools/test_m7_copper_on_off_r17.py
          python -B tools/build_m7_copper_on_off_r17.py
          git diff --exit-code -- dist/experimental/AMOSPro_AGA_M7_v0.8.1_COPPER_ON_OFF_R17.Lib

      - name: Regression R18 native Copper Wait/Move/End (archived)
        run: |
          python -B tools/test_m7_copper_raster_r18.py
          python -B tools/build_m7_copper_raster_r18.py
          git diff --exit-code -- dist/experimental/AMOSPro_AGA_M7_v0.8.2_COPPER_RASTER_R18.Lib

      - name: Validate frozen R19 native mouse position regression
        run: |
          python -B tools/test_m8_mouse_position_r19.py
          python -B -c "from sys import path; path.insert(0,'tools'); from build_m8_mouse_position_r19 import build,ARCHIVE; assert build()[0] == ARCHIVE.read_bytes()"
          git diff --exit-code -- dist/experimental/AMOSPro_AGA_M8_v0.8.3_MOUSE_POSITION_R19.Lib

      - name: Regression R20 native mouse buttons, frozen archive
        run: |
          python -B tools/test_m8_mouse_buttons_r20.py
          python -B tools/build_m8_mouse_buttons_r20.py
          python -B -c "from sys import path; path.insert(0,'tools'); from build_m8_mouse_buttons_r20 import build,ARCHIVE; assert build()[0] == ARCHIVE.read_bytes()"
          git diff --exit-code -- dist/experimental/AMOSPro_AGA_M8_v0.8.4_MOUSE_BUTTONS_R20.Lib

      - name: Regression R21 RMBTRAP frozen 68000 code
        run: |
          python -B tools/test_m8_rmbtrap_r21.py
          python -B tools/build_m8_rmbtrap_r21.py
          python -B -c "from sys import path; path.insert(0,'tools'); from build_m8_rmbtrap_r21 import build,ARCHIVE; assert build()[0] == ARCHIVE.read_bytes()"
          git diff --exit-code -- dist/experimental/AMOSPro_AGA_M8_v0.8.5_RMBTRAP_R21.Lib

      - name: Regression R22 frozen mouse edge CPU ABI (archive only)
        run: |
          python -B tools/test_m8_mouse_edges_r22.py
          python -B -c "from sys import path; path.insert(0,'tools'); from build_m8_mouse_edges_r22 import build,ARCHIVE; assert build()[0]==ARCHIVE.read_bytes()"
          sha256sum dist/experimental/AMOSPro_AGA_M8_v0.8.6_MOUSE_EDGES_R22.Lib
          git diff --exit-code -- dist/experimental/AMOSPro_AGA_M8_v0.8.6_MOUSE_EDGES_R22.Lib dist/experimental/AMOSPro_AGA_M8_v0.8.5_RMBTRAP_R21.Lib
          git diff --exit-code -- dist/AMOSPro_AGA_LAST_GOOD.Lib dist/AMOSPro_AGA.Lib
