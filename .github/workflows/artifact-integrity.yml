name: Artifact integrity

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/workflows/artifact-integrity.yml"
      - ".github/workflows/artifact-regression-full.yml"
      - "README.md"
      - "README.fr.md"
      - "INSTALL.md"
      - "INSTALL.fr.md"
      - "examples/**"
      - "EXTENSION_SOURCE_RULES.md"
      - "docs/GENERIC_CPU_TESTS.json"
      - "docs/GENERIC_R2_CPU_TESTS.json"
      - "docs/GENERIC_R2_VALIDATION.json"
      - "docs/ILBM_INVENTORY.json"
      - "docs/ILBM_INVENTORY.md"
      - "archive/**/*.Lib"
      - "dist/**/*.Lib"
      - "tools/build_*.py"
      - "tools/compiler_relocation.py"
      - "tools/test_*.py"
      - "tools/agapal_r30_layout.py"
      - "tools/m16_agapic.py"
      - "tools/m16_agapic_capture_model.py"
      - "tools/m16_agapic_convert.py"
      - "tools/m16_agapic_sample.py"
      - "tests/design/*.asc"
      - "tests/design/*.abk"
      - "tests/current/*.asc"
      - "tests/passed/*.asc"
      - "tools/audit_ap20.py"
      - "tools/check_no_blocking_waits.py"
      - "tools/verify_artifacts.py"
      - "tools/verify_fast.py"
      - "tools/m8_idcmp_r23_emit.py"
      - "tools/m9_hotspot_r24_emit.py"
      - "tools/m10_rect_overlap_r25_emit.py"
      - "tools/m11_text_r26_emit.py"
      - "tools/m12_blit_safe_r27_emit.py"
      - "tools/m13_palette_r28_emit.py"
      - "tools/m13_palette_save_r29_emit.py"
      - "tools/m13_agapal_r30_emit.py"
      - "tools/m13_agapal_capture_r31_emit.py"
      - "tools/m13_agapal_apply_r32_emit.py"
      - "tools/m13_agapal_fade_r33_emit.py"
      - "tools/m13_aga_fade_black_r34_emit.py"
      - "tools/m13_aga_fade_white_r35_emit.py"
      - "tools/m13_palette_cycle_r36_emit.py"
      - "tools/m15bis_cursor_r44_emit.py"
      - "tools/m16_image_draw_r45_emit.py"
      - "tools/m16_capture_r47_core_emit.py"
      - "tools/m16_capture_r47_emit.py"
      - "tools/build_m16_image_draw_r46.py"
      - "tools/test_m16_image_draw_r46.py"
      - "tools/m15_box_r42_emit.py"
      - "tools/m15_draw_r41_emit.py"
      - "tools/m15_plot_r40_emit.py"
      - "tools/m68k_emit.py"
      - "tools/validate_ilbm.py"
      - "tools/decoder68k.py"
      - "tools/generate_aga_native_source.py"
      - "tests/test_native_source.py"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artifact-integrity-main
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fast frozen SHA256 HUNK AP20 and compiler-safe artifact integrity
        run: python -B tools/verify_fast.py
      - name: Current compiler-safe builder and relocation regressions
        run: |
          python -B tools/build_aga_current.py --verify
          python -B tools/test_aga_compiler_bridge_r46.py
          python -B tools/test_compiler_relocation.py
      - name: Public API examples and safety preflight
        run: |
          python -B tools/test_readme_api_coverage.py
          python -B tools/test_examples.py
          python -B tools/test_current_amos_blocks.py
          python -B tools/check_no_blocking_waits.py
      - name: M16 AGAPIC image and capture host contract
        run: |
          python -B tools/test_m16_agapic.py
          python -B tools/test_m16_agapic_capture_model.py
      - name: Install current native Gate A dependencies
        run: python -m pip install capstone==5.0.9 unicorn==2.1.4
      - name: M16 R47 current native CPU and compiler-safe wrapper tests
        run: |
          python -B tools/test_m16_capture_r47_core.py
          python -B tools/test_m16_capture_r47_build.py
          python -B tools/test_m16_capture_r47_unicorn.py
      - name: Export candidate M16 R47 binary in CI logs for exact archival (NOT LAST_GOOD)
        run: python -B tools/build_m16_capture_r47.py --emit-base64
      - name: Ensure no official or historical Lib was written
        run: git diff --exit-code -- dist/ archive/
