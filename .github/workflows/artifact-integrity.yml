name: Artifact integrity

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/workflows/artifact-integrity.yml"
      - ".github/workflows/artifact-regression-full.yml"
      - "README.md"
      - "README.fr.md"
      - "INSTALL.md"
      - "INSTALL.fr.md"
      - "examples/**"
      - "EXTENSION_SOURCE_RULES.md"
      - "docs/GENERIC_CPU_TESTS.json"
      - "docs/GENERIC_R2_CPU_TESTS.json"
      - "docs/GENERIC_R2_VALIDATION.json"
      - "docs/ILBM_INVENTORY.json"
      - "docs/ILBM_INVENTORY.md"
      - "archive/**/*.Lib"
      - "dist/**/*.Lib"
      - "tools/build_*.py"
      - "tools/compiler_relocation.py"
      - "tools/test_*.py"
      - "tools/m17_blit_group_r55_emit.py"
      - "tools/m17_r56_rastport_emit.py"
      - "tools/build_m17_r57_rastport.py"
      - "tools/test_m17_r57_rastport.py"
      - "tools/agapal_r30_layout.py"
      - "tools/m16_agapic.py"
      - "tools/m18_agapic_atlas_model.py"
      - "tools/test_m18_agapic_atlas_model.py"
      - "tools/m18_icon_atlas_model.py"
      - "tools/test_m18_icon_atlas_model.py"
      - "tools/m18_ficon16_model.py"
      - "tools/m18_ficon16_native_aligned_emit.py"
      - "tools/m18_ficon16_native_shifted_emit.py"
      - "tools/m18_ficon_ap20_emit.py"
      - "tools/m18_ficon16_abk.py"
      - "tools/test_m18_ficon16_abk.py"
      - "tools/build_m18_r61_ficon.py"
      - "tools/test_m18_r61_ficon_gate_a.py"
      - "tools/test_m18_ficon16_native_shifted.py"
      - "tools/m18_ficon16_native_stage_emit.py"
      - "tools/test_m18_ficon16_native_stage.py"
      - "tools/test_m18_ficon16_native_aligned.py"
      - "tools/test_m18_ficon16_model.py"
      - "tools/m18_ficon16_convert.py"
      - "tools/test_m18_ficon16_convert.py"
      - "tools/test_m18_benchmark_static.py"
      - "benchmarks/m18_r60_cpu_vs_blit_16x16.asc"
      - "tools/m18_image_region_emit.py"
      - "tools/m16_agapic_capture_model.py"
      - "tools/m16_agapic_convert.py"
      - "tools/m16_agapic_sample.py"
      - "tests/design/*.asc"
      - "tests/design/*.abk"
      - "tests/current/*.asc"
      - "tests/passed/*.asc"
      - "tools/audit_ap20.py"
      - "tools/check_no_blocking_waits.py"
      - "tools/verify_artifacts.py"
      - "tools/verify_fast.py"
      - "tools/m8_idcmp_r23_emit.py"
      - "tools/m9_hotspot_r24_emit.py"
      - "tools/m10_rect_overlap_r25_emit.py"
      - "tools/m11_text_r26_emit.py"
      - "tools/m12_blit_safe_r27_emit.py"
      - "tools/m13_palette_r28_emit.py"
      - "tools/m13_palette_save_r29_emit.py"
      - "tools/m13_agapal_r30_emit.py"
      - "tools/m13_agapal_capture_r31_emit.py"
      - "tools/m13_agapal_apply_r32_emit.py"
      - "tools/m13_agapal_fade_r33_emit.py"
      - "tools/m13_aga_fade_black_r34_emit.py"
      - "tools/m13_aga_fade_white_r35_emit.py"
      - "tools/m13_palette_cycle_r36_emit.py"
      - "tools/m15bis_cursor_r44_emit.py"
      - "tools/m16_image_draw_r45_emit.py"
      - "tools/m16_capture_r47_core_emit.py"
      - "tools/m16_capture_r47_emit.py"
      - "tools/m16_capture_emit.py"
      - "tools/amos_main_abi.py"
      - "tools/amos_link_test_support.py"
      - "tests/fixtures/amos_main_declarations.json"
      - "tools/build_m16_image_draw_r46.py"
      - "tools/test_m16_image_draw_r46.py"
      - "tools/m15_box_r42_emit.py"
      - "tools/m15_draw_r41_emit.py"
      - "tools/m15_plot_r40_emit.py"
      - "tools/m68k_emit.py"
      - "tools/validate_ilbm.py"
      - "tools/decoder68k.py"
      - "tools/generate_aga_native_source.py"
      - "tests/test_native_source.py"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artifact-integrity-main
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fast frozen SHA256 HUNK AP20 and compiler-safe artifact integrity
        run: python -B tools/verify_fast.py
      - name: Current compiler-safe builder and relocation regressions
        run: |
          python -B tools/build_aga_current.py --verify
          python -B tools/test_aga_compiler_bridge_r46.py
          python -B tools/test_compiler_relocation.py
      - name: Strict native source export for pinned current and LAST_GOOD
        run: python -B tools/test_generate_current_native_source.py
      - name: Public API examples and safety preflight
        run: |
          python -B tools/test_readme_api_coverage.py
          python -B tools/test_examples.py
          python -B tools/test_current_amos_blocks.py
          python -B tools/check_no_blocking_waits.py
      - name: M16 AGAPIC image and capture host contract
        run: |
          python -B tools/test_m16_agapic.py
          python -B tools/test_m16_agapic_capture_model.py
      - name: M18 AGAPIC atlas P0 host-only pixel and memory contract
        run: python -B tools/test_m18_agapic_atlas_model.py
      - name: M18 numbered icon atlas P0 host-only contract
        run: python -B tools/test_m18_icon_atlas_model.py
      - name: M18 P1 Unity Fast Icon 16x16 CPU/word Blitter model (host only)
        run: python -B tools/test_m18_ficon16_model.py
      - name: M18 P1 strict AGAPIC to Fast Icon conversion (host only)
        run: python -B tools/test_m18_ficon16_convert.py
      - name: M18 16x16 CPU/Blitter baseline benchmark static ASC preflight
        run: python -B tools/test_m18_benchmark_static.py
      - name: Install current native Gate A dependencies
        run: python -m pip install capstone==5.0.9 unicorn==2.1.4
      - name: M18/P2 288-byte native Fast to Chip staging CPU Gate A
        run: python -B tools/test_m18_ficon16_native_stage.py
      - name: M18/P3 pixel-exact arbitrary X native Fast Icon CPU Gate A
        run: python -B tools/test_m18_ficon16_native_shifted.py
      - name: M18/P4 FIcon bank and Safe AP20 Compiler V2 Gate A (in memory)
        run: |
          python -B tools/test_m18_r61_ficon_gate_a.py
          python -B tools/test_m18_ficon16_abk.py
          python -B tools/build_m18_r61_ficon.py --emit-base64
          python -B tools/m18_ficon16_abk.py --emit-base64
      - name: Corrected capture linkage and public AP20 CPU regression
        run: |
          python -B tools/test_amos_main_linkage.py
          python -B tools/test_m16_capture_build.py
          python -B tools/test_m16_capture.py
          python -B tools/test_m16_image_draw_r46.py
          python -B tools/build_m16_capture.py
      - name: M16 R47 current native CPU and compiler-safe wrapper tests
        run: |
          python -B tools/test_m16_capture_r47_core.py
          python -B tools/test_m16_capture_r47_build.py
          python -B tools/test_m16_capture_r47_unicorn.py
      - name: Deterministic archived R47 builder (no binary/log export)
        run: python -B tools/build_m16_capture_r47.py
      - name: M16/R48 safe token ABI probe from C1 with R47-matched size (Gate A only)
        run: |
          python -B tools/test_m16_r48_token_probe.py
          python -B tools/build_m16_r48_token_probe.py
      - name: M16 R49 read-only Bnk.GetAdr ABI and CPU probe (Gate A only)
        run: |
          python -B tools/test_m16_r49_getadr_probe.py
          python -B tools/build_m16_r49_getadr_probe.py --emit-base64
      - name: M16 R50 benign FnOne Rjsr control (Gate A only)
        run: |
          python -B tools/test_m16_r50_fnone_probe.py
          python -B tools/build_m16_r50_fnone_probe.py --emit-base64
      - name: M16 R51 inspect skipped Rjsr marker without executing (Gate A only)
        run: |
          python -B tools/test_m16_r51_relocation_probe.py
          python -B tools/build_m16_r51_relocation_probe.py --emit-base64
      - name: R52 inspect FnOne JSR target with Exec TypeOfMem guards (Gate A)
        run: |
          python -B tools/test_m16_r52_target_probe.py
          python -B tools/build_m16_r52_target_probe.py --emit-base64
      - name: R54 bank-number additive wrapper, legacy API preservation (Gate A only)
        run: |
          python -B tools/test_m16_bank_api_r54.py
          python -B tools/build_m16_bank_api_r54.py --emit-base64
      - name: M17 R55 grouped Fill/Clear in-memory CPU Gate A
        run: |
          python -B tools/test_m17_blit_group_r55.py
          python -B tools/build_m17_blit_group_r55.py
      - name: M17 R56 RastPort/SetRast native CPU Gate A
        run: |
          python -B tools/test_m17_r56_rastport.py
          python -B tools/build_m17_r56_rastport.py
      - name: M17 R57 replace R55 helper in place, native Gate A
        run: |
          python -B tools/test_m17_r57_rastport.py
          python -B tools/build_m17_r57_rastport.py
      - name: Experimental Compiler V2 68000 bridge Gate A (in-memory only)
        run: python -B tools/test_compiler_bridge_v2_probe.py
      - name: M17/R58 deterministic real 40K Compiler V2 probe Gate A (in memory)
        run: |
          python -B tools/test_m17_r58_compiler_bridge.py
          python -B tools/build_m17_r58_compiler_bridge.py --emit-base64
      - name: M17/R59 compact V2 no-padding candidate Gate A (in memory)
        run: |
          python -B tools/test_m17_r59_compact_v2.py
          python -B tools/build_m17_r59_compact_v2.py
      - name: M18/R60 native AGAPIC region V2 read-only Gate A
        run: |
          python -B tools/test_m18_r60_image_region.py
          python -B tools/build_m18_r60_image_region.py
      - name: M18/P2 aligned Fast Icon 8-plane real 68000 CPU Gate A (NO AP20)
        run: python -B tools/test_m18_ficon16_native_aligned.py
      - name: Ensure no official or historical Lib was written
        run: git diff --exit-code -- dist/ archive/

  pre_release_full:
    # Full regression on the exact pushed pre-release/release main SHA.
    # R60 runs only on explicit pre-release/release commits, not ordinary pushes.
    if: "${{ github.event_name == 'push' && (startsWith(github.event.head_commit.message, 'pre-release: R54') || startsWith(github.event.head_commit.message, 'release: R54') || startsWith(github.event.head_commit.message, 'pre-release: R60') || startsWith(github.event.head_commit.message, 'release: R60')) }}"
    needs: verify
    uses: ./.github/workflows/artifact-regression-full.yml
    permissions:
      contents: read
