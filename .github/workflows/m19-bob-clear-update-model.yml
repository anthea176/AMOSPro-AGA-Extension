name: M19 Bob Clear Update - reference model only

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m19-bob-clear-update-model.yml'
      - 'tools/m19_bob_clear_update_model.py'
      - 'tools/test_m19_bob_clear_update_model.py'
      - 'docs/M19_B8_CLEAR_UPDATE_MODEL_2026-11-19.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clear-update-reference-model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python source syntax
        run: python -B -m py_compile tools/m19_bob_clear_update_model.py tools/test_m19_bob_clear_update_model.py
      - name: Check pixel-exact page lifecycle reference behaviour
        run: python -B tools/test_m19_bob_clear_update_model.py
      - name: Preserve installed B7-m2 Lib and active ASC
        run: |
          python -B - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          lib = Path('dist/AMOSPro_AGA.Lib').read_bytes()
          asc = Path('tests/current/M19_B7M1_BOB_LIFECYCLE_RUNTIME_01.asc').read_bytes()
          assert len(lib) == 102400
          assert sha256(lib).hexdigest() == '242e5ed7e8f732bf4e613a462b8dd266269f8d6977911bac867f5db26f8c39c6'
          assert len(asc) == 10911
          assert sha256(asc).hexdigest() == 'a5b5325b677984fd18114e6983df1bebb3f04e3ce626a482fb4ef5a50665cdec'
          print('PASS unchanged installed B7-m2 and unique current ASC')
          PY
