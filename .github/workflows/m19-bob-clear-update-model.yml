name: M19 Bob Clear, Update and plane selection models

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m19-bob-clear-update-model.yml'
      - 'tools/m19_bob_clear_update_model.py'
      - 'tools/test_m19_bob_clear_update_model.py'
      - 'tools/*m19_p2c_bob_planes_model.py'
      - 'tools/*m19_p2b_bob_orientation_model.py'
      - 'docs/M19_B8_CLEAR_UPDATE_MODEL_2026-11-19.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clear-update-reference-model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python source syntax
        run: python -B -m py_compile tools/m19_bob_clear_update_model.py tools/test_m19_bob_clear_update_model.py
      - name: Check pixel-exact page lifecycle reference behaviour
        run: |
          python -B tools/test_m19_bob_clear_update_model.py
          python -B tools/test_m19_p2c_bob_planes_model.py
          python -B tools/test_m19_p2b_bob_orientation_model.py
      - name: Verify active Lib, unique ASC and protected LAST_GOOD
        run: |
          python -B - <<'PY'
          import sys
          sys.path.insert(0,'tools')
          from hashlib import sha256
          from pathlib import Path
          from active_library import verify_active,B7M2_SHA,B8_SHA,B8S1_SHA,P0_FREE_SHA,P1A_SHA,P1B_SHA,P1C_SHA, P1D_SHA, P1E_SHA, P2A_SHA, P2B_SHA, P2C_SHA
          active,good,label=verify_active(Path('.'))
          digest=sha256(active).hexdigest()
          assert digest in (B7M2_SHA,B8_SHA,B8S1_SHA,P0_FREE_SHA,P1A_SHA,P1B_SHA,P1C_SHA, P1D_SHA, P1E_SHA, P2A_SHA, P2B_SHA, P2C_SHA)
          assert sha256(good).hexdigest()==P1E_SHA
          files=list(Path('tests/current').glob('*.asc'))
          assert len(files)==1
          if digest == P2C_SHA:
              assert files[0].name == 'M19_P2C_BOB_PLANES.asc'
          elif digest == P2B_SHA:
              assert files[0].name == 'M19_P2B_BOB_FLIP.asc'
          elif digest == P2A_SHA:
              assert files[0].name == 'M19_P2A_BOB_COL.asc'
          elif digest==B7M2_SHA:
              assert files[0].name=='M19_B7M1_BOB_LIFECYCLE_RUNTIME_01.asc'
              assert sha256(files[0].read_bytes()).hexdigest()=='a5b5325b677984fd18114e6983df1bebb3f04e3ce626a482fb4ef5a50665cdec'
          else:
              assert files[0].name=='M19_B8_BOB_CLEAR_UPDATE_BC_01.asc'
              from test_m19_b8_clear_update_asc_static import verify
              verify(files[0])
          print('PASS exact source-backed active Lib, unique ASC and P1e LAST_GOOD')
          PY
