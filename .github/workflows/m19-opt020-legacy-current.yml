name: M19 OPT020 historical gates with current LAST_GOOD

# Three small historical regressions run independently of the long
# Artifact integrity suite. All builders are in-memory and read-only.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m19-opt020-legacy-current.yml'
      - 'tools/test_opt020_p1e_benchmark_static.py'
      - 'tools/test_opt020_p2_r71_links.py'
      - 'tools/test_opt020_p2_r72_d3.py'
      - 'tools/active_library.py'
      - 'dist/AMOSPro_AGA.Lib'
      - 'dist/AMOSPro_AGA_LAST_GOOD.Lib'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-gate-a:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned native CPU dependencies
        run: python -m pip install capstone==5.0.9 unicorn==2.1.4 machine68k==0.4.0
      - name: Run current P2d and historical R69 benchmark static gate
        run: python -B tools/test_opt020_p1e_benchmark_static.py
      - name: Verify R71 relative links and fault injection
        run: python -B tools/test_opt020_p2_r71_links.py
      - name: Verify R72 late PASS-1 bank mutation under emulated CPU020
        run: python -B tools/test_opt020_p2_r72_d3.py
      - name: Verify libraries and source-only workflow
        run: |
          PYTHONPATH=tools python -B - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          from active_library import verify_active, P2D_SHA, S1P1E_SHA, P2DL2_SHA, P2DL2B_SHA
          active, protected, label = verify_active(Path('.'))
          assert len(protected) == 136020 and sha256(protected).hexdigest() == P2D_SHA
          assert sha256(active).hexdigest() in (P2D_SHA, S1P1E_SHA, P2DL2_SHA, P2DL2B_SHA)
          print(label)
          PY
          git diff --exit-code -- dist/ tests/current/ tests/passed/
