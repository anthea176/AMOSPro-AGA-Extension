name: M19 S2c P0c attached SimpleSprite lifecycle MC68020 (source only)
on:
  push:
    branches: [main]
    paths:
      - 'src/native/m19_s2/M19_S2C_ATTACHED_LIFECYCLE_MC68020.s'
      - 'tools/test_m19_s2c_attached_lifecycle_cpu.py'
      - '.github/workflows/m19-s2c-attached-lifecycle-gate-a.yml'
      - 'tools/test_m19_s2b_retire_pair_cpu.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  attached-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify policies and canonical S2r
        run: |
          python -B tools/native_cpu_policy.py --self-test
          python -B tools/check_aga_delivery_paths.py --self-test
          python -B -m py_compile tools/test_m19_s2c_attached_lifecycle_cpu.py
          python -B tools/verify_m19_s1p2l_b_delivery.py
      - name: Restore pinned VASM Motorola assembler
        id: vasm-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vasm/vasmm68k_mot
          key: vasm-m68k-mot-${{ runner.os }}-${{ runner.arch }}-ubuntu2404-8b85ef6eb7d257bf29a56ddc63cf2be20a317256
      - name: Build pinned VASM if not cached
        if: steps.vasm-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/vasm"
          git -C "$RUNNER_TEMP/vasm" init
          git -C "$RUNNER_TEMP/vasm" remote add origin https://github.com/rhargreaves/vasm.git
          git -C "$RUNNER_TEMP/vasm" fetch --depth 1 origin 8b85ef6eb7d257bf29a56ddc63cf2be20a317256
          git -C "$RUNNER_TEMP/vasm" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/vasm" rev-parse HEAD)" = 8b85ef6eb7d257bf29a56ddc63cf2be20a317256
          make -C "$RUNNER_TEMP/vasm" CPU=m68k SYNTAX=mot -j2
      - name: Assemble MC68020 pair lifecycle and original retirement
        run: |
          VASM="$RUNNER_TEMP/vasm/vasmm68k_mot"
          "$VASM" -Fbin -m68020 -no-opt -quiet -o "$RUNNER_TEMP/s2c_lifecycle.bin" src/native/m19_s2/M19_S2C_ATTACHED_LIFECYCLE_MC68020.s
          "$VASM" -Fbin -m68020 -no-opt -quiet -o "$RUNNER_TEMP/s2b_retire.bin" src/native/m19_s2/M19_S2B_RETIRE_PAIR_MC68020.s
      - name: Install pinned CPU emulator
        run: python -m pip install --disable-pip-version-check unicorn==2.1.4
      - name: Run actual MC68020 paired lifecycle and legacy retirement
        run: |
          PYTHONPATH=tools python -B tools/test_m19_s2c_attached_lifecycle_cpu.py "$RUNNER_TEMP/s2c_lifecycle.bin"
          PYTHONPATH=tools python -B tools/test_m19_s2b_retire_pair_cpu.py "$RUNNER_TEMP/s2b_retire.bin"
      - name: Protect canonical and historical files
        run: |
          python -B tools/verify_m19_s1p2l_b_delivery.py
          git diff --exit-code -- dist/ tests/current/ tests/passed/
