name: AGA documentation and examples (fast)

# Docs-only changes no longer run the historical native CPU regression suite.
# This job checks the exact public API against the canonical active Lib.
on:
  push:
    branches: [main]
    paths: &documentation_paths
      - 'README.md'
      - 'README.fr.md'
      - 'docs/ROADMAP.md'
      - 'docs/ROADMAP_HISTORY_2026-11-17.md'
      - 'tools/test_roadmap_focus.py'
      - 'INSTALL.md'
      - 'INSTALL.fr.md'
      - 'examples/**'
      - 'tools/test_readme_api_coverage.py'
      - 'tools/test_examples.py'
      - 'tools/test_amos_log_modes.py'
      - 'tools/test_m19_p2_all_in_one_source.py'
      - 'tests/current/*.asc'
      - 'tools/audit_ap20.py'
      - 'dist/AMOSPro_AGA.Lib'
      - '.github/workflows/aga-docs-fast.yml'
  pull_request:
    branches: [main]
    paths: *documentation_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aga-docs-fast-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  public-documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout read-only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check both README APIs against active AP20 and validate examples
        run: |
          python3 -B tools/test_readme_api_coverage.py
          python3 -B tools/test_examples.py
          python3 -B tools/test_amos_log_modes.py
          python3 -B tools/test_m19_p2_all_in_one_source.py
          python3 -B tools/amos_preflight.py --strict-target --fail-on-warnings examples/bob_p2_all_in_one/BOB_ALL_IN_ONE.asc examples/aga_bob_flip/FLIP_VISUAL.asc
          for asc in tests/current/*.asc; do
            if [ -f "$asc" ]; then
              python3 -B tools/amos_preflight.py --strict-target --fail-on-warnings "$asc"
            fi
          done
      - name: Keep the active roadmap short and synchronized
        run: |
          python3 -B tools/test_roadmap_focus.py --self-test
          python3 -B tools/test_roadmap_focus.py
      - name: Ensure documentation checks never modify protected artifacts
        run: git diff --exit-code -- dist/ tests/current/ tests/passed/
