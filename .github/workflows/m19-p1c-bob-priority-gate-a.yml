name: M19 P1c Bob Priority MC68020 Gate A
on:
  push:
    branches: [main]
    paths:
      - 'tools/test_current_ram_log.py'
      - '.github/workflows/m19-p1c-bob-priority-gate-a.yml'
      - 'tools/*m19*p1c*bob_priority*.py'
      - 'tools/m19_p0j_explicit_safe_draw_emit.py'
      - 'dist/AMOSPro_AGA.Lib'
      - 'tests/current/M19_B8_BOB_CLEAR_UPDATE_BC_01.asc'
      - 'tools/test_m19_b8_clear_update_asc_static.py'
      - 'dist/AMOSPro_AGA_LAST_GOOD.Lib'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  priority-native:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check unicorn==2.1.4 capstone==5.0.9
      - name: Verify native CPU and delivery policy
        run: |
          python -B tools/native_cpu_policy.py --self-test
          python -B tools/check_aga_delivery_paths.py --self-test
      - name: Execute P1c native priority, AP20 and P1b regressions
        run: |
          python -B tools/test_m19_p1c_bob_priority_gate_a.py
          python -B tools/test_m19_p1b_hotspot_draw_gate_a.py
      - name: Preflight the sole WinUAE ASC and pixel probe
        run: |
          python -B tools/test_current_ram_log.py
          python -B tools/amos_preflight.py --strict-target tests/current/*.asc
          python -B tools/test_readme_api_coverage.py
      - name: Verify historical P1c source and exact promoted LAST_GOOD
        run: |
          PYTHONPATH=tools python -B - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          from active_library import P1E_SHA,P2D_SHA,P2DL2B_SHA,verify_active
          active,good,_=verify_active(Path('.'))
          assert (len(good),sha256(good).hexdigest()) in ((124444,P1E_SHA),(136020,P2D_SHA),(136708,P2DL2B_SHA))
          PY
          git diff --exit-code -- dist/ tests/current/ tests/passed/
