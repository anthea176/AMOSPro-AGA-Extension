name: M19 P2.8 R88 historical source/model/native Gate A (no test distribution)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m19-p28-agapic-planar-cache-gate-a.yml"
      - "tools/m19_p28_agapic_planar_cache.py"
      - "tools/test_m19_p28_agapic_planar_cache.py"
      - "tools/m19_p28_agpc_ap20_emit.py"
      - "tools/build_m19_p28_r88_in_memory.py"
      - "tools/test_m19_p28_r88_gate_a.py"
      - "tools/m19_p28_winuae_bundle.py"
      - "tools/test_m19_p28_winuae_static.py"
      - "tools/verify_p28_archive.py"
      - "tests/current/M19_P28_R88_CACHE_BLIT_FPS_01.asc"
      - "tests/passed/M19_P27_R87_CACHE_CPU_BLITTER_01.asc"
      - "tools/m16_agapic.py"
      - "tools/m16_agapic_v2.py"
      - "tools/m18_ficon16_chip_blit_emit.py"
      - "tools/test_m18_ficon16_chip_blit.py"
      - "dist/AMOSPro_AGA.Lib"
      - "dist/AMOSPro_AGA_LAST_GOOD.Lib"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p28-model-and-native-68000:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU emulator and assembler decoder
        run: python -m pip install --disable-pip-version-check unicorn==2.1.4 capstone==5.0.9
      - name: Verify current promoted P2d and frozen R87 before historical R88 tests
        run: |
          python -B tools/verify_fast.py
          python -B - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import sys
          root = Path.cwd()
          sys.path.insert(0, str(root/'tools'))
          from active_library import P2D_SHA, P2DL2B_SHA, R87_SHA, SPRITE_L2B_HISTORICAL_SHAS, verify_active
          current, good, _ = verify_active(root)
          assert sha256(good).hexdigest() in (P2D_SHA, P2DL2B_SHA)
          assert sha256(current).hexdigest() in (P2D_SHA, P2DL2B_SHA, *SPRITE_L2B_HISTORICAL_SHAS)
          archive = (root/'dist/experimental/AMOSPro_AGA_R87_v0.13.32_M19_P25_BC_PASS.Lib').read_bytes()
          assert sha256(archive).hexdigest() == R87_SHA
          print('R88 historical inputs PASS: verified current lineage, protected P2d/L2b and R87 predecessor')
          PY
      - name: AGAPIC original v1 and v2 parser/source contracts
        run: |
          python -B tools/test_m16_agapic.py
          python -B tools/test_m16_agapic_v2.py
      - name: Historical M18 real 68000 masked Chip-core regression
        run: python -B tools/test_m18_ficon16_chip_blit.py
      - name: P2.8 AGPC v1-v2 independent-alpha host and native core reuse
        run: python -B tools/test_m19_p28_agapic_planar_cache.py
      - name: Rebuild R88 in memory; verify AP20 tokens and Compiler V2 relocations
        run: python -B tools/build_m19_p28_r88_in_memory.py
      - name: P2.8 native AP20 68020 interpreter and compiled-layout emulation
        run: python -B tools/test_m19_p28_r88_gate_a.py
      - name: Strict AMOS Pro P0c active source preflight
        run: |
          python -B tools/test_amos_preflight.py
          python -B tools/amos_preflight.py --strict-target --fail-on-warnings tests/current/*.asc
      - name: Verify P2.8 does NOT emit a new active library or change LAST_GOOD
        run: git diff --exit-code -- dist/AMOSPro_AGA.Lib dist/AMOSPro_AGA_LAST_GOOD.Lib tests/passed/
      - name: Verify permanent R88 experimental archive and ABK fixtures
        run: |
          python -B tools/verify_p28_archive.py
          git diff --exit-code -- dist/ tests/current/ tests/passed/
