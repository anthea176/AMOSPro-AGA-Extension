name: M19 S2e prepare future hotspot campaign (no activation)
on:
  push:
    branches: [main]
    paths:
      - 'tools/prepare_m19_s2e_campaign.py'
      - '.github/workflows/m19-s2e-prepare-campaign.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore pinned VASM
        id: vasm-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vasm/vasmm68k_mot
          key: vasm-m68k-mot-${{ runner.os }}-${{ runner.arch }}-ubuntu2404-8b85ef6eb7d257bf29a56ddc63cf2be20a317256
      - name: Build pinned VASM on cache miss
        if: steps.vasm-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/vasm"
          git -C "$RUNNER_TEMP/vasm" init
          git -C "$RUNNER_TEMP/vasm" remote add origin https://github.com/rhargreaves/vasm.git
          git -C "$RUNNER_TEMP/vasm" fetch --depth 1 origin 8b85ef6eb7d257bf29a56ddc63cf2be20a317256
          git -C "$RUNNER_TEMP/vasm" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/vasm" rev-parse HEAD)" = 8b85ef6eb7d257bf29a56ddc63cf2be20a317256
          make -C "$RUNNER_TEMP/vasm" CPU=m68k SYNTAX=mot -j2
      - name: Install pinned MC68020 test tools
        run: python -m pip install --disable-pip-version-check unicorn==2.1.4 capstone==5.0.9
      - name: Prepare and preflight without activation
        run: |
          python -B tools/native_cpu_policy.py --self-test
          python -B tools/check_aga_delivery_paths.py --self-test
          python -B tools/verify_m19_s1p2l_b_delivery.py
          python -B tools/prepare_m19_s2e_campaign.py --temp "$RUNNER_TEMP/s2e"
          python -B tools/amos_preflight.py --strict-target --fail-on-warnings "$RUNNER_TEMP/s2e/SPRITE_PUBLIC.asc"
          python -B tools/verify_m19_s1p2l_b_delivery.py
          PYTHONPATH=tools python -B - <<'PY'
          import base64, hashlib, os
          from pathlib import Path
          from build_m19_s2e_in_memory import build_s2e
          root=Path(os.environ["RUNNER_TEMP"])
          lib,meta=build_s2e(root/"vasm/vasmm68k_mot")
          assert lib==build_s2e(root/"vasm/vasmm68k_mot")[0]
          files=[
              ("LIB",lib,160352,"3135ba3973b138ec44a07ade3e190baba12a9425746252aaf88853b00d4ae7d3"),
              ("ASC",(root/"s2e/SPRITE_PUBLIC.asc").read_bytes(),17604,"b11f05a88a311cce82da5eb10962133e0c703fcd18fef20fcb592ddfa294be84"),
              ("ABK",(root/"s2e/AGSP_HOTSPOT_TEST.ABK").read_bytes(),6836,"df3b9af963c65ada0d294708761f9990e240aa771e58b53bf8840d8c98d15d8a"),
          ]
          for tag,data,size,digest in files:
              assert len(data)==size and hashlib.sha256(data).hexdigest()==digest
              blob=hashlib.sha1(b"blob "+str(size).encode()+b"\x00"+data).hexdigest()
              print("S2E_DELIVERY_ID",tag,size,digest,blob,flush=True)
              for i in range(0,size,1536):
                  print("S2E_PAYLOAD",tag,i//1536,base64.b64encode(data[i:i+1536]).decode(),flush=True)
          print("S2E_DELIVERY_BYTES_PASS",flush=True)
          PY
          python -B tools/verify_m19_s1p2l_b_delivery.py
          git diff --exit-code
