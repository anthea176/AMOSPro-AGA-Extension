name: M19 S2f P1 independent clipping kernel (no activation)
on:
  push:
    branches: [main]
    paths:
      - 'src/native/m19_s2/M19_S2F_CLIP_KERNEL_MC68020.s'
      - 'tools/test_m19_s2f_clip_kernel_gate_a.py'
      - '.github/workflows/m19-s2f-clip-kernel-gate-a.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore pinned VASM
        id: vasm-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vasm/vasmm68k_mot
          key: vasm-m68k-mot-${{ runner.os }}-${{ runner.arch }}-ubuntu2404-8b85ef6eb7d257bf29a56ddc63cf2be20a317256
      - name: Build pinned VASM on cache miss
        if: steps.vasm-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/vasm"
          git -C "$RUNNER_TEMP/vasm" init
          git -C "$RUNNER_TEMP/vasm" remote add origin https://github.com/rhargreaves/vasm.git
          git -C "$RUNNER_TEMP/vasm" fetch --depth 1 origin 8b85ef6eb7d257bf29a56ddc63cf2be20a317256
          git -C "$RUNNER_TEMP/vasm" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/vasm" rev-parse HEAD)" = 8b85ef6eb7d257bf29a56ddc63cf2be20a317256
          make -C "$RUNNER_TEMP/vasm" CPU=m68k SYNTAX=mot -j2
      - name: Install pinned MC68020 test tools
        run: python -m pip install --disable-pip-version-check unicorn==2.1.4 capstone==5.0.9
      - name: Authenticate active S2e parent and policies
        run: |
          python -B tools/native_cpu_policy.py --self-test
          python -B tools/check_aga_delivery_paths.py --self-test
          python -B tools/verify_m19_s2e_delivery.py
          python -B tools/build_m19_s2e_in_memory.py --vasm "$RUNNER_TEMP/vasm/vasmm68k_mot"
      - name: Assemble and exercise actual MC68020 kernel
        run: |
          "$RUNNER_TEMP/vasm/vasmm68k_mot" -Fbin -m68020 -no-opt -quiet -o "$RUNNER_TEMP/s2f.bin" src/native/m19_s2/M19_S2F_CLIP_KERNEL_MC68020.s
          PYTHONPATH=tools python -B tools/test_m19_s2f_clip_kernel_gate_a.py --binary "$RUNNER_TEMP/s2f.bin"
          python -B tools/verify_m19_s2e_delivery.py
          git diff --exit-code -- dist/ tests/current/ tests/passed/
