name: M19 B8 private Safe and post-Close MC68020 Gate A

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m19-b8-safe-lifecycle-gate-a.yml'
      - 'tools/m19_b8_safe_lifecycle_emit.py'
      - 'tools/test_m19_b8_safe_lifecycle_gate_a.py'
      - 'tools/build_m19_b8_safe_lifecycle_in_memory.py'
      - 'tools/m19_b8_page_manager_emit.py'
      - 'tools/m19_b8_snapshot_pool_emit.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m19-b8-safe-postclose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: MC68020 Unicorn, Capstone and AP20 source dependencies
        run: python -m pip install --disable-pip-version-check capstone==5.0.9 unicorn==2.1.4 machine68k==0.4.0
      - name: Python syntax and native CPU policy self-test
        run: |
          python -B -m py_compile tools/m19_b8_safe_lifecycle_emit.py tools/test_m19_b8_safe_lifecycle_gate_a.py tools/build_m19_b8_safe_lifecycle_in_memory.py
          python -B tools/native_cpu_policy.py --self-test
          python -B tools/check_aga_delivery_paths.py --self-test
      - name: MC68020 Safe/GetMsg/WaitBlit and post-Close/End private Gate A
        run: python -B tools/test_m19_b8_safe_lifecycle_gate_a.py
      - name: Source-only fifth AP20 group, token/PC16 conservation
        run: python -B tools/build_m19_b8_safe_lifecycle_in_memory.py
      - name: Byte-exact active B7-m2 Lib, LAST_GOOD and validated ASC
        run: |
          python -B - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          expected = {
              'dist/AMOSPro_AGA.Lib': 'f4db949114517f8d3b4d39b70c60b4f63d8d51a6433fecdadbbbfce96bf6689d',
              'dist/AMOSPro_AGA_LAST_GOOD.Lib': 'f4db949114517f8d3b4d39b70c60b4f63d8d51a6433fecdadbbbfce96bf6689d',
              'tests/current/M19_B8_BOB_CLEAR_UPDATE_BC_01.asc': '923f80ccf985e60a3952474fb63a3c8d19541f91f2adf9aecf6b8a14ad1c6fc8'
          }
          for path,expected_sha in expected.items():
              assert sha256(Path(path).read_bytes()).hexdigest()==expected_sha, path
          print('PASS: B7-m2, LAST_GOOD, and sole ASC intact')
          PY
