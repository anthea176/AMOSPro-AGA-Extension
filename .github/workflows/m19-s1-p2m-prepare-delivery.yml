name: M19 S1-P2m exact delivery preparation (read only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m19-s1-p2m-prepare-delivery.yml'
      - 'src/native/m19_s1/M19_S1P2M_*.s'
      - 'tools/build_m19_s1p2m_in_memory.py'
      - 'tools/build_m19_s1p2k_close_in_memory.py'
      - 'tools/prepare_m19_s1p2m_campaign.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore pinned VASM
        id: vasm-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vasm/vasmm68k_mot
          key: vasm-m68k-mot-${{ runner.os }}-${{ runner.arch }}-ubuntu2404-8b85ef6eb7d257bf29a56ddc63cf2be20a317256
      - name: Build pinned VASM on cache miss
        if: steps.vasm-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/vasm"
          git -C "$RUNNER_TEMP/vasm" init
          git -C "$RUNNER_TEMP/vasm" remote add origin https://github.com/rhargreaves/vasm.git
          git -C "$RUNNER_TEMP/vasm" fetch --depth 1 origin 8b85ef6eb7d257bf29a56ddc63cf2be20a317256
          git -C "$RUNNER_TEMP/vasm" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/vasm" rev-parse HEAD)" = 8b85ef6eb7d257bf29a56ddc63cf2be20a317256
          make -C "$RUNNER_TEMP/vasm" CPU=m68k SYNTAX=mot -j2
      - name: Install pinned verification tools
        run: python -m pip install --disable-pip-version-check unicorn==2.1.4 capstone==5.0.9
      - name: Reconstruct P2m in memory, verify strict future ASC and transfer exact bytes
        run: |
          python -B tools/native_cpu_policy.py --self-test
          python -B tools/check_aga_delivery_paths.py --self-test
          python -B tools/verify_m19_s1p2l_b_delivery.py
          python -B tools/prepare_m19_s1p2m_campaign.py tests/current/SPRITE_PUBLIC.asc "$RUNNER_TEMP/SPRITE_PUBLIC.asc"
          python -B tools/amos_preflight.py --strict-target --fail-on-warnings "$RUNNER_TEMP/SPRITE_PUBLIC.asc"
          PYTHONPATH=tools python -B - <<'PY'
          import base64, json, os
          from pathlib import Path
          from hashlib import sha256, sha1
          from build_m19_s1p2m_in_memory import build_s1p2m, protected
          before=protected()
          tmp=Path(os.environ['RUNNER_TEMP'])
          assert tuple(sha256(x).hexdigest() for x in before)==(
              '148b4d06702f84dd6de3eacd069a55c4759164bb4dd3c74f319f81e6f077f3f5',
              'a7ed96e92b460e842772aed77ac35a303d8f663aaa456821c323109446dd19dc',
              '25a50fd84962dcdd0a52a45d496ad3413676d37aa4b3df4c2d74391d18c4a89e',
              '225970dda0271260f598b5e379ee52ca2d605a19a13c6b133b46ac13edf92a93')
          out,meta=build_s1p2m(tmp/'vasm/vasmm68k_mot')
          asc=(tmp/'SPRITE_PUBLIC.asc').read_bytes()
          assert meta['commands']==105 and meta['entries']==214
          assert meta['sha256']==sha256(out).hexdigest()
          assert meta['bytes']==len(out)
          assert meta['git_blob']==sha1(('blob %d' % len(out)).encode()+bytes(1)+out).hexdigest()
          assert protected()==before
          print('P2M_EXACT_PREPARATION '+json.dumps(meta,sort_keys=True),flush=True)
          # These are internal transfer bytes, not Gate A evidence.
          # Canonical activation requires separately completed functional Gate A
          # with identical source and candidate SHA, and author authorization.
          # No repository write and no alternative installable artifact.
          for label,data in (('P2M_LIB',out),('P2M_ASC',asc)):
              print(label+'_IDENTITY',len(data),sha256(data).hexdigest(),
                    sha1(('blob %d' % len(data)).encode()+bytes(1)+data).hexdigest(),flush=True)
              enc=base64.b64encode(data).decode('ascii')
              for i in range(0,len(enc),2048):
                  print(label+'_CHUNK',i//2048,enc[i:i+2048],flush=True)
          PY
          git diff --exit-code
      - name: Inventory provenance consumers for canonical activation
        run: |
          git grep -n -E 'S1P2LC_SHA|P2LC_SHA|P2LC_ASC_SHA|148b4d06702f84dd6de3eacd069a55c4759164bb4dd3c74f319f81e6f077f3f5|25a50fd84962dcdd0a52a45d496ad3413676d37aa4b3df4c2d74391d18c4a89e' -- tools .github/workflows || true
