name: M19 P2a Bob native ONE-CALL 020 collision query Gate A
on:
  push:
    branches: [main]
    paths:
      - 'tools/m19_p2a_bob_collision_model.py'
      - 'tools/test_m19_p2a_bob_collision_model.py'
      - 'tools/m19_p2a_agbo_bridge.py'
      - 'tools/test_m19_p2a_agbo_bridge.py'
      - 'tools/m19_p2a_collision020_emit.py'
      - 'tools/test_m19_p2a_collision020_gate_a.py'
      - 'tools/m19_p2a_pair_checked_read_emit.py'
      - 'tools/test_m19_p2a_pair_checked_read_gate_a.py'
      - 'tools/m19_p2a_pair_chip_resolve_emit.py'
      - 'tools/test_m19_p2a_pair_chip_resolve_gate_a.py'
      - 'tools/m19_p2a_pair_geometry020_emit.py'
      - 'tools/test_m19_p2a_pair_geometry020_gate_a.py'
      - 'tools/m19_p2a_pair_hotspot020_emit.py'
      - 'tools/test_m19_p2a_pair_hotspot020_gate_a.py'
      - 'tools/m19_p2a_collision_query020_emit.py'
      - 'tools/test_m19_p2a_collision_query020_gate_a.py'
      - 'tools/m19_p0j_explicit_image_resolve_emit.py'
      - 'tools/m19_p0j_explicit_bank_stage_emit.py'
      - 'tools/m19_p0f_object_identity_emit.py'
      - 'tools/m19_p0f_bank_stamp_emit.py'
      - 'tools/m68k_emit.py'
      - 'tools/build_m19_p1b_hotspot_fixture.py'
      - 'tests/current/M19_P1B_HOTSPOT_BANK26.abk'
      - 'tools/m19_p0a_multi_bob_abk.py'
      - 'tools/m19_p0e_object_table_emit.py'
      - 'tools/m19_p0f_bank_stamp_emit.py'
      - 'tools/m19_p0f_object_identity_emit.py'
      - 'tools/m19_p1d_limit_bob_emit.py'
      - '.github/workflows/m19-p2a-bob-collisions-host.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collision-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real M68K CPU emulator and decoder
        run: python -m pip install --disable-pip-version-check unicorn==2.1.4 capstone==5.0.9
      - name: Python syntax validation (no bytecode files)
        run: |
          python -B - <<'PY'
          import ast
          from pathlib import Path
          for name in ('m19_p2a_bob_collision_model.py', 'test_m19_p2a_bob_collision_model.py',
                       'm19_p2a_agbo_bridge.py', 'test_m19_p2a_agbo_bridge.py',
                       'm19_p2a_collision020_emit.py', 'test_m19_p2a_collision020_gate_a.py',
                       'm19_p2a_pair_checked_read_emit.py', 'test_m19_p2a_pair_checked_read_gate_a.py',
                       'm19_p2a_pair_chip_resolve_emit.py', 'test_m19_p2a_pair_chip_resolve_gate_a.py',
                       'm19_p2a_pair_geometry020_emit.py', 'test_m19_p2a_pair_geometry020_gate_a.py',
                       'm19_p2a_pair_hotspot020_emit.py', 'test_m19_p2a_pair_hotspot020_gate_a.py',
                       'm19_p2a_collision_query020_emit.py', 'test_m19_p2a_collision_query020_gate_a.py'):
              ast.parse((Path('tools')/name).read_text(encoding='utf-8'), filename=name)
          print('P2a HOST SYNTAX PASS')
          PY
      - name: Run 17 deterministic host collision regressions
        run: python -B tools/test_m19_p2a_bob_collision_model.py
      - name: Run 23 source-backed AGBO/P0e/P0f/P1d collision regressions including real bank26 fixture
        run: python -B tools/test_m19_p2a_agbo_bridge.py
      - name: Check native MC68020 target and delivery policy syntax
        run: |
          python -B tools/native_cpu_policy.py --self-test
          python -B tools/check_aga_delivery_paths.py --self-test
      - name: Execute real private MC68020 collision bytes vs independent host oracle
        run: python -B tools/test_m19_p2a_collision020_gate_a.py
      - name: Execute P2a source-only native paired P0f identity checks (real MC68020)
        run: python -B tools/test_m19_p2a_pair_checked_read_gate_a.py
      - name: Execute paired real P0f and P0j-b3 Chip image resolution on MC68020
        run: python -B tools/test_m19_p2a_pair_chip_resolve_gate_a.py
      - name: Execute native signed hotspots and P1d clipping geometry plus collision kernel
        run: python -B tools/test_m19_p2a_pair_geometry020_gate_a.py
      - name: Execute real AGBO/P1b signed hotspot bank lookup and P1d native collision chain
        run: python -B tools/test_m19_p2a_pair_hotspot020_gate_a.py
      - name: Execute one-call source-backed P2a full native collision query on MC68020
        run: python -B tools/test_m19_p2a_collision_query020_gate_a.py
      - name: Guard binary, active ASC and archives
        run: git diff --exit-code -- dist/ tests/current/ tests/passed/ tests/fixtures/
