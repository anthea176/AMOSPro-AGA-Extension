name: M19 S2g P1b public overload and full source Gate A
on:
  push:
    branches: [main]
    paths:
      - 'src/native/m19_s2/M19_S2G_PRIORITY_MC68020.s'
      - 'tools/m19_s2g_priority_source.py'
      - 'tools/build_m19_s2g_in_memory.py'
      - 'tools/build_m19_s2d_in_memory.py'
      - 'tools/test_m19_s2g_priority_gate_a.py'
      - 'tools/audit_ap20.py'
      - 'tools/test_m19_s1p2i_gate_a.py'
      - 'tools/build_m19_s2g_public_in_memory.py'
      - 'tools/prepare_m19_s2g_campaign.py'
      - 'tools/test_m19_s2g_public_gate_a.py'
      - '.github/workflows/m19-s2g-public-gate-a.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        suite: [link, runtime, compiled, legacy-runtime, legacy-compiled, agapic, pattern, safeport, bob, capture, chain]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore pinned VASM
        id: vasm-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vasm/vasmm68k_mot
          key: vasm-m68k-mot-${{ runner.os }}-${{ runner.arch }}-ubuntu2404-8b85ef6eb7d257bf29a56ddc63cf2be20a317256
      - name: Build pinned VASM on cache miss
        if: steps.vasm-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/vasm"
          git -C "$RUNNER_TEMP/vasm" init
          git -C "$RUNNER_TEMP/vasm" remote add origin https://github.com/rhargreaves/vasm.git
          git -C "$RUNNER_TEMP/vasm" fetch --depth 1 origin 8b85ef6eb7d257bf29a56ddc63cf2be20a317256
          git -C "$RUNNER_TEMP/vasm" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/vasm" rev-parse HEAD)" = 8b85ef6eb7d257bf29a56ddc63cf2be20a317256
          make -C "$RUNNER_TEMP/vasm" CPU=m68k SYNTAX=mot -j2
      - name: Install pinned CPU model
        run: python -m pip install --disable-pip-version-check unicorn==2.1.4 capstone==5.0.9
      - name: Check CPU, paths and Python syntax
        run: |
          python -B tools/native_cpu_policy.py --self-test
          python -B tools/check_aga_delivery_paths.py --self-test
          python -B -m py_compile tools/build_m19_s2d_in_memory.py tools/m19_s2g_priority_source.py tools/build_m19_s2g_in_memory.py tools/test_m19_s2g_priority_gate_a.py tools/build_m19_s2g_public_in_memory.py tools/prepare_m19_s2g_campaign.py tools/test_m19_s2g_public_gate_a.py
          python -B tools/verify_m19_s1p2l_b_delivery.py
      - name: Qualify public overload and full legacy regressions
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          VASM="$RUNNER_TEMP/vasm/vasmm68k_mot"
          "$VASM" -I src/native/m19_s1 -Fbin -m68020 -no-opt -quiet -o "$RUNNER_TEMP/p1h.bin" src/native/m19_s1/M19_S1P1H_BANK_PUBLIC_MC68020.s
          EXTRA=()
          if [ "$SUITE" = link ]; then
            python -B tools/prepare_m19_s2g_campaign.py --temp "$RUNNER_TEMP/s2g"
            python -B tools/amos_preflight.py --strict-target --fail-on-warnings "$RUNNER_TEMP/s2g/SPRITE_PUBLIC.asc"
            EXTRA=(--campaign "$RUNNER_TEMP/s2g/SPRITE_PUBLIC.asc")
          fi
          PYTHONPATH=tools python -B tools/test_m19_s2g_public_gate_a.py --vasm "$VASM" --historical "$RUNNER_TEMP/p1h.bin" --suite "$SUITE" "${EXTRA[@]}"
      - name: Verify protected installed pair and unchanged test
        run: |
          python -B tools/verify_m19_s1p2l_b_delivery.py
          git diff --exit-code -- dist/ tests/current/ tests/passed/
  complete:
    runs-on: ubuntu-24.04
    needs: qualify
    steps:
      - run: echo S2G_P1B_PUBLIC_GATE_A_PASS
