name: M19 P0a R88-only MC68020 multi-image native Gate A

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m19-p0a-r88-get-gate-a.yml
      - tools/m19_p0a_multi_bob_abk.py
      - tools/m19_p0a_capture_transaction.py
      - tools/m19_p0a_amos_bank_transaction_emit.py
      - tools/m19_p0a_bank_select_emit.py
      - tools/m19_p0a_get_bob_emit.py
      - tools/m19_p0b_mask020_emit.py
      - tools/test_m19_p0b_mask020_native.py
      - tools/m19_p0b_masks_emit.py
      - tools/m19_p0b_chip_dma_model.py
      - tools/test_m19_p0b_chip_dma_model.py
      - tools/m19_p0c_chip_stage_emit.py
      - tools/test_m19_p0c_chip_stage_native.py
      - tools/m19_p0c_checked_bank_stage_emit.py
      - tools/test_m19_p0c_checked_bank_stage_native.py
      - tools/m19_p0c_bank_registry_emit.py
      - tools/test_m19_p0c_bank_registry_native.py
      - tools/m19_p0c_screen_preclose_emit.py
      - tools/m19_p0c_screen_close_bridge_emit.py
      - tools/m19_p0c_program_end_bridge_emit.py
      - tools/build_m19_p0c_screen_close_in_memory.py
      - tools/test_m19_p0c_screen_close_real_gate_a.py
      - tools/test_m19_p0c_program_end_real_gate_a.py
      - tools/test_m19_p0c_screen_preclose_native.py
      - tools/build_m19_p0b_masks_in_memory.py
      - tools/test_m19_p0b_masks_gate_a.py
      - tools/build_m19_p0a_r88_bank_in_memory.py
      - tools/build_m19_p0a_r88_get_in_memory.py
      - tools/test_m19_p0a_get_bob_emit.py
      - tools/test_m19_p0a_r88_get_gate_a.py
      - tools/test_m19_p0a_r88_bank_gate_a.py
      - dist/AMOSPro_AGA.Lib
      - dist/AMOSPro_AGA_LAST_GOOD.Lib
  workflow_dispatch:

permissions:
  contents: read

jobs:
  get-bob-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: MC68020 emulator and disassembler
        run: python -m pip install --disable-pip-version-check unicorn==2.1.4 capstone==5.0.9
      - name: Immutable R88 and R84 bases
        run: |
          python -B -c "import hashlib,pathlib; h=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest(); assert h('dist/experimental/AMOSPro_AGA_R88_v0.13.33_M19_P28_GATE_A_ONLY.Lib')=='69e47f8571dc5e7e50c1aa341bfed9f65ef3f973c015788668f2034041632fbc'; assert h('dist/AMOSPro_AGA.Lib')=='f272a98a9d07eb66dc515fc4598b16f9fd64cb55d84c36ec29068f9f074a44d9'; assert h('dist/AMOSPro_AGA_LAST_GOOD.Lib')=='46f274c6051f171132f4dcf6f0e8c3a8ccef16162dfa6a804cab6c3a7bf08e6d'"
      - name: P0a host format, capture, and transaction regression
        run: |
          python -B tools/test_m19_p0a_multi_bob_abk.py
          python -B tools/test_m19_p0a_capture_transaction.py
          python -B tools/test_m19_p0a_amos_bank_transaction_emit.py
          python -B tools/test_m19_p0a_bank_select_emit.py
          python -B tools/test_m19_p0a_get_bob_emit.py
      - name: M19 AGBO future Chip staging HOST-ONLY regression
        run: python -B tools/test_m19_p0b_chip_dma_model.py
      - name: M19 P0c PRIVATE MC68020 Chip lifetime Gate A (OS mocks)
        run: python -B tools/test_m19_p0c_chip_stage_native.py
      - name: M19 P0c PRIVATE verified AGBO bank to Chip Gate A (AMOS mocks)
        run: python -B tools/test_m19_p0c_checked_bank_stage_native.py
      - name: M19 P0c PRIVATE per-bank Chip registry MC68020 Gate A
        run: python -B tools/test_m19_p0c_bank_registry_native.py
      - name: M19 P0c PRIVATE Screen preclose MC68020 Gate A (legacy close mocked)
        run: python -B tools/test_m19_p0c_screen_preclose_native.py
      - name: M19 P0c in-memory public Screen Close V2 bridge provenance/ABI
        run: python -B tools/build_m19_p0c_screen_close_in_memory.py
      - name: M19 P0c REAL original AGA Screen Close CPU020 + BOBS preclose integration
        run: python -B tools/test_m19_p0c_screen_close_real_gate_a.py
      - name: M19 P0c PRIVATE real AMOS End callbacks MC68020 Gate A
        run: python -B tools/test_m19_p0c_program_end_real_gate_a.py
      - name: Rebuild exact R88-based AP20 candidate in memory
        run: |
          python -B tools/build_m19_p0a_r88_bank_in_memory.py
          python -B tools/build_m19_p0a_r88_get_in_memory.py
      - name: MC68020 bank selection and pixel-exact Get AGA Bob Gate A
        run: |
          python -B tools/test_m19_p0a_r88_bank_gate_a.py
          python -B tools/test_m19_p0a_r88_get_gate_a.py
      - name: MC68020 independent 1-bit mask source kernel (private Gate A)
        run: python -B tools/test_m19_p0b_mask020_native.py
      - name: M19 P0b full Make/No Mask AP20 candidate, in memory only
        run: python -B tools/build_m19_p0b_masks_in_memory.py
      - name: MC68020 Make and No Mask pixel-exact CPU Gate A
        run: python -B tools/test_m19_p0b_masks_gate_a.py
      - name: Export exact MC68020 Gate A candidate outside dist
        run: |
          python -B - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import sys
          sys.path.insert(0, 'tools')
          from build_m19_p0a_r88_get_in_memory import build
          lib, details = build()
          digest = sha256(lib).hexdigest()
          assert len(lib) == 79660, len(lib)
          assert digest == 'e98a1a17a5e1de579dd100c5cdeba2b8372f62f175274a4412ddeea21034e3b0', digest
          assert details['commands'] == 80 and details['entries'] == 90
          dest = Path('m19_p0a_candidate/AMOSPro_AGA.Lib')
          dest.parent.mkdir(parents=True, exist_ok=True)
          dest.write_bytes(lib)
          assert sha256(dest.read_bytes()).hexdigest() == digest
          print('CANDIDATE GATE A ONLY', dest, len(lib), digest, 'WinUAE B / real Compiler C NOT TESTED')
          PY
      - name: Publish candidate as downloadable workflow artifact (not installed)
        uses: actions/upload-artifact@v4
        with:
          name: AMOSPro_AGA_M19_P0a_MC68020_GATE_A
          path: m19_p0a_candidate/AMOSPro_AGA.Lib
          retention-days: 14
          if-no-files-found: error
      - name: M19 P0b exact in-memory MC68020 candidate for canonical GitHub delivery
        run: |
          python -B - <<'PY'
          import sys
          from hashlib import sha256
          from pathlib import Path
          sys.path.insert(0,'tools')
          from build_m19_p0b_masks_in_memory import build
          lib,meta=build()
          digest=sha256(lib).hexdigest()
          assert (len(lib),digest,meta['commands'],meta['entries']) == (
              82376,'f272a98a9d07eb66dc515fc4598b16f9fd64cb55d84c36ec29068f9f074a44d9',82,92)
          dest=Path('m19_p0b_stage/AMOSPro_AGA.Lib')
          dest.parent.mkdir(parents=True,exist_ok=True)
          dest.write_bytes(lib)
          assert sha256(dest.read_bytes()).hexdigest()==digest
          print('M19 P0b source-verified MC68020 Gate A candidate',dest,len(lib),digest)
          PY
      - name: M19_P0B_EXACT_MAIN_STAGE artifact (delivery intermediary, not installation)
        uses: actions/upload-artifact@v4
        with:
          name: M19_P0b_MC68020_VALIDATED_LIB_FOR_MAIN
          path: m19_p0b_stage/AMOSPro_AGA.Lib
          retention-days: 3
          if-no-files-found: error
      - name: Ensure no binary, ASC or passed tests changed
        run: |
          git diff --exit-code -- dist/ tests/current/ tests/passed/
          git status --short
