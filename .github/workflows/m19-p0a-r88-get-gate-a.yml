name: M19 P0a R88-only MC68020 multi-image native Gate A

on:
  push:
    branches: [main]
    # Future M19 P0 files are included without editing this list.
    paths:
      - '.github/workflows/m19-p0a-r88-get-gate-a.yml'
      - 'tools/m19_p0*.py'
      - 'tools/ap20_v2_island_dispatch.py'
      - 'tools/build_m19_ap20_islands_in_memory.py'
      - 'tools/test_ap20_v2_island_dispatch.py'
      - 'tools/m19_ap20_unit5_emit.py'
      - 'tools/build_m19_ap20_unit5_in_memory.py'
      - 'tools/test_m19_ap20_unit5_gate_a.py'
      - 'tools/m19_p0g_checked_read_emit.py'
      - 'tools/m19_p0h_frame_preflight_emit.py'
      - 'tools/m19_p0i_multibank_draw_emit.py'
      - 'tools/build_m19_p0i_multibank_draw_in_memory.py'
      - 'tools/test_m19_p0i_multibank_draw_gate_a.py'
      - 'tools/m19_p0j_frame_image_preflight_emit.py'
      - 'tools/build_m19_p0j_frame_image_preflight_in_memory.py'
      - 'tools/test_m19_p0j_frame_image_preflight_gate_a.py'
      - 'tools/m19_p0j_explicit_bank_lookup_emit.py'
      - 'tools/build_m19_p0j_explicit_bank_lookup_in_memory.py'
      - 'tools/test_m19_p0j_explicit_bank_lookup_gate_a.py'
      - 'tools/m19_p0j_explicit_bank_stage_emit.py'
      - 'tools/build_m19_p0j_explicit_bank_stage_in_memory.py'
      - 'tools/test_m19_p0j_explicit_bank_stage_gate_a.py'
      - 'tools/m19_p0j_explicit_image_resolve_emit.py'
      - 'tools/build_m19_p0j_explicit_image_resolve_in_memory.py'
      - 'tools/test_m19_p0j_explicit_image_resolve_gate_a.py'
      - 'tools/m19_p0j_explicit_safe_draw_emit.py'
      - 'tools/build_m19_p0j_explicit_safe_draw_in_memory.py'
      - 'tools/test_m19_p0j_explicit_safe_draw_gate_a.py'
      - 'tools/m19_p0j_swap_barrier_emit.py'
      - 'tools/build_m19_p0j_swap_barrier_in_memory.py'
      - 'tools/test_m19_p0j_swap_barrier_gate_a.py'
      - 'tools/build_m19_p0j_public_draw_in_memory.py'
      - 'tools/test_m19_p0j_public_draw_gate_a.py'
      - 'tools/test_m19_p0j_pending_close_end_gate_a.py'
      - 'tools/m19_p0j_end_lifecycle_emit.py'
      - 'tools/build_m19_p0j_end_lifecycle_in_memory.py'
      - 'tools/test_m19_p0j_end_lifecycle_gate_a.py'
      - 'tools/build_m19_p0h_frame_preflight_in_memory.py'
      - 'tools/test_m19_p0h_frame_preflight_gate_a.py'
      - 'tools/build_m19_p0g_checked_read_in_memory.py'
      - 'tools/test_m19_p0g_checked_read_gate_a.py'
      - 'tools/test_m19_p0*.py'
      - 'tools/build_m19_p0*.py'
      - 'tools/amos_preflight.py'
      - 'tools/test_m19_p0j_b7_end_asc_static.py'
      - 'tools/test_m19_p0j_b7_anim_asc_static.py'
      - 'tools/audit_ap20.py'
      - 'tools/compiler_relocation.py'
      - 'tools/compiler_bridge_v2_probe.py'
      - 'tools/m68k_emit.py'
      - 'tools/experiments/ap20_v3_r82_split.py'
      - 'tests/current/M19_*.asc'
      - 'tests/design/M19_P0*.asc'
      - 'dist/AMOSPro_AGA.Lib'
      - 'dist/AMOSPro_AGA_LAST_GOOD.Lib'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m19-gate-a-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  get-bob-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: MC68020 emulator and disassembler
        run: python -m pip install --disable-pip-version-check unicorn==2.1.4 capstone==5.0.9
      - name: Immutable R88 and R84 bases
        run: |
          python -B -c "import hashlib,pathlib; h=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest(); assert h('dist/experimental/AMOSPro_AGA_R88_v0.13.33_M19_P28_GATE_A_ONLY.Lib')=='69e47f8571dc5e7e50c1aa341bfed9f65ef3f973c015788668f2034041632fbc'; assert h('dist/AMOSPro_AGA.Lib') in ('242e5ed7e8f732bf4e613a462b8dd266269f8d6977911bac867f5db26f8c39c6','00969199df0be556c53a2dcce03609127810216c28a3180c1aa97795621299ae','3d00b745591533a66d76c8c6e28fc8eca86da795e2e5e0cee06a6e22f548292a','f4db949114517f8d3b4d39b70c60b4f63d8d51a6433fecdadbbbfce96bf6689d','7922f558af378c07ff0ac339e3baeca11861c3e7feb3114d8f0c6c380158cd42','ce5fb614c7acae9b1bb88e1d793d73dbe7ba747edc285acb7d9e72ac3104176f'); assert h('dist/AMOSPro_AGA_LAST_GOOD.Lib')=='ce5fb614c7acae9b1bb88e1d793d73dbe7ba747edc285acb7d9e72ac3104176f'"
      - name: P0a host format, capture, and transaction regression
        run: |
          python -B tools/test_m19_p0a_multi_bob_abk.py
          python -B tools/test_m19_p0a_capture_transaction.py
          python -B tools/test_m19_p0a_amos_bank_transaction_emit.py
          python -B tools/test_m19_p0a_bank_select_emit.py
          python -B tools/test_m19_p0a_get_bob_emit.py
      - name: M19 AGBO future Chip staging HOST-ONLY regression
        run: python -B tools/test_m19_p0b_chip_dma_model.py
      - name: M19 P0c PRIVATE MC68020 Chip lifetime Gate A (OS mocks)
        run: python -B tools/test_m19_p0c_chip_stage_native.py
      - name: M19 P0c PRIVATE verified AGBO bank to Chip Gate A (AMOS mocks)
        run: python -B tools/test_m19_p0c_checked_bank_stage_native.py
      - name: M19 P0c PRIVATE per-bank Chip registry MC68020 Gate A
        run: python -B tools/test_m19_p0c_bank_registry_native.py
      - name: M19 P0c PRIVATE Screen preclose MC68020 Gate A (legacy close mocked)
        run: python -B tools/test_m19_p0c_screen_preclose_native.py
      - name: M19 P0d PRIVATE MC68020 Chip planar Bob Blitter Gate A (graphics mocked)
        run: python -B tools/test_m19_p0d_private_blit_native.py
      - name: M19 P0d PRIVATE verified AGBO image to staged Chip descriptor MC68020 Gate A
        run: python -B tools/test_m19_p0d_bank_image_resolve_native.py
      - name: M19 P0d PRIVATE Safe AGA back-buffer to staged AGBO Blitter MC68020 Gate A
        run: python -B tools/test_m19_p0d_safe_bank_blit_native.py
      - name: M19 P0d in-memory public Bob Blit AP20 V2 source builder Gate A
        run: python -B tools/build_m19_p0d_bob_blit_in_memory.py
      - name: M19 P0d public Bob Blit CPU020 + AP20 + lazy Chip/End Gate A
        run: python -B tools/test_m19_p0d_public_blit_gate_a.py
      - name: M19 P0e PRIVATE persistent Bob object metadata MC68020 Gate A
        run: python -B tools/test_m19_p0e_object_table_native.py
      - name: M19 P0e in-memory AP20 V2 AGA-group append and PC16 proof
        run: python -B tools/build_m19_p0e_object_table_in_memory.py
      - name: M19 P0e BOBS to AGA cross-unit native bridge AP20 PC16 source proof
        run: python -B tools/build_m19_p0e_v2_bridge_in_memory.py
      - name: M19 P0e cross-unit BOBS to AGA two-layout real-Init MC68020 Gate A
        run: python -B tools/test_m19_p0e_v2_object_bridge_native.py
      - name: M19 P0e public Bob Set/Off AP20 compiler V2 GetP and PC16 source-only proof
        run: python -B tools/build_m19_p0e_public_object_ops_in_memory.py
      - name: M19 P0e public Bob Set/Off real MC68020 AMOS GetP and ABI Gate A
        run: python -B tools/test_m19_p0e_public_object_ops_gate_a.py
      - name: M19 P0e prevent unsafe third Draw stub beyond signed PC16 Init reach
        run: python -B tools/test_m19_p0e_pc16_draw_rejection.py
      - name: M19 P0e split relocated BOBS to AGA bridge source and PC16 budget
        run: python -B tools/build_m19_p0e_split_public_in_memory.py
      - name: M19 P0e split bridge two-layout native MC68020 public Set Off Gate A
        run: python -B tools/test_m19_p0e_split_bridge_gate_a.py
      - name: M19 P0e source-only reset-before-Screen-Close V2 PC16 proof
        run: python -B tools/build_m19_p0e_split_close_in_memory.py
      - name: M19 P0e actual AGA native Close after P0e object reset MC68020 Gate A
        run: python -B tools/test_m19_p0e_split_close_gate_a.py
      - name: M19 P0f source-only live AGBO bank identity CPU020 Gate A
        run: python -B tools/test_m19_p0f_bank_stamp_native.py
      - name: M19 P0f bank stamp in AGA V2 AP20 byte-exact / unchanged PC16 Gate A
        run: python -B tools/build_m19_p0f_bank_stamp_in_memory.py
      - name: M19 P0f AGA per-object identity source-only HUNK/PC16 build
        run: python -B tools/build_m19_p0f_object_identity_in_memory.py
      - name: M19 P0f transactional per-object bank identity native CPU020 Gate A
        run: python -B tools/test_m19_p0f_object_identity_native.py
      - name: M19 P0f public Aga Bob routed into bank identity AGA V2 Gate A
        run: python -B tools/build_m19_p0f_public_bound_in_memory.py
      - name: M19 P0f public Aga Bob bank-escrow MC68020 two-layout Gate A
        run: python -B tools/test_m19_p0f_public_bound_native.py
      - name: M19 P0g PRIVATE stale-bank checked Bob read - MC68020 Gate A
        run: |
          python -B tools/m19_p0g_checked_read_emit.py
          python -B tools/build_m19_p0g_checked_read_in_memory.py
          python -B tools/test_m19_p0g_checked_read_gate_a.py
      - name: M19 P0h PRIVATE 64-Bob stale-source frame preflight MC68020 Gate A
        run: |
          python -B tools/m19_p0h_frame_preflight_emit.py
          python -B tools/build_m19_p0h_frame_preflight_in_memory.py
          python -B tools/test_m19_p0h_frame_preflight_gate_a.py
      - name: M19 P0i PRIVATE multi-bank Safe back-buffer Bob Blitter MC68020 Gate A
        run: |
          python -B tools/m19_p0i_multibank_draw_emit.py
          python -B tools/build_m19_p0i_multibank_draw_in_memory.py
          python -B tools/test_m19_p0i_multibank_draw_gate_a.py
      - name: M19 P0j 64-Bob image preflight BEFORE first Chip or Blit native Gate A
        run: |
          python -B tools/m19_p0j_frame_image_preflight_emit.py
          python -B tools/build_m19_p0j_frame_image_preflight_in_memory.py
          python -B tools/test_m19_p0j_frame_image_preflight_gate_a.py
      - name: M19 P0j-b1 private explicit original-bank Chip cache lookup MC68020 Gate A
        run: |
          python -B tools/m19_p0j_explicit_bank_lookup_emit.py
          python -B tools/build_m19_p0j_explicit_bank_lookup_in_memory.py
          python -B tools/test_m19_p0j_explicit_bank_lookup_gate_a.py
      - name: M19 P0j-b2 private source-only explicit-bank Chip stage native Gate A
        run: |
          python -B tools/m19_p0j_explicit_bank_stage_emit.py
          python -B tools/build_m19_p0j_explicit_bank_stage_in_memory.py
          python -B tools/test_m19_p0j_explicit_bank_stage_gate_a.py
      - name: M19 P0j-b3 private original-bank Chip image descriptor MC68020 Gate A
        run: |
          python -B tools/m19_p0j_explicit_image_resolve_emit.py
          python -B tools/build_m19_p0j_explicit_image_resolve_in_memory.py
          python -B tools/test_m19_p0j_explicit_image_resolve_gate_a.py
      - name: M19 P0j-b4 private 64-Bob no-shadow Safe Blitter MC68020 Gate A
        run: |
          python -B tools/m19_p0j_explicit_safe_draw_emit.py
          python -B tools/build_m19_p0j_explicit_safe_draw_in_memory.py
          python -B tools/test_m19_p0j_explicit_safe_draw_gate_a.py
      - name: M19 P0j-b5 private guarded AGA Swap / failure latch MC68020 Gate A
        run: |
          python -B tools/m19_p0j_swap_barrier_emit.py
          python -B tools/build_m19_p0j_swap_barrier_in_memory.py
          python -B tools/test_m19_p0j_swap_barrier_gate_a.py
      - name: M19 P0j-b6 source-only numeric Aga Bob Draw AP20 / MC68020 Gate A
        run: |
          python -B tools/build_m19_p0j_public_draw_in_memory.py
          python -B tools/test_m19_p0j_public_draw_gate_a.py
      - name: M19 P0j-b6 pending Safe/Disp Close-End native diagnostic MC68020
        run: |
          python -B tools/test_m19_p0j_pending_close_end_gate_a.py
      - name: M19 P0j-b7 source-only End lifecycle guarded Draw MC68020 Gate A
        run: |
          python -B tools/m19_p0j_end_lifecycle_emit.py
          python -B tools/build_m19_p0j_end_lifecycle_in_memory.py
          python -B tools/test_m19_p0j_end_lifecycle_gate_a.py
      - name: M19 AP20 V2 island dispatch P0f source-only MC68020 Gate A
        run: |
          python -B tools/build_m19_ap20_islands_in_memory.py
          python -B tools/test_ap20_v2_island_dispatch.py
      - name: M19 AP20 V2 fifth native unit source-only, MC68020 actual execution Gate A
        run: |
          python -B tools/m19_ap20_unit5_emit.py
          python -B tools/build_m19_ap20_unit5_in_memory.py
          python -B tools/test_m19_ap20_unit5_gate_a.py
      - name: M19 B7-m2 canonical Lib source-built; B7-m1/P0d/AP20 islands reproducible
        run: |
          python -B - <<'PY'
          import sys,hashlib,pathlib
          sys.path.insert(0,'tools')
          from build_m19_p0d_bob_blit_in_memory import build as p0d
          from build_m19_ap20_islands_in_memory import build as islands
          from build_m19_p0j_end_lifecycle_in_memory import build_multiframe as b7m1
          from build_m19_b7m2_close_reset_in_memory import build_close_reset as b7m2
          prev,old=p0d()
          assert len(prev)==91300 and old['sha256']=='bc13229fdc38b2420f6680aa000f58e1480d867a53c32fa4290139142eb919be'
          hist,hmeta=islands()
          assert len(hist)==96908 and hmeta['sha256']=='34f4e3c13f9a079e3e586e50b054b83459bb32bd7c5d15211b55437275e6bf56'
          active=pathlib.Path('dist/AMOSPro_AGA.Lib').read_bytes()
          frozen,m1meta=b7m1()
          assert len(frozen)==102360 and hashlib.sha256(frozen).hexdigest()=='838245ce1ad2a4120bb2512df8b2147ae89dc6b3eebe2ba2a9f633f2e9a56403'
          assert m1meta['ap20_entries']==181 and m1meta['public_commands']==86
          assert m1meta['native_groups']==[142,153,156,177] and m1meta['pc16_max']<32766 and m1meta['appended_bytes']==304
          image,meta=b7m2()
          assert len(image)==102400 and hashlib.sha256(image).hexdigest()=='242e5ed7e8f732bf4e613a462b8dd266269f8d6977911bac867f5db26f8c39c6'
          from build_m19_b8_first_update_in_memory import build_b8_first_update
          b8,b8meta=build_b8_first_update()
          assert len(b8)==115744 and hashlib.sha256(b8).hexdigest()=='00969199df0be556c53a2dcce03609127810216c28a3180c1aa97795621299ae'
          from build_m19_b8_safe_retry_in_memory import build_b8_safe_retry
          s1,s1meta=build_b8_safe_retry()
          assert len(s1)==116104 and s1meta['sha256']=='3d00b745591533a66d76c8c6e28fc8eca86da795e2e5e0cee06a6e22f548292a'
          from build_m19_b8_s1_bank_free_in_memory import build_bank_free
          p0,p0meta=build_bank_free()
          assert len(p0)==117896 and p0meta['sha256']=='f4db949114517f8d3b4d39b70c60b4f63d8d51a6433fecdadbbbfce96bf6689d'
          from active_library import verify_active
          assert active == verify_active(pathlib.Path('.'))[0], 'Active Lib must match its authoritative deterministic builder'
          assert meta['predecessor_sha']==m1meta['sha256']
          assert meta['ap20_entries']==181 and meta['public_commands']==86
          assert meta['native_groups']==[142,153,156,177] and meta['pc16_max']<32766 and meta['appended_bytes']==34
          print('PASS current B7/B8 source-pinned; historical B7-m1, P0d, islands reproducible')
          PY
      - name: M19 P0d design ASC static AMOS preflight (NOT WinUAE)
        run: python -B tools/amos_preflight.py --strict-target tests/design/M19_P0D_BOB_BLIT_01_UNVALIDATED.asc
      - name: M19 P0c in-memory public Screen Close V2 bridge provenance/ABI
        run: python -B tools/build_m19_p0c_screen_close_in_memory.py
      - name: M19 P0c REAL original AGA Screen Close CPU020 + BOBS preclose integration
        run: python -B tools/test_m19_p0c_screen_close_real_gate_a.py
      - name: M19 P0c PRIVATE real AMOS End callbacks MC68020 Gate A
        run: python -B tools/test_m19_p0c_program_end_real_gate_a.py
      - name: Rebuild exact R88-based AP20 candidate in memory
        run: |
          python -B tools/build_m19_p0a_r88_bank_in_memory.py
          python -B tools/build_m19_p0a_r88_get_in_memory.py
      - name: MC68020 bank selection and pixel-exact Get AGA Bob Gate A
        run: |
          python -B tools/test_m19_p0a_r88_bank_gate_a.py
          python -B tools/test_m19_p0a_r88_get_gate_a.py
      - name: MC68020 independent 1-bit mask source kernel (private Gate A)
        run: python -B tools/test_m19_p0b_mask020_native.py
      - name: M19 P0b full Make/No Mask AP20 candidate, in memory only
        run: python -B tools/build_m19_p0b_masks_in_memory.py
      - name: MC68020 Make and No Mask pixel-exact CPU Gate A
        run: python -B tools/test_m19_p0b_masks_gate_a.py
      - name: Verify P0a, P0b and P0c candidates in memory (never distribute from CI)
        run: |
          python -B - <<'PY'
          from hashlib import sha256
          import sys
          sys.path.insert(0, 'tools')
          from build_m19_p0a_r88_get_in_memory import build as build_a
          from build_m19_p0b_masks_in_memory import build as build_b
          from build_m19_p0c_screen_close_in_memory import build as build_c
          checks = (
              ('P0a', build_a, 79660, 'e98a1a17a5e1de579dd100c5cdeba2b8372f62f175274a4412ddeea21034e3b0', 'commands', 'entries', 80, 90),
              ('P0b', build_b, 82376, 'f272a98a9d07eb66dc515fc4598b16f9fd64cb55d84c36ec29068f9f074a44d9', 'commands', 'entries', 82, 92),
              ('P0c', build_c, 87020, '277802d4aefbe007b86cb8a4dbb9f0703f3a24014971a1824ba38f82d7d7b51a', 'public_commands', 'ap20_entries', 82, 92),
          )
          for label,builder,size,expected,cmd_field,entry_field,commands,entries in checks:
              raw,meta = builder()
              assert len(raw)==size and sha256(raw).hexdigest()==expected, label
              assert (meta[cmd_field],meta[entry_field])==(commands,entries), label
              if label=='P0c':
                  assert meta['program_end_hook'].startswith('PRIVATE')
              print(label, 'IN_MEMORY_GATE_A', size, expected, 'NOT_DISTRIBUTED')
          PY
      - name: M19 P0d active and historical design ASC static preflight
        run: |
          python -B tools/amos_preflight.py --strict-target tests/current/*.asc
          python -B tools/test_current_ram_log.py
          python -B tools/amos_preflight.py --strict-target tests/design/M19_P0D_BOB_BLIT_01_UNVALIDATED.asc
          python -B tools/amos_preflight.py --strict-target tests/design/M19_P0C_SCREEN_CLOSE_BRIDGE_01_UNVALIDATED.asc
      - name: Ensure no binary, ASC or passed tests changed
        run: |
          git diff --exit-code -- dist/ tests/current/ tests/passed/
          git status --short
