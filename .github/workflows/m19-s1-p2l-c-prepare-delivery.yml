name: M19 S1-P2l-c exact delivery preparation (read only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m19-s1-p2l-c-prepare-delivery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore pinned VASM
        id: vasm-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vasm/vasmm68k_mot
          key: vasm-m68k-mot-${{ runner.os }}-${{ runner.arch }}-ubuntu2404-8b85ef6eb7d257bf29a56ddc63cf2be20a317256
      - name: Build pinned VASM on cache miss
        if: steps.vasm-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/vasm"
          git -C "$RUNNER_TEMP/vasm" init
          git -C "$RUNNER_TEMP/vasm" remote add origin https://github.com/rhargreaves/vasm.git
          git -C "$RUNNER_TEMP/vasm" fetch --depth 1 origin 8b85ef6eb7d257bf29a56ddc63cf2be20a317256
          git -C "$RUNNER_TEMP/vasm" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/vasm" rev-parse HEAD)" = 8b85ef6eb7d257bf29a56ddc63cf2be20a317256
          make -C "$RUNNER_TEMP/vasm" CPU=m68k SYNTAX=mot -j2
      - name: Install pinned verification tools
        run: python -m pip install --disable-pip-version-check unicorn==2.1.4 capstone==5.0.9
      - name: Rebuild exact Gate A qualified bytes and preflight ASC
        run: |
          python -B tools/native_cpu_policy.py --self-test
          python -B tools/check_aga_delivery_paths.py --self-test
          git show 0b92f04326793727b4fdee67cdbc9400f2679c19:tests/current/SPRITE_PUBLIC.asc > "$RUNNER_TEMP/P2LB_SOURCE.asc"
          python -B tools/prepare_m19_s1p2l_c_campaign.py "$RUNNER_TEMP/P2LB_SOURCE.asc" "$RUNNER_TEMP/SPRITE_PUBLIC.asc"
          python -B tools/amos_preflight.py --strict-target --fail-on-warnings "$RUNNER_TEMP/SPRITE_PUBLIC.asc"
          PYTHONPATH=tools python -B - <<'PY'
          import base64, os
          from pathlib import Path
          from hashlib import sha256, sha1
          from build_m19_s1p2l_c_in_memory import build_s1p2lc, protected
          from verify_m19_s1p2l_b_delivery import check_active_pair
          before=protected()
          tmp=Path(os.environ['RUNNER_TEMP'])
          check_active_pair()
          out,meta=build_s1p2lc(tmp/'vasm/vasmm68k_mot')
          asc=(tmp/'SPRITE_PUBLIC.asc').read_bytes()
          assert len(out)==150056 and sha256(out).hexdigest()=='148b4d06702f84dd6de3eacd069a55c4759164bb4dd3c74f319f81e6f077f3f5'
          assert sha1(b'blob 150056'+bytes(1)+out).hexdigest()=='86d9497e3a2d5446001b9b41fc25d2e6a878ae50'
          assert len(asc)==6425 and sha256(asc).hexdigest()=='25a50fd84962dcdd0a52a45d496ad3413676d37aa4b3df4c2d74391d18c4a89e'
          assert meta['commands']==105 and meta['entries']==214
          assert meta['unit142']==65276 and meta['unit207']==11178
          assert protected()==before
          print('P2LC_EXACT_GATE_A_REBUILD_PASS',flush=True)
          # Transfer bytes only for the authorized canonical-slot commit.
          # No installable artifact or repository write from CI.
          for label,data in (('P2LC_LIB',out),('P2LC_ASC',asc)):
              print(label+'_IDENTITY',len(data),sha256(data).hexdigest(),
                    sha1(('blob %d' % len(data)).encode()+bytes(1)+data).hexdigest())
              enc=base64.b64encode(data).decode('ascii')
              for i in range(0,len(enc),2048):
                  print(label+'_CHUNK',i//2048,enc[i:i+2048])
          PY
          git diff --exit-code
      - name: Inventory active predecessor constraints for canonical activation
        run: |
          git grep -n -E 'S1P2LB_SHA|P2LB_SHA|P2LB_ASC_SHA|d9b690287c82c52a766d5ab4b015bb29d25057cbe55a630c0e30d88d46bd4ab1|a4ab96585d9e95c65dfaf42b76d9ba8b764c4e50e5cbd2d97d56a1947712d239' -- tools .github/workflows || true
