name: M19 S2f prepare future clipping campaign (no activation)
on:
  push:
    branches: [main]
    paths:
      - 'tools/prepare_m19_s2f_campaign.py'
      - '.github/workflows/m19-s2f-prepare-campaign.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned MC68020 test tools
        run: python -m pip install --disable-pip-version-check unicorn==2.1.4 capstone==5.0.9
      - name: Prepare and preflight without activation
        run: |
          python -B tools/native_cpu_policy.py --self-test
          python -B tools/check_aga_delivery_paths.py --self-test
          python -B tools/verify_m19_s2e_delivery.py
          python -B tools/prepare_m19_s2f_campaign.py --temp "$RUNNER_TEMP/s2f"
          python -B tools/amos_preflight.py --strict-target --fail-on-warnings "$RUNNER_TEMP/s2f/SPRITE_PUBLIC.asc"
          python -B tools/verify_m19_s2e_delivery.py
          git diff --exit-code
