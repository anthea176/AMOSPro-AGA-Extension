name: M19 B8 native two-page snapshot pool - MC68020 Gate A

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m19-b8-snapshot-pool-gate-a.yml'
      - 'tools/m19_b8_snapshot_pool_emit.py'
      - 'tools/test_m19_b8_snapshot_pool_gate_a.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m19-b8-snapshot-pool:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MC68020 emulator
        run: python -m pip install --disable-pip-version-check capstone==5.0.9 unicorn==2.1.4
      - name: Verify syntax and source emitter
        run: |
          python -B -m py_compile tools/m19_b8_snapshot_pool_emit.py tools/test_m19_b8_snapshot_pool_gate_a.py
          python -B tools/m19_b8_snapshot_pool_emit.py
      - name: Test real MC68020 transactional memory lifetime
        run: python -B tools/test_m19_b8_snapshot_pool_gate_a.py
      - name: Assert active B7-m2 binary unchanged
        run: |
          python -B - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          b=Path('dist/AMOSPro_AGA.Lib').read_bytes()
          assert len(b)==102400
          assert sha256(b).hexdigest()=='242e5ed7e8f732bf4e613a462b8dd266269f8d6977911bac867f5db26f8c39c6'
          print('PASS B7-m2 active unchanged')
          PY
