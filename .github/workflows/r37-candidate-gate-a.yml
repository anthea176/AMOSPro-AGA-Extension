name: R37 Font Select Gate A CPU 68000 and strict native source (in memory)

on:
  push:
    branches: [main]
    paths:
      - "tools/m11_text_r26_emit.py"
      - "tools/m14_font_select_r37_emit.py"
      - "tools/build_m14_font_select_r37.py"
      - "tools/test_m14_font_select_r37.py"
      - ".github/workflows/r37-candidate-gate-a.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r37_gate_a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install strict 68000 emulator/disassembler
        run: python -m pip install capstone==5.0.9 unicorn==2.1.4
      - name: R26 text legacy CPU regression
        run: python -B tools/test_m11_text_r26.py
      - name: R36 Palette Cycle native 68000 regression
        run: python -B tools/test_m13_palette_cycle_r36.py
      - name: R37 native 68000 font lifecycle and AP20 ABI checks
        run: python -B tools/test_m14_font_select_r37.py
      - name: R37 strict native source export (memory-only candidate)
        run: |
          python -B -c "import sys; sys.path.insert(0,'tools'); from build_m14_font_select_r37 import build; from pathlib import Path; Path('/tmp/AMOSPro_AGA_R37_GateA.Lib').write_bytes(build()[0])"
          python -B tools/generate_aga_native_source.py --lib /tmp/AMOSPro_AGA_R37_GateA.Lib --out /tmp/amos-aga-r37-native --baseline none --strict
      - name: Export R37 candidate bytes for separate post-Gate-A publication
        run: python -B tools/build_m14_font_select_r37.py --emit-base64

      - name: Publish candidate to main after Gate A PASS, not LAST_GOOD
        run: |
          python -B - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from build_m14_font_select_r37 import build,DEST,ARCHIVE,LAST_GOOD,BASE_SHA256
          from ap20_utils import digest
          assert digest(LAST_GOOD.read_bytes())==BASE_SHA256
          raw,report=build()
          assert raw==build()[0]
          ARCHIVE.parent.mkdir(parents=True,exist_ok=True)
          DEST.write_bytes(raw)
          ARCHIVE.write_bytes(raw)
          assert digest(DEST.read_bytes())==digest(ARCHIVE.read_bytes())
          assert digest(LAST_GOOD.read_bytes())==BASE_SHA256
          print('R37 Gate A candidate published, SHA256:',report['sha256'])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/AMOSPro_AGA.Lib dist/experimental/AMOSPro_AGA_M14_v0.10.9_FONT_SELECT_R37.Lib
          git commit -m "R37: publish Gate-A-tested 0.10.9 candidate on main; keep R36 LAST_GOOD"
          git push origin HEAD:main
