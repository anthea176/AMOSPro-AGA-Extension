name: M19 S2c P0 RGB24 2/4-plane AGSP capture and repack MC68020 (source only)
on:
  push:
    branches: [main]
    paths:
      - 'src/native/m19_s2/M19_S2C_AGSP_*.s'
      - 'tools/test_m19_s2c_capture_repack_cpu.py'
      - 'tools/m19_s1_agsp_bank.py'
      - '.github/workflows/m19-s2c-capture-repack-gate-a.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture-repack:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate policies and exact S2r active pair
        run: |
          python -B tools/native_cpu_policy.py --self-test
          python -B tools/check_aga_delivery_paths.py --self-test
          python -B -m py_compile tools/test_m19_s2c_capture_repack_cpu.py
          python -B tools/verify_m19_s1p2l_b_delivery.py
      - name: Restore pinned VASM Motorola assembler
        id: vasm-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vasm/vasmm68k_mot
          key: vasm-m68k-mot-${{ runner.os }}-${{ runner.arch }}-ubuntu2404-8b85ef6eb7d257bf29a56ddc63cf2be20a317256
      - name: Build pinned VASM if not cached
        if: steps.vasm-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/vasm"
          git -C "$RUNNER_TEMP/vasm" init
          git -C "$RUNNER_TEMP/vasm" remote add origin https://github.com/rhargreaves/vasm.git
          git -C "$RUNNER_TEMP/vasm" fetch --depth 1 origin 8b85ef6eb7d257bf29a56ddc63cf2be20a317256
          git -C "$RUNNER_TEMP/vasm" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/vasm" rev-parse HEAD)" = 8b85ef6eb7d257bf29a56ddc63cf2be20a317256
          make -C "$RUNNER_TEMP/vasm" CPU=m68k SYNTAX=mot -j2
      - name: Assemble isolated new and historical components
        run: |
          VASM="$RUNNER_TEMP/vasm/vasmm68k_mot"
          "$VASM" -Fbin -m68020 -no-opt -quiet -o "$RUNNER_TEMP/s2c_capture.bin" src/native/m19_s2/M19_S2C_AGSP_CAPTURE_MC68020.s
          "$VASM" -Fbin -m68020 -no-opt -quiet -o "$RUNNER_TEMP/s2c_repack.bin" src/native/m19_s2/M19_S2C_AGSP_REPACK_MC68020.s
          "$VASM" -Fbin -m68020 -no-opt -quiet -o "$RUNNER_TEMP/s1_capture.bin" src/native/m19_s1/M19_S1P1_AGSP_CAPTURE_MC68020.s
          "$VASM" -Fbin -m68020 -no-opt -quiet -o "$RUNNER_TEMP/s1_repack.bin" src/native/m19_s1/M19_S1P1B_AGSP_REPACK_MC68020.s
          "$VASM" -Fbin -m68020 -no-opt -quiet -o "$RUNNER_TEMP/agsp_validate.bin" src/native/m19_s1/M19_S1P1C_AGSP_VALIDATE_MC68020.s
      - name: Install pinned MC68020 emulator
        run: python -m pip install --disable-pip-version-check unicorn==2.1.4
      - name: Preserve original S1 behavior and validate existing AGSP codec
        env:
          AGSP_NATIVE_BIN: ${{ runner.temp }}/s1_capture.bin
          AGSP_REPACK_BIN: ${{ runner.temp }}/s1_repack.bin
          AGSP_VALIDATE_BIN: ${{ runner.temp }}/agsp_validate.bin
        run: |
          PYTHONPATH=tools python -B tools/test_m19_s1_agsp_bank.py
          PYTHONPATH=tools python -B tools/test_m19_s1p1_native_capture.py
          PYTHONPATH=tools python -B tools/test_m19_s1p1b_agsp_repack.py
          PYTHONPATH=tools python -B tools/test_m19_s1p1c_agsp_validate.py
      - name: Qualify S2c capture and repack on real MC68020 instructions
        env:
          S2C_CAPTURE_BIN: ${{ runner.temp }}/s2c_capture.bin
          AGSP_REPACK_BIN: ${{ runner.temp }}/s2c_repack.bin
          AGSP_VALIDATE_BIN: ${{ runner.temp }}/agsp_validate.bin
        run: PYTHONPATH=tools python -B tools/test_m19_s2c_capture_repack_cpu.py
      - name: Confirm canonical pair and protected files were not changed
        run: |
          python -B tools/verify_m19_s1p2l_b_delivery.py
          git diff --exit-code -- dist/ tests/current/ tests/passed/
