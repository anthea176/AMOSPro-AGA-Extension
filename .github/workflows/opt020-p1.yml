name: OPT020 P1 native 68020 bitfield prototype

on:
  push:
    branches: [main]
    paths:
      - "tools/opt020_p1_bitfield_emit.py"
      - "tools/test_opt020_p1_bitfield_native.py"
      - "tools/opt020_p1b_multiplane_emit.py"
      - "tools/opt020_p1b_region.py"
      - "tools/test_opt020_p1b_native.py"
      - "tools/opt020_p1c_rle_clip_emit.py"
      - "tools/opt020_p1c_native_runner.py"
      - "tools/opt020_p1c_region.py"
      - "tools/test_opt020_p1c_rle_clip_native.py"
      - "tools/opt020_p1d_fragment_emit.py"
      - "tools/opt020_p1d_ap20_probe_emit.py"
      - "tools/opt020_p1d_native_runner.py"
      - "tools/opt020_p1d_region.py"
      - "tools/opt020_p1e_painter_emit.py"
      - "tools/test_opt020_p1e_region.py"
      - "tools/test_opt020_p1e_matrix.py"
      - "tools/build_opt020_p1e_r69.py"
      - "tools/m18_image_region_emit.py"
      - "tools/test_opt020_p1d_fragments.py"
      - "tools/test_opt020_p1d_abi.py"
      - ".github/workflows/opt020-p1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install independent 020 emulator and decoder (test only)
        run: python -m pip install machine68k==0.4.0 capstone==5.0.9
      - name: Execute CPU000, 68EC020 and 68020 machine instructions
        run: python -B tools/test_opt020_p1_bitfield_native.py
      - name: Execute real masked eight-plane 68EC020 / 68020 and full AGAPIC RLE
        run: python -B tools/test_opt020_p1b_native.py
      - name: Execute native RLE pointer decoder and native 68020 crop/clipping
        run: python -B tools/test_opt020_p1c_rle_clip_native.py
      - name: Execute CPU020 clipped dynamic-width BFINS fragments and full AGAPIC regions
        run: python -B tools/test_opt020_p1d_fragments.py
      - name: Test synthetic AP20 ABI CPU gate and in-memory Compiler V2 round trip
        run: python -B tools/test_opt020_p1d_abi.py
      - name: Execute full R60 preflight and native CPU020 Image Region integration
        run: |
          python -B tools/test_opt020_p1e_region.py
          python -B tools/test_opt020_p1e_matrix.py
      - name: Verify deterministic R69 AP20 V2 Gate A candidate in memory only
        run: python -B tools/build_opt020_p1e_r69.py --emit-base64
      - name: Guard R68, LAST_GOOD, archives, and single active ASC
        run: git diff --exit-code -- dist/ tests/current/ tests/passed/ archive/
