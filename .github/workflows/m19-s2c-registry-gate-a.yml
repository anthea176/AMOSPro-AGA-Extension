name: M19 S2c P1b mixed v5 registry Gate A (source only)
on:
  push:
    branches: [main]
    paths:
      - 'src/native/m19_s2/M19_S2C_PERSIST_ROOT_MC68020.s'
      - 'src/native/m19_s2/M19_S2C_REGISTRY_MC68020.s'
      - 'src/native/m19_s2/M19_S2C_RETIRE_MIXED_MC68020.s'
      - 'src/native/m19_s2/M19_S2C_ALLOCATE_MC68020.s'
      - 'src/native/m19_s2/M19_S2C_ATTACHED_*.s'
      - 'tools/build_m19_s2c_registry_cpu.py'
      - 'tools/test_m19_s2c_registry_cpu.py'
      - '.github/workflows/m19-s2c-registry-gate-a.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  registry:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify canonical S2r and policies
        run: |
          python -B tools/native_cpu_policy.py --self-test
          python -B tools/check_aga_delivery_paths.py --self-test
          python -B -m py_compile tools/build_m19_s2c_registry_cpu.py tools/test_m19_s2c_registry_cpu.py
          python -B tools/verify_m19_s1p2l_b_delivery.py
      - name: Restore pinned VASM Motorola assembler
        id: vasm-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vasm/vasmm68k_mot
          key: vasm-m68k-mot-${{ runner.os }}-${{ runner.arch }}-ubuntu2404-8b85ef6eb7d257bf29a56ddc63cf2be20a317256
      - name: Build pinned VASM if not cached
        if: steps.vasm-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/vasm"
          git -C "$RUNNER_TEMP/vasm" init
          git -C "$RUNNER_TEMP/vasm" remote add origin https://github.com/rhargreaves/vasm.git
          git -C "$RUNNER_TEMP/vasm" fetch --depth 1 origin 8b85ef6eb7d257bf29a56ddc63cf2be20a317256
          git -C "$RUNNER_TEMP/vasm" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/vasm" rev-parse HEAD)" = 8b85ef6eb7d257bf29a56ddc63cf2be20a317256
          make -C "$RUNNER_TEMP/vasm" CPU=m68k SYNTAX=mot -j2
      - name: Assemble source-derived v5 registry and attached adapter
        run: |
          mkdir "$RUNNER_TEMP/s2c-v5"
          PYTHONPATH=tools python -B tools/build_m19_s2c_registry_cpu.py --vasm "$RUNNER_TEMP/vasm/vasmm68k_mot" --temp "$RUNNER_TEMP/s2c-v5"
      - name: Install pinned CPU emulator
        run: python -m pip install --disable-pip-version-check unicorn==2.1.4
      - name: Qualify mixed pair receipts, targeted and collective cleanup
        run: PYTHONPATH=tools python -B tools/test_m19_s2c_registry_cpu.py "$RUNNER_TEMP/s2c-v5/s2c_v5.bin"
      - name: Verify protected files
        run: |
          python -B tools/verify_m19_s1p2l_b_delivery.py
          git diff --exit-code -- dist/ tests/current/ tests/passed/
