name: M19 B8 first Update no-draw MC68020 Gate A

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m19-b8-first-update-gate-a.yml'
      - 'tools/m19_b8_first_update_emit.py'
      - 'tools/build_m19_b8_first_update_in_memory.py'
      - 'tools/test_m19_b8_first_update_gate_a.py'
      - 'tools/test_m19_b8_clear_update_asc_static.py'
      - 'tools/active_library.py'
      - 'dist/AMOSPro_AGA.Lib'
      - 'tests/current/*.asc'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m19-b8-first-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact MC68020 test dependencies
        run: python -m pip install --disable-pip-version-check capstone==5.0.9 unicorn==2.1.4 machine68k==0.4.0
      - name: Python syntax, CPU policy, delivery paths
        run: |
          python -B -m py_compile tools/m19_b8_first_update_emit.py tools/build_m19_b8_first_update_in_memory.py tools/test_m19_b8_first_update_gate_a.py
          python -B tools/native_cpu_policy.py --self-test
          python -B tools/check_aga_delivery_paths.py --self-test
      - name: Audit public AP20 Clear Update candidate in memory
        run: python -B tools/build_m19_b8_first_update_in_memory.py
      - name: Execute first Update MC68020 native B7 and B8
        run: python -B tools/test_m19_b8_first_update_gate_a.py
      - name: Emit exact B8 for authorized canonical library installation
        if: "${{ contains(github.event.head_commit.message, '[b8-emit]') }}"
        run: python -B tools/build_m19_b8_first_update_in_memory.py --emit-base64
      - name: Preserve historical B7/B8 native Gate A
        run: |
          python -B tools/test_m19_b8_atomic_integrated_b7_gate_a.py
          python -B tools/test_m19_b8_b7_trampoline_gate_a.py
      - name: Confirm exact current candidate, frozen B8/P1e source and protected L2b
        run: |
          python -B - <<'PY'
          import sys
          sys.path.insert(0, 'tools')
          from hashlib import sha256
          from pathlib import Path
          import subprocess
          import tempfile
          from hashlib import sha1
          from active_library import verify_active, frozen_p2d, P2D_SHA, P2DL2B_SHA, S1P1F_SHA, S1P1G_SHA, S1P1H_SHA
          current,good,label=verify_active(Path('.'))
          assert sha256(current).hexdigest() in (P2DL2B_SHA,S1P1F_SHA,S1P1G_SHA,S1P1H_SHA)
          assert len(good)==136708 and sha256(good).hexdigest()==P2DL2B_SHA
          assert sha256(frozen_p2d(good)).hexdigest()==P2D_SHA
          # Recheck the exact historical P1e campaign without touching current/.
          raw=subprocess.check_output(['git','show','a4d3b09af5553b4381a0971aaa93f33d17645894:tests/current/M19_B8_BOB_CLEAR_UPDATE_BC_01.asc'])
          assert sha1(f'blob {len(raw)}'.encode()+bytes([0])+raw).hexdigest()=='e1f53b952b900708a10d9297567ebb775c48825e'
          from test_m19_b8_clear_update_asc_static import verify
          with tempfile.TemporaryDirectory() as temp:
              asc=Path(temp)/'M19_B8_BOB_CLEAR_UPDATE_BC_01.asc'
              asc.write_bytes(raw)
              verify(asc)
          assert len(list(Path('tests/current').glob('*.asc')))==1
          print('PASS frozen B8/P1e ASC, exact current candidate and L2b LAST_GOOD:',label)
          PY
      - name: Static AMOS Professional preflight when B8 is active
        run: |
          if test -f tests/current/M19_B8_BOB_CLEAR_UPDATE_BC_01.asc; then
            python -B tools/test_m19_b8_clear_update_asc_static.py
            python -B tools/amos_preflight.py --strict-target tests/current/M19_B8_BOB_CLEAR_UPDATE_BC_01.asc
          fi
