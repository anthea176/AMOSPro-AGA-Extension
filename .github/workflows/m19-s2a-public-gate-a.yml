name: M19 S2a public frame change Gate A (source only)
on:
  push:
    branches: [main]
    paths:
      - 'src/native/m19_s2/*.s'
      - 'src/native/m19_s1/M19_S1P2M_*.s'
      - 'tools/build_m19_s2a_in_memory.py'
      - 'tools/test_m19_s2a_public_gate_a.py'
      - 'tools/test_m19_s1p2m_gate_a.py'
      - 'tools/prepare_m19_s2a_campaign.py'
      - '.github/workflows/m19-s2a-public-gate-a.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        suite: [public-runtime, public-compiled, lifetime-runtime, lifetime-compiled, chain, pattern, safeport, bob, prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore pinned VASM
        id: vasm-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vasm/vasmm68k_mot
          key: vasm-m68k-mot-${{ runner.os }}-${{ runner.arch }}-ubuntu2404-8b85ef6eb7d257bf29a56ddc63cf2be20a317256
      - name: Build pinned VASM on cache miss
        if: steps.vasm-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/vasm"
          git -C "$RUNNER_TEMP/vasm" init
          git -C "$RUNNER_TEMP/vasm" remote add origin https://github.com/rhargreaves/vasm.git
          git -C "$RUNNER_TEMP/vasm" fetch --depth 1 origin 8b85ef6eb7d257bf29a56ddc63cf2be20a317256
          git -C "$RUNNER_TEMP/vasm" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/vasm" rev-parse HEAD)" = 8b85ef6eb7d257bf29a56ddc63cf2be20a317256
          make -C "$RUNNER_TEMP/vasm" CPU=m68k SYNTAX=mot -j2
      - name: Install pinned MC68020 test tools
        run: python -m pip install --disable-pip-version-check unicorn==2.1.4 capstone==5.0.9
      - name: Validate policy and exact P2m parent
        run: |
          python -B tools/native_cpu_policy.py --self-test
          python -B tools/check_aga_delivery_paths.py --self-test
          python -B tools/verify_m19_s1p2l_b_delivery.py
      - name: Execute independent complete regression shard
        if: matrix.suite != 'prepare'
        run: |
          "$RUNNER_TEMP/vasm/vasmm68k_mot" -I src/native/m19_s1 -Fbin -m68020 -no-opt -quiet -o "$RUNNER_TEMP/p1i.bin" src/native/m19_s1/M19_S1P1I_BANK_PUBLIC_MC68020.s"
          PYTHONPATH=tools python -B tools/test_m19_s2a_public_gate_a.py --suite "${{ matrix.suite }}" --vasm "$RUNNER_TEMP/vasm/vasmm68k_mot" --historical "$RUNNER_TEMP/p1i.bin" | tee "$RUNNER_TEMP/s2a.log"
          grep -F 'S2A_SUITE_PASS ${{ matrix.suite }} ' "$RUNNER_TEMP/s2a.log" | grep -F '"sha256": "1d13ff815aa3b448e420f6783dbac967c03efca2fbb65932e783ec72502e58d2"'
        shell: bash
      - name: Reconstruct candidate and prepare single future ASC and bank
        if: matrix.suite == 'prepare'
        run: |
          mkdir -p "$RUNNER_TEMP/s2a"
          PYTHONPATH=tools python -B tools/prepare_m19_s2a_campaign.py --vasm "$RUNNER_TEMP/vasm/vasmm68k_mot" --temp "$RUNNER_TEMP/s2a"
          python -B tools/amos_preflight.py --strict-target --fail-on-warnings "$RUNNER_TEMP/s2a/SPRITE_PUBLIC.asc"
          git grep -n -E 'S1P2M_SHA|P2M_ASC_SHA|P2M_SHA|M19 S1-P2m|S1-P2m L2b non-distributed' -- tools/ .github/workflows/ || true
      - name: Preserve canonical P2m and LAST_GOOD
        run: |
          python -B tools/verify_m19_s1p2l_b_delivery.py
          git diff --exit-code
  complete:
    needs: qualify
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'S2A_FULL_GATE_A_PASS 1d13ff815aa3b448e420f6783dbac967c03efca2fbb65932e783ec72502e58d2 151164 190504fd46494224c6c32e20f17dcc3d6a027684'
