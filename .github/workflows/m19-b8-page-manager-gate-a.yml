name: M19 B8 private MC68020 page manager Gate A

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m19-b8-page-manager-gate-a.yml'
      - 'tools/m19_b8_page_manager_emit.py'
      - 'tools/test_m19_b8_page_manager_gate_a.py'
      - 'tools/build_m19_b8_page_manager_in_memory.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b8-private-page-manager:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native MC68020 test environment
        run: python -m pip install --disable-pip-version-check capstone==5.0.9 unicorn==2.1.4 machine68k==0.4.0
      - name: Verify source syntax
        run: |
          python -B -m py_compile tools/m19_b8_page_manager_emit.py tools/test_m19_b8_page_manager_gate_a.py tools/build_m19_b8_page_manager_in_memory.py
          python -B tools/m19_b8_page_manager_emit.py
      - name: Test real MC68020 source-only service with mocked Exec/Safe
        run: python -B tools/test_m19_b8_page_manager_gate_a.py
      - name: Verify AP20 fifth group candidate remains source only
        run: python -B tools/build_m19_b8_page_manager_in_memory.py
      - name: Protect current Lib, LAST_GOOD and validated ASC
        run: |
          python -B - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          expected = {
              'dist/AMOSPro_AGA.Lib':'f4db949114517f8d3b4d39b70c60b4f63d8d51a6433fecdadbbbfce96bf6689d',
              'dist/AMOSPro_AGA_LAST_GOOD.Lib':'f4db949114517f8d3b4d39b70c60b4f63d8d51a6433fecdadbbbfce96bf6689d',
              'tests/current/M19_B8_BOB_CLEAR_UPDATE_BC_01.asc':'923f80ccf985e60a3952474fb63a3c8d19541f91f2adf9aecf6b8a14ad1c6fc8'
          }
          for path,value in expected.items():
              assert sha256(Path(path).read_bytes()).hexdigest()==value,path
          print('PASS B7-m2, LAST_GOOD and validated ASC unchanged')
          PY
