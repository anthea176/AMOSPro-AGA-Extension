name: M19 P2.5 R87 native BOBS Batch - Probe removed - Gate A

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m19-p25-r87-no-probe-gate-a.yml"
      - "tools/build_m19_p25_no_probe.py"
      - "tools/test_m19_p25_no_probe.py"
      - "tools/test_m19_p24_bobs_pixels_bench_static.py"
      - "tools/active_library.py"
      - "tools/m19_bob_batch_emit.py"
      - "dist/AMOSPro_AGA.Lib"
      - "dist/AMOSPro_AGA_LAST_GOOD.Lib"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m19-p25-r87-main
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native MC68020 dependencies
        run: python -m pip install --disable-pip-version-check unicorn==2.1.4 capstone==5.0.9
      - name: Build R87 in memory without editing dist
        run: python -B tools/build_m19_p25_no_probe.py
      - name: Real MC68020 BOBS Batch Gate A with no diagnostic Probe
        run: python -B tools/test_m19_p25_no_probe.py
      - name: Verify only one current ASC and independent pixel expectations
        run: |
          python -B tools/test_current_ram_log.py
          python -B tools/test_m19_p24_bobs_pixels_bench_static.py
      - name: Write candidate ONLY to dist/AMOSPro_AGA.Lib
        run: |
          python -B tools/build_m19_p25_no_probe.py --write-dist
          python -B tools/build_m19_p25_no_probe.py --check-dist
      - name: Verify active AP20 identity, no Probe and frozen R84
        run: |
          python -B tools/verify_fast.py
          python -B tools/test_m19_p24_bobs_pixels_bench_static.py
          python -B -c "import hashlib,pathlib; p=pathlib.Path('dist/AMOSPro_AGA_LAST_GOOD.Lib'); assert len(p.read_bytes())==67904; assert hashlib.sha256(p.read_bytes()).hexdigest()=='46f274c6051f171132f4dcf6f0e8c3a8ccef16162dfa6a804cab6c3a7bf08e6d'"
          git diff --exit-code -- dist/AMOSPro_AGA_LAST_GOOD.Lib tests/current/ tests/passed/
      - uses: actions/upload-artifact@v4
        with:
          name: M19_P25_R87_NATIVE_NO_PROBE_GATE_A
          path: dist/AMOSPro_AGA.Lib
          if-no-files-found: error
          retention-days: 14
      - name: Commit ONLY verified active R87 binary to main
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- dist/AMOSPro_AGA.Lib
          if ! git diff --cached --quiet; then
            git commit -m "M19 P2.5 R87 active candidate binary - no Probe - Gate A"
            git push origin HEAD:main
          fi
