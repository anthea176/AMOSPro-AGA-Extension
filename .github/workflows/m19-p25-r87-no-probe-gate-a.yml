name: M19 R87 historical regression and current AMOS ASC preflight

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m19-p25-r87-no-probe-gate-a.yml"
      - "tools/build_m19_p25_no_probe.py"
      - "tools/test_m19_p25_no_probe.py"
      - "tools/test_m19_p25_r87_smoke_static.py"
      - "tools/test_m19_p26_r87_bobs_bench_static.py"
      - "tools/test_m19_p27_cache_bench_static.py"
      - "tests/passed/M19_P26_R87_DRAW_BENCH_01.asc"
      - "tests/passed/M19_P25_R87_BOBS_SMOKE_01.asc"
      - "tools/amos_preflight.py"
      - "tools/test_amos_preflight.py"
      - "tools/test_current_ram_log.py"
      - "tools/test_m19_b7m1_lifecycle_asc_static.py"
      - "tests/current/*.asc"
      - "tests/design/M19_P24_BOBS_PIXELS_BENCH_01_UNVALIDATED.asc"
      - "tools/active_library.py"
      - "tools/m19_bob_batch_emit.py"
      - "dist/AMOSPro_AGA.Lib"
      - "dist/AMOSPro_AGA_LAST_GOOD.Lib"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m19-p25-r87-main
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native MC68020 dependencies
        run: python -m pip install --disable-pip-version-check unicorn==2.1.4 capstone==5.0.9
      - name: Build R87 in memory without editing dist
        run: python -B tools/build_m19_p25_no_probe.py
      - name: Real MC68020 BOBS Batch Gate A with no diagnostic Probe
        run: python -B tools/test_m19_p25_no_probe.py
      - name: AMOS Pro source grammar preflight from amos-pro-aga-rules
        run: |
          python -B tools/test_amos_preflight.py
          python -B tools/amos_preflight.py --strict-target --fail-on-warnings tests/current/*.asc
      - name: Verify archived P2.5/P2.6/P2.7 and the sole active AMOS source
        run: |
          python -B tools/test_current_ram_log.py
          python -B tools/test_m19_p25_r87_smoke_static.py
          python -B tools/test_m19_p26_r87_bobs_bench_static.py
          python -B tools/test_m19_p27_cache_bench_static.py
      - name: Check R87 historical binary and source-pinned current B7/B8 candidate
        run: |
          python -B tools/verify_fast.py
          python -B tools/test_m19_p25_r87_smoke_static.py
          python -B tools/test_m19_p26_r87_bobs_bench_static.py
          python -B tools/test_m19_p27_cache_bench_static.py
          PYTHONPATH=tools python -B - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          from active_library import B7M2_SHA,B8_SHA,B8S1_SHA,P0_FREE_SHA,P1E_SHA,P2D_SHA,S1P1E_SHA,P2DL2_SHA,P2DL2B_SHA, S1P1F_SHA, S1P1G_SHA,verify_active
          root=Path('.')
          historical=(root/'dist/experimental/AMOSPro_AGA_R87_v0.13.32_M19_P25_BC_PASS.Lib').read_bytes()
          assert len(historical)==73184 and sha256(historical).hexdigest()=='02d97cfaea9949f9a5d5a5ae6ce4ac4754cde353667a8c5b0b821f1aeb03c302'
          active,good,_=verify_active(root)
          assert (len(active),sha256(active).hexdigest()) in ((102400,B7M2_SHA),(115744,B8_SHA),(116104,B8S1_SHA),(117896,P0_FREE_SHA),(124444,P1E_SHA),(136020,P2D_SHA),(142000,S1P1E_SHA),(136332,P2DL2_SHA),(136708,P2DL2B_SHA),(142684,S1P1F_SHA, S1P1G_SHA),(142684,S1P1G_SHA))
          assert (len(good),sha256(good).hexdigest()) in ((124444,P1E_SHA),(136020,P2D_SHA),(136708,P2DL2B_SHA))
          PY
          git diff --exit-code -- dist/ tests/current/ tests/passed/
