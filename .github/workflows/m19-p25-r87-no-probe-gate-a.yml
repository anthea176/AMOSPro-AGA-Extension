name: M19 R87 historical read-only regression and P0c ASC preflight

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m19-p25-r87-no-probe-gate-a.yml"
      - "tools/build_m19_p25_no_probe.py"
      - "tools/test_m19_p25_no_probe.py"
      - "tools/test_m19_p25_r87_smoke_static.py"
      - "tools/test_m19_p26_r87_bobs_bench_static.py"
      - "tools/test_m19_p27_cache_bench_static.py"
      - "tests/passed/M19_P26_R87_DRAW_BENCH_01.asc"
      - "tests/passed/M19_P25_R87_BOBS_SMOKE_01.asc"
      - "tools/amos_preflight.py"
      - "tools/test_amos_preflight.py"
      - "tests/current/*.asc"
      - "tests/design/M19_P24_BOBS_PIXELS_BENCH_01_UNVALIDATED.asc"
      - "tools/active_library.py"
      - "tools/m19_bob_batch_emit.py"
      - "dist/AMOSPro_AGA.Lib"
      - "dist/AMOSPro_AGA_LAST_GOOD.Lib"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m19-p25-r87-main
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native MC68020 dependencies
        run: python -m pip install --disable-pip-version-check unicorn==2.1.4 capstone==5.0.9
      - name: Build R87 in memory without editing dist
        run: python -B tools/build_m19_p25_no_probe.py
      - name: Real MC68020 BOBS Batch Gate A with no diagnostic Probe
        run: python -B tools/test_m19_p25_no_probe.py
      - name: AMOS Pro source grammar preflight from amos-pro-aga-rules
        run: |
          python -B tools/test_amos_preflight.py
          python -B tools/amos_preflight.py --strict-target --fail-on-warnings tests/current/M19_P0J_B7_END_NO_CLOSE_BC_02.asc
      - name: Verify archived P2.5/P2.6/P2.7 and unique current P2.8 ASC
        run: |
          python -B tools/test_current_ram_log.py
          python -B tools/test_m19_p25_r87_smoke_static.py
          python -B tools/test_m19_p26_r87_bobs_bench_static.py
          python -B tools/test_m19_p27_cache_bench_static.py
      - name: Check R87 historical binary archived and P0c active candidate pinned
        run: |
          python -B tools/verify_fast.py
          python -B tools/test_m19_p25_r87_smoke_static.py
          python -B tools/test_m19_p26_r87_bobs_bench_static.py
          python -B tools/test_m19_p27_cache_bench_static.py
          python -B -c "import hashlib,pathlib; h=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest(); assert h('dist/experimental/AMOSPro_AGA_R87_v0.13.32_M19_P25_BC_PASS.Lib')=='02d97cfaea9949f9a5d5a5ae6ce4ac4754cde353667a8c5b0b821f1aeb03c302'; assert h('dist/AMOSPro_AGA.Lib')=='f69e048b9478145e9dae2c5ebbdec39736ad7df5dfa0034a201feb863078ab0b'; assert h('dist/AMOSPro_AGA_LAST_GOOD.Lib')=='46f274c6051f171132f4dcf6f0e8c3a8ccef16162dfa6a804cab6c3a7bf08e6d'"
          git diff --exit-code -- dist/ tests/current/ tests/passed/
