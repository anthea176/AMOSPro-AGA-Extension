name: M19 B7-m1 persistent Bob lifecycle - MC68020 Gate A

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m19-bob-lifecycle-gate-a.yml'
      - 'tools/test_m19_b7m1_bob_lifecycle_gate_a.py'
      - 'tools/test_m19_p0j_end_lifecycle_gate_a.py'
      - 'tools/test_m19_p0j_pending_close_end_gate_a.py'
      - 'tools/test_m19_p0j_swap_barrier_gate_a.py'
      - 'tools/m19_p0j_end_lifecycle_emit.py'
      - 'tools/build_m19_p0j_end_lifecycle_in_memory.py'
      - 'dist/AMOSPro_AGA.Lib'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b7m1-bob-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact CPU020 instruction and emulator dependencies
        run: python -m pip install --disable-pip-version-check capstone==5.0.9 unicorn==2.1.4 machine68k==0.4.0
      - name: Verify test Python syntax
        run: python -B -m py_compile tools/test_m19_b7m1_bob_lifecycle_gate_a.py
      - name: Execute native MC68020 Bob Off, reactivation and 64-object lifecycle Gate A
        run: python -B tools/test_m19_b7m1_bob_lifecycle_gate_a.py
      - name: Verify distributed library and regression fixtures were not modified
        run: git diff --exit-code -- dist/ tests/current/ tests/passed/
