name: M19 Bob lifecycle B7-m1 and B7-m2 Close reset - MC68020 Gate A

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m19-bob-lifecycle-gate-a.yml'
      - 'tools/test_m19_b7m1_bob_lifecycle_gate_a.py'
      - 'tools/test_m19_p0j_end_lifecycle_gate_a.py'
      - 'tools/test_m19_p0j_pending_close_end_gate_a.py'
      - 'tools/test_m19_p0j_swap_barrier_gate_a.py'
      - 'tools/m19_p0j_end_lifecycle_emit.py'
      - 'tools/build_m19_p0j_end_lifecycle_in_memory.py'
      - 'tools/m19_b7m2_close_reset_emit.py'
      - 'tools/build_m19_b7m2_close_reset_in_memory.py'
      - 'tools/test_m19_b7m2_close_reset_gate_a.py'
      - 'dist/AMOSPro_AGA.Lib'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b7m1-bob-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact CPU020 instruction and emulator dependencies
        run: python -m pip install --disable-pip-version-check capstone==5.0.9 unicorn==2.1.4 machine68k==0.4.0
      - name: Verify test Python syntax
        run: |
          python -B -m py_compile tools/test_m19_b7m1_bob_lifecycle_gate_a.py
          python -B -m py_compile tools/m19_b7m2_close_reset_emit.py tools/build_m19_b7m2_close_reset_in_memory.py tools/test_m19_b7m2_close_reset_gate_a.py
      - name: Execute source-pinned B7 lifecycle or current B8 integrated regression
        run: |
          python -B - <<'PY'
          import sys,subprocess
          from hashlib import sha256
          from pathlib import Path
          sys.path.insert(0,'tools')
          from active_library import B7M2_SHA,B8_SHA
          digest=sha256(Path('dist/AMOSPro_AGA.Lib').read_bytes()).hexdigest()
          if digest==B7M2_SHA:
              test='tools/test_m19_b7m1_bob_lifecycle_gate_a.py'
          elif digest==B8_SHA:
              test='tools/test_m19_b8_atomic_integrated_b7_gate_a.py'
          else:
              raise AssertionError('Unknown installed B7/B8 library')
          subprocess.check_call([sys.executable,'-B',test])
          print('PASS native lifecycle source test',test)
          PY
      - name: Execute historical B7-m2 test or current B8 integration, source-pinned
        run: |
          python -B - <<'PY'
          import sys,subprocess
          from hashlib import sha256
          from pathlib import Path
          sys.path.insert(0,'tools')
          from active_library import B7M2_SHA,B8_SHA
          digest=sha256(Path('dist/AMOSPro_AGA.Lib').read_bytes()).hexdigest()
          if digest==B7M2_SHA:
              name='tools/test_m19_b7m2_close_reset_gate_a.py'
          elif digest==B8_SHA:
              name='tools/test_m19_b8_first_update_gate_a.py'
          else:
              raise AssertionError('Unknown current B7/B8 binary')
          subprocess.check_call([sys.executable,'-B',name])
          print('PASS source-backed native lifecycle',name)
          PY
      - name: Verify distributed library and regression fixtures were not modified
        run: git diff --exit-code -- dist/ tests/current/ tests/passed/
