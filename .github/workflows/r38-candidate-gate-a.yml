name: R38 AMCAF BankFont Gate A CPU 68000 and strict native source

on:
  push:
    branches: [main]
    paths:
      - "tools/amcaf_font_r38_layout.py"
      - "tools/m14_font_bank_r38_emit.py"
      - "tools/build_m14_font_bank_r38.py"
      - "tools/test_m14_font_bank_r38.py"
      - ".github/workflows/r38-candidate-gate-a.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r38_gate_a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install strict 68000 emulator and disassembler
        run: python -m pip install capstone==5.0.9 unicorn==2.1.4
      - name: R38 native 68000 BankFont lifecycle, malformed banks and AP20 ABI
        run: python -B tools/test_m14_font_bank_r38.py
      - name: R37 native Font Select regression
        run: python -B tools/test_m14_font_select_r37.py
      - name: R26 legacy text regression
        run: python -B tools/test_m11_text_r26.py
      - name: R36 native palette regression
        run: python -B tools/test_m13_palette_cycle_r36.py
      - name: R38 strict native 68000 source export (memory-only)
        run: |
          python -B -c "import sys; sys.path.insert(0,'tools'); from build_m14_font_bank_r38 import build; from pathlib import Path; Path('/tmp/AMOSPro_AGA_R38_GateA.Lib').write_bytes(build()[0])"
          python -B tools/generate_aga_native_source.py --lib /tmp/AMOSPro_AGA_R38_GateA.Lib --out /tmp/amos-aga-r38-native --baseline none --strict
      - name: Export reproducible candidate only after all Gate A tests PASS
        run: python -B tools/build_m14_font_bank_r38.py --emit-base64
      - name: Guard promoted R38 LAST_GOOD and frozen archives
        run: |
          python -B -c "import sys; sys.path.insert(0,'tools'); from build_m14_font_bank_r38 import BASE,BASE_SHA256,LAST_GOOD,LAST_GOOD_SHA256; from ap20_utils import digest; assert digest(BASE.read_bytes())==BASE_SHA256; assert digest(LAST_GOOD.read_bytes())==LAST_GOOD_SHA256; print('R38 LAST_GOOD unchanged')"
          git diff --exit-code -- dist/AMOSPro_AGA.Lib dist/AMOSPro_AGA_LAST_GOOD.Lib
