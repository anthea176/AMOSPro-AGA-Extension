name: M19 P2d Bob Auto Update installable Gate A
on:
  push:
    branches: [main]
    paths:
      - 'tools/*m19_p2d*.py'
      - 'tools/*m19_p2c*.py'
      - 'tools/build_m19_p2b_in_memory.py'
      - 'tools/active_library.py'
      - 'dist/AMOSPro_AGA.Lib'
      - 'dist/AMOSPro_AGA_LAST_GOOD.Lib'
      - 'tests/current/*.asc'
      - '.github/workflows/m19-p2d-bob-auto-update-gate-a.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mc68020:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check unicorn==2.1.4 capstone==5.0.9
      - name: Check the active campaign and documented API
        run: |
          python -B tools/amos_preflight.py --strict-target --fail-on-warnings tests/current/*.asc
          python -B tools/test_current_ram_log.py
          python -B tools/test_readme_api_coverage.py
      - name: Build and execute both AP20 layouts
        run: |
          python -B tools/test_m19_p2d_bob_auto_update_model.py
          python -B tools/test_m19_p2d_bob_auto_update_gate_a.py
          python -B tools/test_m19_p2c_bob_planes_gate_a.py
      - name: Check promoted P2d source identity and official delivery paths
        run: |
          PYTHONPATH=tools python -B - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          from active_library import verify_active, P2D_SHA, S1P1E_SHA, P2DL2_SHA, P2DL2B_SHA, S1P2J_SHA, S1P2K_SHA, S1P2LB_SHA, S1P2LC_SHA, SPRITE_L2B_HISTORICAL_SHAS
          from build_m19_p2d_in_memory import build_p2d
          raw, info = build_p2d()
          assert sha256(raw).hexdigest() == P2D_SHA
          active, protected, label = verify_active(Path('.'))
          assert sha256(protected).hexdigest() == P2DL2B_SHA and len(protected) == 136708
          from active_library import verify_p2d_l2b
          verify_p2d_l2b(protected, raw)
          assert sha256(active).hexdigest() in (P2D_SHA, S1P1E_SHA, P2DL2_SHA, P2DL2B_SHA, *SPRITE_L2B_HISTORICAL_SHAS)
          current = list(Path('tests/current').glob('*.asc'))
          assert len(current) == 1
          expected = {P2DL2_SHA: 'M19_P2D_L2_SAFEPORT_BC.asc', P2DL2B_SHA: 'T06_PATTERN_TARGET.asc', **dict.fromkeys(SPRITE_L2B_HISTORICAL_SHAS, 'T06_PATTERN_TARGET.asc'), S1P2J_SHA: 'SPRITE_PUBLIC.asc', S1P2K_SHA: 'SPRITE_PUBLIC.asc', S1P2LB_SHA: 'SPRITE_PUBLIC.asc', S1P2LC_SHA: 'SPRITE_PUBLIC.asc'}.get(sha256(active).hexdigest(), 'M19_P2_ALL_IN_ONE.asc')
          assert current[0].name == expected
          if sha256(active).hexdigest() == P2DL2_SHA:
              assert sha256(current[0].read_bytes()).hexdigest() == '720348897fd0f939dc413687ccc69ed524fd7edff863dcc89f320a1f68e0f974'
          if sha256(active).hexdigest()==S1P2LC_SHA:
              assert sha256(current[0].read_bytes()).hexdigest() == '25a50fd84962dcdd0a52a45d496ad3413676d37aa4b3df4c2d74391d18c4a89e'
          elif sha256(active).hexdigest()==S1P2LB_SHA:
              assert sha256(current[0].read_bytes()).hexdigest() == 'a4ab96585d9e95c65dfaf42b76d9ba8b764c4e50e5cbd2d97d56a1947712d239'
          elif sha256(active).hexdigest()==S1P2K_SHA:
              assert sha256(current[0].read_bytes()).hexdigest() == '987d45cd1f14aa62df944c7af35eda6884b0a44a70d3b7f0415e0ff2dd8a2c1e'
          elif sha256(active).hexdigest()==S1P2J_SHA:
              assert sha256(current[0].read_bytes()).hexdigest() == '7c6cd1fdca86323271810d37f484b2bad33b70fe02c968a4d7bb306511c56084'
          elif sha256(active).hexdigest() in (P2DL2B_SHA, *SPRITE_L2B_HISTORICAL_SHAS):
              assert sha256(current[0].read_bytes()).hexdigest() == '55f295a3bc78d38ad349f08e5d28e36e388d1cfd3333e700d91bcba5fcf4e795'
          print(info, label)
          PY
          git diff --exit-code -- dist/ tests/current/ tests/passed/
