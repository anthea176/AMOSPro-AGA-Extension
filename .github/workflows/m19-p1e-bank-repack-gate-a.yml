name: M19 P1e AGBO bank editing MC68020
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m19-p1e-bank-repack-gate-a.yml'
      - 'tools/*m19*p1e*bank_repack*.py'
      - 'tools/*m19*p1e*bank_edit*.py'
      - 'tools/m19_p0c_checked_bank_stage_emit.py'
      - 'tools/m19_p0a_multi_bob_abk.py'
      - 'tools/m19_p0a_capture_transaction.py'
      - 'dist/AMOSPro_AGA.Lib'
      - 'dist/AMOSPro_AGA_LAST_GOOD.Lib'
      - 'tests/current/**'
      - 'tools/active_library.py'
      - 'tools/test_m19_b8_clear_update_asc_static.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  edit-native:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check unicorn==2.1.4 capstone==5.0.9
      - name: AGBO host and transaction regressions
        run: |
          python -B tools/test_m19_p0a_multi_bob_abk.py
          python -B tools/test_m19_p0a_capture_transaction.py
      - name: Execute the private native repacker
        run: python -B tools/test_m19_p1e_bank_repack_gate_a.py
      - name: Execute Del Bob and Ins Bob with AMOS bank service fixtures
        run: python -B tools/test_m19_p1e_bank_edit_gate_a.py
      - name: Verify installed P1e, protected P0 and AMOS campaign
        run: |
          PYTHONPATH=tools python -B -c 'from pathlib import Path; from active_library import verify_active, P1E_SHA; from hashlib import sha256; current, _, _ = verify_active(Path(".")); assert sha256(current).hexdigest() == P1E_SHA'
          python -B tools/test_m19_b8_clear_update_asc_static.py
          python -B tools/test_current_ram_log.py
          python -B tools/amos_preflight.py --strict-target tests/current/M19_B8_BOB_CLEAR_UPDATE_BC_01.asc
      - name: Preserve the active test and both library binaries
        run: git diff --exit-code -- dist/ tests/current/
