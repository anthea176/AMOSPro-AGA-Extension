name: M19 P1e historical source and P2d-L2b promoted LAST_GOOD - MC68020 Gate A
on:
  push:
    branches: [main]
    paths:
      - 'tools/test_current_ram_log.py'
      - '.github/workflows/m19-p1e-bank-repack-gate-a.yml'
      - 'tools/*m19*p1e*bank_repack*.py'
      - 'tools/*m19*p1e*bank_edit*.py'
      - 'tools/m19_p0c_checked_bank_stage_emit.py'
      - 'tools/m19_p0a_multi_bob_abk.py'
      - 'tools/m19_p0a_capture_transaction.py'
      - 'dist/AMOSPro_AGA.Lib'
      - 'dist/AMOSPro_AGA_LAST_GOOD.Lib'
      - 'tests/current/**'
      - 'tools/active_library.py'
      - 'tools/build_m19_p0a_r88_bank_in_memory.py'
      - 'tools/build_aga_r84_agapic.py'
      - 'tools/build_agapic_v2_r82_api_preview.py'
      - 'tools/build_agapic_v2_r82_full_preview.py'
      - 'tools/test_m19_b8_clear_update_asc_static.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  edit-native:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          # Exact S2r verification reads the SHA-pinned S2b predecessor.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check unicorn==2.1.4 capstone==5.0.9
      - name: AGBO host and transaction regressions
        run: |
          python -B tools/test_m19_p0a_multi_bob_abk.py
          python -B tools/test_m19_p0a_capture_transaction.py
      - name: Execute the private native repacker
        run: python -B tools/test_m19_p1e_bank_repack_gate_a.py
      - name: Execute Del Bob and Ins Bob with AMOS bank service fixtures
        run: python -B tools/test_m19_p1e_bank_edit_gate_a.py
      - name: Verify historical P1e source and promoted P2d-L2b LAST_GOOD (Runtime/Compiler not executed here)
        run: |
          PYTHONPATH=tools python -B -c 'from pathlib import Path; from active_library import verify_active; from build_m19_p1e_bank_edit_in_memory import build_p1e; _, good, _ = verify_active(Path(".")); assert good != build_p1e()[0]; from build_m19_p2d_in_memory import build_p2d; from active_library import verify_p2d_l2b; verify_p2d_l2b(good, build_p2d()[0])'
          python -B tools/test_current_ram_log.py
          python -B tools/amos_preflight.py --strict-target tests/current/*.asc
      - name: Preserve the active test and both library binaries
        run: git diff --exit-code -- dist/ tests/current/
