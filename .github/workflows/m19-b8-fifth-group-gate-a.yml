name: M19 B8 fifth private AP20 native group source-only Gate A

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m19-b8-fifth-group-gate-a.yml'
      - 'tools/build_m19_b8_fifth_group_in_memory.py'
      - 'tools/test_m19_b8_fifth_group_gate_a.py'
      - 'tools/m19_b8_back_selector_emit.py'
      - 'tools/m19_b8_snapshot_pool_emit.py'
      - 'tools/m19_b8_planar_snapshot_emit.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m19-b8-five-unit-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python and AP20 source dependencies
        run: python -m pip install --disable-pip-version-check machine68k==0.4.0
      - name: Python syntax and builder source
        run: |
          python -B -m py_compile tools/build_m19_b8_fifth_group_in_memory.py tools/test_m19_b8_fifth_group_gate_a.py
          python -B tools/build_m19_b8_fifth_group_in_memory.py
      - name: Exact AP20 ancestry, additional group and existing GetP/PC16 checks
        run: python -B tools/test_m19_b8_fifth_group_gate_a.py
      - name: Working Lib and Last Good are unmodified
        run: |
          python -B - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          for path,expected in [
              ('dist/AMOSPro_AGA.Lib','f4db949114517f8d3b4d39b70c60b4f63d8d51a6433fecdadbbbfce96bf6689d'),
              ('dist/AMOSPro_AGA_LAST_GOOD.Lib','f4db949114517f8d3b4d39b70c60b4f63d8d51a6433fecdadbbbfce96bf6689d')
          ]:
              assert sha256(Path(path).read_bytes()).hexdigest()==expected
          print('PASS working and LAST_GOOD untouched')
          PY
