name: M19 AP20 islands - verify canonical MC68020 Lib (read only)

# Historical filename kept to avoid breaking external references.
# This workflow MUST NOT publish artifacts, ZIPs, or commit to main.
on:
  push:
    branches: [main]
    # Source-only M19 changes already run the dedicated native Gate A workflow.
    # This independent check is for changes to the real installable Lib.
    paths:
      - '.github/workflows/m19-p0a-publish-github.yml'
      - 'dist/AMOSPro_AGA.Lib'
      - 'dist/AMOSPro_AGA_LAST_GOOD.Lib'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m19-canonical-lib-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  verify-canonical-m19-p0a:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout read-only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: MC68020 execution dependencies
        run: python -m pip install --disable-pip-version-check unicorn==2.1.4 capstone==5.0.9
      - name: Validate native CPU policy and the single active AMOS test
        run: |
          python -B tools/native_cpu_policy.py --self-test
          python -B tools/check_aga_delivery_paths.py --self-test
          python -B tools/amos_preflight.py --strict-target tests/current/M19_AP20_ISLANDS_01.asc
          python -B tools/test_amos_preflight.py
      - name: Verify active and preserved binary signatures
        run: |
          python -B - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          expected = {
              'dist/AMOSPro_AGA.Lib':
                  (96908, '34f4e3c13f9a079e3e586e50b054b83459bb32bd7c5d15211b55437275e6bf56'),
              'dist/experimental/AMOSPro_AGA_R88_v0.13.33_M19_P28_GATE_A_ONLY.Lib':
                  (75040, '69e47f8571dc5e7e50c1aa341bfed9f65ef3f973c015788668f2034041632fbc'),
              'dist/AMOSPro_AGA_LAST_GOOD.Lib':
                  (67904, '46f274c6051f171132f4dcf6f0e8c3a8ccef16162dfa6a804cab6c3a7bf08e6d'),
          }
          for path, (size, digest) in expected.items():
              data = Path(path).read_bytes()
              assert len(data) == size and sha256(data).hexdigest() == digest, path
          asc = sorted(p.name for p in Path('tests/current').glob('*.asc'))
          assert asc == ['M19_AP20_ISLANDS_01.asc'], asc
          print('PASS: one canonical Lib, one active ASC, R88 archive and R84 LAST_GOOD verified')
          PY
      - name: Run host, AP20 and MC68020 Gate A checks
        run: |
          python -B tools/test_m19_p0a_multi_bob_abk.py
          python -B tools/test_m19_p0a_capture_transaction.py
          python -B tools/test_m19_p0a_amos_bank_transaction_emit.py
          python -B tools/test_m19_p0a_bank_select_emit.py
          python -B tools/test_m19_p0a_get_bob_emit.py
          python -B tools/test_m19_p0a_r88_bank_gate_a.py
          python -B tools/test_m19_p0a_r88_get_gate_a.py
          python -B tools/test_m19_p0b_mask020_native.py
          python -B tools/build_m19_p0b_masks_in_memory.py
          python -B tools/test_m19_p0b_masks_gate_a.py
          python -B tools/test_m19_p0c_screen_close_real_gate_a.py
          python -B tools/test_m19_p0c_program_end_real_gate_a.py
          python -B tools/test_m19_p0d_private_blit_native.py
          python -B tools/test_m19_p0d_bank_image_resolve_native.py
          python -B tools/test_m19_p0d_safe_bank_blit_native.py
          python -B tools/test_m19_p0d_public_blit_gate_a.py
      - name: Rebuild P0d independently and AP20 islands candidate exact in canonical dist
        run: |
          python -B - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import sys
          sys.path.insert(0, 'tools')
          from build_m19_p0d_bob_blit_in_memory import build as build_p0d
          from build_m19_ap20_islands_in_memory import build as build_islands
          old,old_meta=build_p0d()
          assert (len(old),sha256(old).hexdigest())==(91300,'bc13229fdc38b2420f6680aa000f58e1480d867a53c32fa4290139142eb919be')
          assert old_meta['commands']==83 and old_meta['entries']==93
          candidate,meta=build_islands()
          active=Path('dist/AMOSPro_AGA.Lib').read_bytes()
          assert candidate==active and len(active)==96908
          assert sha256(active).hexdigest()=='34f4e3c13f9a079e3e586e50b054b83459bb32bd7c5d15211b55437275e6bf56'
          assert meta['ap20_entries']==178 and meta['new_pc16']==854
          print('PASS: P0d historical reproducible, AP20 islands exact canonical candidate')
          print('WinUAE Gate B and actual Compiler Gate C NOT tested here')
          PY
      - name: Fail if validation creates files or changes the repository
        run: |
          git diff --exit-code -- dist/ tools/ tests/current/ tests/passed/
          if [ -n "$(git ls-files --others --exclude-standard -- dist/)" ]; then
            echo 'FAIL: validation generated untracked files under dist/'
            git ls-files --others --exclude-standard -- dist/
            exit 1
          fi
