name: M19 canonical active Lib and protected LAST_GOOD (read only)

# Historical filename kept to avoid breaking external references.
# This workflow MUST NOT publish artifacts, ZIPs, or commit to main.
on:
  push:
    branches: [main]
    # Source-only M19 changes already run the dedicated native Gate A workflow.
    # This independent check is for changes to the real installable Lib.
    paths:
      - 'tools/test_current_ram_log.py'
      - '.github/workflows/m19-p0a-publish-github.yml'
      - 'dist/AMOSPro_AGA.Lib'
      - 'dist/AMOSPro_AGA_LAST_GOOD.Lib'
      - 'tools/active_library.py'
      - 'tools/build_agapic_v2_r82_api_preview.py'
      - 'tools/build_agapic_v2_r82_full_preview.py'
      - 'tools/build_aga_r84_agapic.py'
      - 'tests/current/*.asc'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m19-canonical-lib-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  verify-canonical-m19-p0a:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout read-only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: MC68020 execution dependencies
        run: python -m pip install --disable-pip-version-check unicorn==2.1.4 capstone==5.0.9
      - name: Validate native CPU policy and the single active AMOS test
        run: |
          python -B tools/native_cpu_policy.py --self-test
          python -B tools/check_aga_delivery_paths.py --self-test
          python -B tools/amos_preflight.py --strict-target tests/current/*.asc
          python -B tools/test_current_ram_log.py
          python -B tools/test_amos_preflight.py
      - name: Verify active and preserved binary signatures
        run: |
          python -B - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          expected = {
              'dist/experimental/AMOSPro_AGA_R88_v0.13.33_M19_P28_GATE_A_ONLY.Lib':
                  (75040, '69e47f8571dc5e7e50c1aa341bfed9f65ef3f973c015788668f2034041632fbc'),
              'dist/AMOSPro_AGA_LAST_GOOD.Lib':
                  (136708, 'a7ed96e92b460e842772aed77ac35a303d8f663aaa456821c323109446dd19dc'),
          }
          for path, (size, digest) in expected.items():
              data = Path(path).read_bytes()
              assert len(data) == size and sha256(data).hexdigest() == digest, path
          import sys
          sys.path.insert(0,'tools')
          from active_library import verify_active,B7M2_SHA,B8_SHA,B8S1_SHA,P0_FREE_SHA,P1A_SHA,P1B_SHA,P1C_SHA, P1D_SHA, P1E_SHA, P2A_SHA, P2B_SHA, P2C_SHA, P2D_SHA, S1P1E_SHA, P2DL2_SHA, P2DL2B_SHA, S1P2J_SHA, S1P2K_SHA, S1P2LB_SHA, S1P2LC_SHA, S1P2M_SHA, S2A_SHA, S2B_SHA, S2R_SHA, SPRITE_L2B_HISTORICAL_SHAS
          active,good,label=verify_active(Path('.'))
          sha=sha256(active).hexdigest()
          assert sha in (B7M2_SHA,B8_SHA,B8S1_SHA,P0_FREE_SHA,P1A_SHA,P1B_SHA,P1C_SHA, P1D_SHA, P1E_SHA, P2A_SHA, P2B_SHA, P2C_SHA, P2D_SHA, S1P1E_SHA, P2DL2_SHA, P2DL2B_SHA, *SPRITE_L2B_HISTORICAL_SHAS)
          asc=sorted(p.name for p in Path('tests/current').glob('*.asc'))
          expected_asc={B7M2_SHA: 'M19_B7M1_BOB_LIFECYCLE_RUNTIME_01.asc',
                        P2A_SHA: 'M19_P2A_BOB_COL.asc',
                        P2B_SHA: 'M19_P2B_BOB_FLIP.asc',
                        P2C_SHA: 'M19_P2C_BOB_PLANES.asc',
                        P2D_SHA: 'M19_P2_ALL_IN_ONE.asc',
              P2DL2_SHA: 'M19_P2D_L2_SAFEPORT_BC.asc',
              P2DL2B_SHA: 'T06_PATTERN_TARGET.asc',
              **dict.fromkeys(SPRITE_L2B_HISTORICAL_SHAS, 'T06_PATTERN_TARGET.asc'),
              S1P2J_SHA: 'SPRITE_PUBLIC.asc',
              S1P2K_SHA: 'SPRITE_PUBLIC.asc',
              S1P2LB_SHA: 'SPRITE_PUBLIC.asc',
              S1P2LC_SHA: 'SPRITE_PUBLIC.asc',
              S1P2M_SHA: 'SPRITE_PUBLIC.asc',
              S2A_SHA: 'SPRITE_PUBLIC.asc', S2B_SHA: 'SPRITE_PUBLIC.asc', S2R_SHA: 'SPRITE_PUBLIC.asc',
              S1P1E_SHA: 'M19_P2_ALL_IN_ONE.asc'}.get(sha, 'M19_B8_BOB_CLEAR_UPDATE_BC_01.asc')
          assert asc==[expected_asc],asc
          if sha==S2R_SHA:
              from verify_m19_s2r_delivery import verify_asc, verify_abk
              verify_asc((Path('tests/current')/asc[0]).read_bytes())
              verify_abk(Path('tests/current/AGSP_S2B_MULTI.ABK').read_bytes())
          elif sha==S2B_SHA:
              from verify_m19_s2b_delivery import verify_asc, verify_abk
              verify_asc((Path('tests/current')/asc[0]).read_bytes())
              verify_abk(Path('tests/current/AGSP_S2B_MULTI.ABK').read_bytes())
          elif sha==S2A_SHA:
              from verify_m19_s2a_delivery import verify_asc, verify_abk
              verify_asc((Path('tests/current')/asc[0]).read_bytes())
              verify_abk(Path('tests/current/AGSP_S2A_ANIMATION.ABK').read_bytes())
          elif sha==S1P2M_SHA:
              assert sha256((Path('tests/current')/asc[0]).read_bytes()).hexdigest() == '84d2dfddc753e2c05d8a05ff991fe8b4f3e6d36daa20110cc447add547aaa684'
          elif sha==S1P2LC_SHA:
              assert sha256((Path('tests/current')/asc[0]).read_bytes()).hexdigest() == '25a50fd84962dcdd0a52a45d496ad3413676d37aa4b3df4c2d74391d18c4a89e'
          elif sha==S1P2LB_SHA:
              assert sha256((Path('tests/current')/asc[0]).read_bytes()).hexdigest() == 'a4ab96585d9e95c65dfaf42b76d9ba8b764c4e50e5cbd2d97d56a1947712d239'
          elif sha==S1P2K_SHA:
              assert sha256((Path('tests/current')/asc[0]).read_bytes()).hexdigest() == '987d45cd1f14aa62df944c7af35eda6884b0a44a70d3b7f0415e0ff2dd8a2c1e'
          elif sha==S1P2J_SHA:
              assert sha256((Path('tests/current')/asc[0]).read_bytes()).hexdigest() == '7c6cd1fdca86323271810d37f484b2bad33b70fe02c968a4d7bb306511c56084'
          elif sha in (P2DL2B_SHA, *SPRITE_L2B_HISTORICAL_SHAS):
              assert sha256((Path('tests/current')/asc[0]).read_bytes()).hexdigest() == '55f295a3bc78d38ad349f08e5d28e36e388d1cfd3333e700d91bcba5fcf4e795'
          if sha==P1A_SHA:
              assert len(active)==118816 and active!=good
              assert sha256(good).hexdigest()==P0_FREE_SHA
          print('PASS: one canonical Lib, one active ASC, R88 archive and promoted P2d-L2b LAST_GOOD verified')
          PY
      - name: Run host, AP20 and MC68020 Gate A checks
        run: |
          python -B tools/test_m19_p0a_multi_bob_abk.py
          python -B tools/test_m19_p0a_capture_transaction.py
          python -B tools/test_m19_p0a_amos_bank_transaction_emit.py
          python -B tools/test_m19_p0a_bank_select_emit.py
          python -B tools/test_m19_p0a_get_bob_emit.py
          python -B tools/test_m19_p0a_r88_bank_gate_a.py
          python -B tools/test_m19_p0a_r88_get_gate_a.py
          python -B tools/test_m19_p0b_mask020_native.py
          python -B tools/build_m19_p0b_masks_in_memory.py
          python -B tools/test_m19_p0b_masks_gate_a.py
          python -B tools/test_m19_p0c_screen_close_real_gate_a.py
          python -B tools/test_m19_p0c_program_end_real_gate_a.py
          python -B tools/test_m19_p0d_private_blit_native.py
          python -B tools/test_m19_p0d_bank_image_resolve_native.py
          python -B tools/test_m19_p0d_safe_bank_blit_native.py
          python -B tools/test_m19_p0d_public_blit_gate_a.py
          python -B tools/test_m19_p0j_end_lifecycle_gate_a.py
      - name: Rebuild B7-m2 exact canonical and frozen B7-m1 P0d island source
        run: |
          python -B - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import sys
          sys.path.insert(0,'tools')
          from build_m19_p0d_bob_blit_in_memory import build as p0d
          from build_m19_ap20_islands_in_memory import build as islands
          from build_m19_p0j_end_lifecycle_in_memory import build_multiframe as b7m1
          from build_m19_b7m2_close_reset_in_memory import build_close_reset as b7m2
          from active_library import verify_active
          old,oldmeta=p0d()
          assert (len(old),sha256(old).hexdigest())==(91300,'bc13229fdc38b2420f6680aa000f58e1480d867a53c32fa4290139142eb919be')
          assert oldmeta['commands']==83 and oldmeta['entries']==93
          hist,histmeta=islands()
          assert len(hist)==96908 and histmeta['sha256']=='34f4e3c13f9a079e3e586e50b054b83459bb32bd7c5d15211b55437275e6bf56'
          frozen,m1meta=b7m1()
          assert len(frozen)==102360 and sha256(frozen).hexdigest()=='838245ce1ad2a4120bb2512df8b2147ae89dc6b3eebe2ba2a9f633f2e9a56403'
          assert m1meta['ap20_entries']==181 and m1meta['public_commands']==86
          assert m1meta['native_groups']==[142,153,156,177] and m1meta['pc16_max']<32766 and m1meta['appended_bytes']==304
          candidate,meta=b7m2()
          active=Path('dist/AMOSPro_AGA.Lib').read_bytes()
          assert len(candidate)==102400 and sha256(candidate).hexdigest()=='242e5ed7e8f732bf4e613a462b8dd266269f8d6977911bac867f5db26f8c39c6'
          from build_m19_b8_first_update_in_memory import build_b8_first_update
          b8,b8meta=build_b8_first_update()
          assert len(b8)==115744 and sha256(b8).hexdigest()=='00969199df0be556c53a2dcce03609127810216c28a3180c1aa97795621299ae'
          from build_m19_b8_safe_retry_in_memory import build_b8_safe_retry
          b8s1,s1meta=build_b8_safe_retry()
          assert len(b8s1)==116104 and s1meta['sha256']=='3d00b745591533a66d76c8c6e28fc8eca86da795e2e5e0cee06a6e22f548292a'
          from build_m19_b8_s1_bank_free_in_memory import build_bank_free
          p0,p0meta=build_bank_free()
          assert (len(p0),p0meta['sha256'])==(117896,'f4db949114517f8d3b4d39b70c60b4f63d8d51a6433fecdadbbbfce96bf6689d')
          assert active == verify_active(Path('.'))[0], 'Active Lib must match its authoritative deterministic builder'
          assert meta['predecessor_sha']==m1meta['sha256']
          assert meta['ap20_entries']==181 and meta['public_commands']==86
          assert meta['native_groups']==[142,153,156,177] and meta['pc16_max']<32766 and meta['appended_bytes']==34
          print('PASS B7-m2 immutable and B8/P0 source-built; B7-m1/P0d/AP20 islands frozen')
          print('WinUAE Runtime B and real AMOS Compiler C NOT tested by CI')
          PY
      - name: Fail if validation creates files or changes the repository
        run: |
          git diff --exit-code -- dist/ tools/ tests/current/ tests/passed/
          if [ -n "$(git ls-files --others --exclude-standard -- dist/)" ]; then
            echo 'FAIL: validation generated untracked files under dist/'
            git ls-files --others --exclude-standard -- dist/
            exit 1
          fi
