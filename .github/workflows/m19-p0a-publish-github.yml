name: M19 P0a - verify canonical MC68020 Lib (read only)

# Historical filename kept to avoid breaking external references.
# This workflow MUST NOT publish artifacts, ZIPs, or commit to main.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m19-p0a-publish-github.yml'
      - 'tools/m19_p0a_*.py'
      - 'tools/build_m19_p0a_r88_*.py'
      - 'tests/current/M19_P0A_MC68020_BANK_GET.asc'
      - 'dist/AMOSPro_AGA.Lib'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-canonical-m19-p0a:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout read-only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: MC68020 execution dependencies
        run: python -m pip install --disable-pip-version-check unicorn==2.1.4 capstone==5.0.9
      - name: Validate native CPU policy and the single active AMOS test
        run: |
          python -B tools/native_cpu_policy.py --self-test
          python -B tools/check_aga_delivery_paths.py --self-test
          python -B tools/amos_preflight.py --strict-target tests/current/M19_P0A_MC68020_BANK_GET.asc
          python -B tools/test_amos_preflight.py
      - name: Verify active and preserved binary signatures
        run: |
          python -B - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          expected = {
              'dist/AMOSPro_AGA.Lib':
                  (79660, 'e98a1a17a5e1de579dd100c5cdeba2b8372f62f175274a4412ddeea21034e3b0'),
              'dist/experimental/AMOSPro_AGA_R88_v0.13.33_M19_P28_GATE_A_ONLY.Lib':
                  (75040, '69e47f8571dc5e7e50c1aa341bfed9f65ef3f973c015788668f2034041632fbc'),
              'dist/AMOSPro_AGA_LAST_GOOD.Lib':
                  (67904, '46f274c6051f171132f4dcf6f0e8c3a8ccef16162dfa6a804cab6c3a7bf08e6d'),
          }
          for path, (size, digest) in expected.items():
              data = Path(path).read_bytes()
              assert len(data) == size and sha256(data).hexdigest() == digest, path
          asc = sorted(p.name for p in Path('tests/current').glob('*.asc'))
          assert asc == ['M19_P0A_MC68020_BANK_GET.asc'], asc
          print('PASS: one canonical Lib, one active ASC, R88 archive and R84 LAST_GOOD verified')
          PY
      - name: Run host, AP20 and MC68020 Gate A checks
        run: |
          python -B tools/test_m19_p0a_multi_bob_abk.py
          python -B tools/test_m19_p0a_capture_transaction.py
          python -B tools/test_m19_p0a_amos_bank_transaction_emit.py
          python -B tools/test_m19_p0a_bank_select_emit.py
          python -B tools/test_m19_p0a_get_bob_emit.py
          python -B tools/test_m19_p0a_r88_bank_gate_a.py
          python -B tools/test_m19_p0a_r88_get_gate_a.py
      - name: Rebuild in memory and compare byte-for-byte to canonical dist
        run: |
          python -B - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import sys
          sys.path.insert(0, 'tools')
          from build_m19_p0a_r88_get_in_memory import build
          data, meta = build()
          expected = 'e98a1a17a5e1de579dd100c5cdeba2b8372f62f175274a4412ddeea21034e3b0'
          assert (len(data), sha256(data).hexdigest()) == (79660, expected)
          assert meta['commands'] == 80 and meta['entries'] == 90
          assert data == Path('dist/AMOSPro_AGA.Lib').read_bytes(), 'active Lib differs from R88-based rebuild'
          print('PASS: in-memory MC68020 rebuild identical to dist/AMOSPro_AGA.Lib')
          print('Gate A only: WinUAE Gate B and real Compiler Gate C NOT tested here')
          PY
      - name: Fail if validation creates files or changes the repository
        run: |
          git diff --exit-code -- dist/ tools/ tests/current/ tests/passed/
          if [ -n "$(git ls-files --others --exclude-standard -- dist/)" ]; then
            echo 'FAIL: validation generated untracked files under dist/'
            git ls-files --others --exclude-standard -- dist/
            exit 1
          fi
