name: M19 P0a - publish MC68020 candidate Lib and example on main

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m19-p0a-publish-github.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-gated-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: MC68020 execution dependencies
        run: python -m pip install --disable-pip-version-check unicorn==2.1.4 capstone==5.0.9
      - name: Preflight the exact source and CPU policy
        run: |
          python -B tools/native_cpu_policy.py --self-test
          python -B tools/amos_preflight.py --strict-target examples/m19_p0a_68020/M19_P0A_MC68020_BANK_GET.asc
          python -B tools/test_amos_preflight.py
      - name: Verify original R88 and protected R84
        run: |
          python -B - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          b = lambda p: sha256(Path(p).read_bytes()).hexdigest()
          assert b('dist/AMOSPro_AGA.Lib') == '69e47f8571dc5e7e50c1aa341bfed9f65ef3f973c015788668f2034041632fbc'
          assert b('dist/AMOSPro_AGA_LAST_GOOD.Lib') == '46f274c6051f171132f4dcf6f0e8c3a8ccef16162dfa6a804cab6c3a7bf08e6d'
          PY
      - name: Run host, AP20 and native MC68020 Gate A tests
        run: |
          python -B tools/test_m19_p0a_multi_bob_abk.py
          python -B tools/test_m19_p0a_capture_transaction.py
          python -B tools/test_m19_p0a_amos_bank_transaction_emit.py
          python -B tools/test_m19_p0a_bank_select_emit.py
          python -B tools/test_m19_p0a_get_bob_emit.py
          python -B tools/test_m19_p0a_r88_bank_gate_a.py
          python -B tools/test_m19_p0a_r88_get_gate_a.py
      - name: Build and SHA-verify actual MC68020 library for GitHub
        run: |
          python -B - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import sys, zipfile
          sys.path.insert(0, 'tools')
          from build_m19_p0a_r88_get_in_memory import build
          data, metadata = build()
          digest = sha256(data).hexdigest()
          expected = 'e98a1a17a5e1de579dd100c5cdeba2b8372f62f175274a4412ddeea21034e3b0'
          assert (len(data), digest) == (79660, expected), (len(data), digest)
          assert metadata['commands'] == 80 and metadata['entries'] == 90
          target = Path('dist/experimental/AMOSPro_AGA_M19_P0A_MC68020_GATE_A.Lib')
          target.parent.mkdir(exist_ok=True, parents=True)
          target.write_bytes(data)
          check = Path('dist/experimental/AMOSPro_AGA_M19_P0A_MC68020_GATE_A.sha256')
          assert check.read_text().split()[0] == digest
          ex = Path('examples/m19_p0a_68020')
          bundle = Path('dist/experimental/AMOSPro_AGA_M19_P0A_MC68020_GATE_A_WINUAE.zip')
          with zipfile.ZipFile(bundle, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              z.writestr('AMOSPro_AGA.Lib', data)
              for src in (ex/'M19_P0A_MC68020_BANK_GET.asc', ex/'README.fr.md'):
                  z.write(src, src.name)
              z.write(check, check.name)
          with zipfile.ZipFile(bundle) as z:
              assert sha256(z.read('AMOSPro_AGA.Lib')).hexdigest() == digest
              assert len(z.namelist()) == 4
          print('GITHUB CANDIDATE M19 P0a MC68020', target, len(data), digest)
          print('WINUAE TEST BUNDLE', bundle, bundle.stat().st_size)
          print('GATE A ONLY; WinUAE B and real Compiler C NOT TESTED')
          PY
      - name: Confirm historical assets remain unchanged
        run: git diff --exit-code -- dist/AMOSPro_AGA.Lib dist/AMOSPro_AGA_LAST_GOOD.Lib tests/current/ tests/passed/
      - name: Commit binary and bundle to main, no branches and no promotion
        run: |
          git add -- dist/experimental/AMOSPro_AGA_M19_P0A_MC68020_GATE_A.Lib \
            dist/experimental/AMOSPro_AGA_M19_P0A_MC68020_GATE_A_WINUAE.zip
          git diff --cached --name-only
          if git diff --cached --quiet; then
            echo 'Exact candidate already published in main.'
          else
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'build(M19 P0a): publish reproducible MC68020 Lib and WinUAE test bundle'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
