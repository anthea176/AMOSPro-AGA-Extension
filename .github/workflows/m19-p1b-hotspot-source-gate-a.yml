name: M19 P1b Hot Spot Safe Blitter MC68020 Gate A + canonical Lib
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m19-p1b-hotspot-source-gate-a.yml'
      - 'tools/m19_p1b_hotspot_origin_emit.py'
      - 'tools/m19_p1b_hotspot_draw_model.py'
      - 'tools/test_m19_p1b_hotspot_source_gate_a.py'
      - 'tools/m19_p1b_hotspot_draw_emit.py'
      - 'tools/build_m19_p1b_hotspot_in_memory.py'
      - 'tools/build_m19_p1b_hotspot_fixture.py'
      - 'tools/build_agapic_v2_r82_full_preview.py'
      - 'tools/build_agapic_v2_r82_api_preview.py'
      - 'tools/build_aga_r84_agapic.py'
      - 'tools/test_m19_p1a_getters_gate_a.py'
      - 'dist/AMOSPro_AGA.Lib'
      - 'tests/current/M19_B8_BOB_CLEAR_UPDATE_BC_01.asc'
      - 'tests/current/M19_P1B_HOTSPOT_BANK26.abk'
      - 'tools/active_library.py'
      - 'tools/test_m19_b8_clear_update_asc_static.py'
      - 'tools/test_m19_p1b_hotspot_draw_gate_a.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p1b-hotspot-native:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check unicorn==2.1.4 capstone==5.0.9
      - name: Python syntax and native CPU / delivery policy
        run: |
          python -B -m py_compile tools/m19_p1b_hotspot_origin_emit.py tools/m19_p1b_hotspot_draw_model.py tools/test_m19_p1b_hotspot_source_gate_a.py tools/m19_p1b_hotspot_draw_emit.py tools/build_m19_p1b_hotspot_in_memory.py tools/test_m19_p1b_hotspot_draw_gate_a.py tools/build_m19_p1b_hotspot_fixture.py
          python -B tools/native_cpu_policy.py --self-test
          python -B tools/check_aga_delivery_paths.py --self-test
      - name: Preserve old AGBO, Clear Update and P1a sources
        run: |
          python -B tools/test_m19_p0a_multi_bob_abk.py
          python -B tools/test_m19_bob_clear_update_model.py
      - name: Inspect exact P1a BOBS native group and verified safe join
        run: |
          PYTHONPATH=tools python -B - <<'PY'
          from compiler_relocation import unpack_ap20
          from compiler_bridge_v2_probe import DISPATCH_V2,MAX_UNIT_BYTES
          from build_m19_p1a_getters_in_memory import build_p1a
          from m19_b8_s1_bank_free_emit import emit_b8_s1_bank_free
          from m19_p0j_explicit_safe_draw_emit import emit_explicit_bob_draw
          image,_=build_p1a()
          _,parts,_=unpack_ap20(image)
          old,labels=emit_b8_s1_bank_free()
          draw,draw_labels=emit_explicit_bob_draw()
          print('P1B_LAYOUT',len(parts[177]),len(DISPATCH_V2),len(old),MAX_UNIT_BYTES)
          print('P1B_LABELS',{k:labels[k] for k in ('explicit_safe_blit_entry','draw_live_image_resolved','explicit_image_resolve_entry','explicit_bank_lookup_entry','explicit_frame_draw_entry','b8s1_bank_free_entry','b7_end_entry','b8_b7_end_trampoline_entry')})
          assert parts[177].startswith(DISPATCH_V2) and parts[177].endswith(old)
          assert len(parts[177])-len(DISPATCH_V2)-len(old)==7004
          print('P1B_SAFE_SIZE',len(draw),'B8 fifth',len(parts[181]))
          PY
      - name: Native hotspot MC68020 origin, masking and double buffering
        run: python -B tools/test_m19_p1b_hotspot_source_gate_a.py
      - name: Prove full P1b BOBS Safe-Blitter splice and AP20 build in memory
        run: |
          PYTHONPATH=tools python -B tools/m19_p1b_hotspot_draw_emit.py
          PYTHONPATH=tools python -B tools/build_m19_p1b_hotspot_in_memory.py
      - name: Real MC68020 Safe Blitter integration after valid AGBO
        run: PYTHONPATH=tools python -B tools/test_m19_p1b_hotspot_draw_gate_a.py
      - name: Verify promoted P2d LAST_GOOD while retaining historical P1b source fixture
        run: |
          PYTHONPATH=tools python -B - <<'PY'
          import pathlib,hashlib
          from build_m19_p1b_hotspot_in_memory import build_p1b,P1B_SHA,P1B_BYTES
          from build_m19_p1b_hotspot_fixture import fixture
          from active_library import P2D_SHA, S1P1E_SHA, P2DL2_SHA, P2DL2B_SHA, S1P1F_SHA, verify_active
          root=pathlib.Path('.')
          actual=(root/'dist/AMOSPro_AGA.Lib').read_bytes()
          expected,meta=build_p1b()
          assert len(expected)==P1B_BYTES and hashlib.sha256(expected).hexdigest()==P1B_SHA
          assert (root/'tests/current/M19_P1B_HOTSPOT_BANK26.abk').read_bytes()==fixture()
          cur,good,label=verify_active(root)
          assert cur==actual and hashlib.sha256(cur).hexdigest() in (P2D_SHA, S1P1E_SHA, P2DL2_SHA, P2DL2B_SHA, S1P1F_SHA)
          assert len(good)==136708 and hashlib.sha256(good).hexdigest()==P2DL2B_SHA
          print('P1B SOURCE EXACT SHA',P1B_SHA,'FIXTURE EXACT 200 bytes',flush=True)
          PY
      - name: Sole campaign AMOS static preflight (not WinUAE)
        run: |
          # The old B8 test ASC is archived and is no longer the sole active test.
          # Check the actual active P2 all-in-one test and its frozen evidence.
          PYTHONPATH=tools python -B tools/test_m19_p2_all_in_one_source.py
          PYTHONPATH=tools python -B tools/test_current_ram_log.py
          python -B tools/amos_preflight.py --strict-target tests/current/*.asc
      - name: Generators must not mutate canonical binary, fixture, or preserved tests
        run: git diff --exit-code -- dist/ tests/current/ tests/passed/
