name: M19 P2d L2 first Bind and L1 writers MC68020 Gate A
on:
  push:
    branches: [main]
    paths:
      - 'src/native/m19_p2d_l2/**'
      - 'src/native/m19_p2d_l1/**'
      - 'src/native/m19_p2d/**'
      - 'tools/build_m19_p2d_l1_safeport_in_memory.py'
      - 'tools/test_m19_p2d_l1_safeport_gate_a.py'
      - 'tools/build_m19_p2d_l2_first_bind_in_memory.py'
      - 'tools/test_m19_p2d_l2_first_bind_gate_a.py'
      - '.github/workflows/m19-p2d-l2-first-bind-gate-a.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  first-bind:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: CPU policy and test dependencies
        run: |
          python -B tools/native_cpu_policy.py --self-test
          python -B tools/check_aga_delivery_paths.py --self-test
          python -m pip install --disable-pip-version-check unicorn==2.1.4 capstone==5.0.9
          python -m py_compile tools/build_m19_p2d_l2_first_bind_in_memory.py tools/test_m19_p2d_l2_first_bind_gate_a.py
      - uses: actions/cache@v4
        id: vasm-cache
        with:
          path: ${{ runner.temp }}/vasm/vasmm68k_mot
          key: vasm-m68k-mot-${{ runner.os }}-${{ runner.arch }}-ubuntu2404-8b85ef6eb7d257bf29a56ddc63cf2be20a317256
      - name: Build pinned MC68020 assembler if needed
        if: steps.vasm-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/vasm"
          git -C "$RUNNER_TEMP/vasm" init
          git -C "$RUNNER_TEMP/vasm" remote add origin https://github.com/rhargreaves/vasm.git
          git -C "$RUNNER_TEMP/vasm" fetch --depth 1 origin 8b85ef6eb7d257bf29a56ddc63cf2be20a317256
          git -C "$RUNNER_TEMP/vasm" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/vasm" rev-parse HEAD)" = "8b85ef6eb7d257bf29a56ddc63cf2be20a317256"
          make -C "$RUNNER_TEMP/vasm" CPU=m68k SYNTAX=mot -j2
      - name: Exact L1 source identity then assemble L2 and execute combined MC68020
        run: python -B tools/test_m19_p2d_l2_first_bind_gate_a.py --vasm "$RUNNER_TEMP/vasm/vasmm68k_mot"
      - name: Record source-assembled change ranges for exact authorized L2 delivery
        env:
          PYTHONPATH: tools
        run: |
          python -B - <<'PY'
          import os
          from hashlib import sha256
          from pathlib import Path
          from build_m19_p2d_l2_first_bind_in_memory import build_l2
          from compiler_relocation import unpack_ap20
          image, meta = build_l2(Path(os.environ['RUNNER_TEMP']) / 'vasm/vasmm68k_mot')
          assert len(image) == 136332
          assert sha256(image).hexdigest() == 'b2811e56c12be23697f0bb3c60dbf67f01bdecae0cfb23a787e2d349070f44a1'
          _, p, title = unpack_ap20(image)
          # Only the source-assembled changed instructions and helpers, never
          # a downloadable library, workflow artifact or repository write.
          for name, data in (
              ('BACK_ENTRY', p[142][0xce8:0xcee]),
              ('IFF_ENTRY', p[142][0xe88:0xe8e]),
              ('UNIT142_TAIL', p[142][62740:]),
              ('BOBS_ENTRY', p[202][48958:48962]),
              ('BOBS_TAIL', p[202][60928:]),
              ('TITLE', title),
          ):
              print('L2_SOURCE_DELTA', name, data.hex())
          print('L2_EXACT_SHA', meta['sha256'])
          PY
      - name: Protect canonical distribution and current campaign
        run: git diff --exit-code -- dist/ tests/current/ tests/passed/ src/native/m19_p2d/
