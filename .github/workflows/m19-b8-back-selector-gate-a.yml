name: M19 B8 checked back BitMap selector - MC68020 Gate A

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m19-b8-back-selector-gate-a.yml'
      - 'tools/m19_b8_back_selector_emit.py'
      - 'tools/test_m19_b8_back_selector_gate_a.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b8-back-selector:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact MC68020 emulator dependencies
        run: python -m pip install --disable-pip-version-check capstone==5.0.9 unicorn==2.1.4
      - name: Compile source and inspect emitter
        run: |
          python -B -m py_compile tools/m19_b8_back_selector_emit.py tools/test_m19_b8_back_selector_gate_a.py
          python -B tools/m19_b8_back_selector_emit.py
      - name: Run real CPU020 Safe/Disp, front/back and ABI tests
        run: python -B tools/test_m19_b8_back_selector_gate_a.py
      - name: Verify active Lib and ASC SHA are unchanged
        run: |
          python -B - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          lib=Path('dist/AMOSPro_AGA.Lib').read_bytes()
          asc=Path('tests/current/M19_B7M1_BOB_LIFECYCLE_RUNTIME_01.asc').read_bytes()
          assert len(lib)==102400 and sha256(lib).hexdigest()=='242e5ed7e8f732bf4e613a462b8dd266269f8d6977911bac867f5db26f8c39c6'
          assert len(asc)==10911 and sha256(asc).hexdigest()=='a5b5325b677984fd18114e6983df1bebb3f04e3ce626a482fb4ef5a50665cdec'
          print('PASS B7-m2 and single active ASC unchanged')
          PY
