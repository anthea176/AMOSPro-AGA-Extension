name: OPT020 P3 targeted native Gate A

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/opt020-p3-target.yml"
      - "tools/test_opt020_p3_native_gate_a.py"
      - "tools/test_opt020_p3_ap20_probe.py"
      - "tools/build_opt020_p3_r73.py"
      - "tools/test_opt020_p3_r73_candidate.py"
      - "tools/generate_aga_native_source.py"
      - "tools/test_current_amos_blocks.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p3_native:
    if: "${{ github.event_name != 'push' || contains(github.event.head_commit.message, '[p3-target]') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install 68020 emulator and decoder
        if: "${{ !contains(github.event.head_commit.message, '[p3-audit-only]') }}"
        run: python -m pip install machine68k==0.4.0 capstone==5.0.9
      - name: Verify 8-plane pixel source model
        if: "${{ !contains(github.event.head_commit.message, '[p3-audit-only]') }}"
        run: python -B tools/test_opt020_p3_fast_icon_model.py
      - name: Execute real 68EC020/68020 capture and draw
        if: "${{ !contains(github.event.head_commit.message, '[p3-audit-only]') }}"
        run: python -B tools/test_opt020_p3_native_gate_a.py
      - name: Verify P3 V2 AP20 and branch integrity in memory
        run: python -B tools/test_opt020_p3_ap20_probe.py
      - name: Verify R73 deterministic native entries and mutated branch rejection (in memory)
        run: python -B tools/test_opt020_p3_r73_candidate.py
      - name: Verify installed R73 and strict native source without running AMOS Compiler
        run: |
          python -B tools/verify_fast.py
          python -B tools/build_aga_current.py
          python -B tools/test_current_amos_blocks.py
          python -B tools/test_compiler_bridge_v2_probe.py --static-only
          python -B tools/test_generate_current_native_source.py
      - name: Verify deterministic R73 binary without exporting the base64 again
        run: python -B tools/build_opt020_p3_r73.py
      - name: Guard active library and ASC
        run: git diff --exit-code -- dist/ tests/current/ tests/passed/ archive/
